<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Polylogue</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #172026; --muted: #5f6b76; --line: #d7dde2; --surface: #fff; --panel: #f4f7f9;
        --ok: #17805a; --warn: #9a5b00; --bad: #ad2f2f; --neutral: #59636e; --accent: #325d8f;
      }
      @media (prefers-color-scheme: dark) {
        :root { --ink: #eef1f6; --muted: #9aa4b2; --line: #2b3240; --surface: #0f1217; --panel: #161b22;
          --ok: #4ec98f; --warn: #e6b552; --bad: #f06a6a; --neutral: #8b95a3; --accent: #78a6d8; }
      }
      * { box-sizing: border-box; }
      body { width: 420px; margin: 0; color: var(--ink); background: var(--surface); font: 14px/1.45 system-ui, sans-serif; }
      main { display: grid; gap: 14px; padding: 16px; }
      h1 { margin: 0; font-size: 17px; }
      h2 { margin: 0 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
      p { margin: 0; }
      section { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
      section[hidden] { display: none; }
      .line { display: flex; align-items: center; gap: 8px; font-weight: 600; }
      .dot { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 999px; background: var(--neutral); }
      .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
      .meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
      .buttons { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
      button { font: inherit; min-height: 32px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px;
        color: var(--ink); background: var(--surface); cursor: pointer; }
      button.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
      button:disabled { opacity: .5; cursor: not-allowed; }
      ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
      li { display: grid; gap: 2px; }
      label { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      code { font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Polylogue</h1>

      <section aria-labelledby="polylogue-heading">
        <h2 id="polylogue-heading">Polylogue</h2>
        <div class="line"><span id="polylogue-dot" class="dot"></span><span id="polylogue-state">Checking…</span></div>
        <p id="polylogue-detail" class="meta"></p>
        <p id="waiting" class="meta" hidden></p>
      </section>

      <section aria-labelledby="page-heading">
        <h2 id="page-heading">This page</h2>
        <div class="line"><span id="page-dot" class="dot"></span><span id="page-state">Checking…</span></div>
        <p id="page-detail" class="meta"></p>
        <div class="buttons">
          <button id="capture" class="primary">Capture now</button>
          <button id="reader">Open in Polylogue</button>
        </div>
      </section>

      <section id="approvals-section" hidden aria-labelledby="approvals-heading">
        <h2 id="approvals-heading">Waiting for your approval</h2>
        <ul id="approvals"></ul>
      </section>

      <section id="backfill-section" hidden aria-labelledby="backfill-heading">
        <h2 id="backfill-heading">Backfill</h2>
        <ul id="backfill"></ul>
      </section>

      <section id="problems-section" hidden aria-labelledby="problems-heading">
        <h2 id="problems-heading">Recent problems</h2>
        <ul id="problems"></ul>
      </section>

      <section aria-labelledby="settings-heading">
        <h2 id="settings-heading">Settings</h2>
        <label>Capture conversations as they change <input id="automatic" type="checkbox"></label>
        <label>Show the Polylogue button on chat pages <input id="panel" type="checkbox"></label>
        <p class="meta">Start a backfill of older conversations with <code>polylogue backfill start chatgpt</code>.</p>
        <p id="version" class="meta"></p>
      </section>
    </main>
    <script src="wording.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
