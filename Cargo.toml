[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
polylogue-model = { path = "crates/model" }
polylogue-store = { path = "crates/store" }
hashed-blobs = { path = "crates/hashed-blobs" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"
blake3 = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
libc = "0.2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
