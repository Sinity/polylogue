[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Shared dependencies declare their required features here; crates inherit them
# with `workspace = true`. Dev-dependencies add test-only features. Checks and
# focused tests resolve the primary workspace graph, then select execution
# and native targets without changing that feature union.
[workspace.dependencies]
web-shell = { git = "https://github.com/Sinity/polylogue-sinex-common", branch = "master" }
command-surface = { git = "https://github.com/Sinity/polylogue-sinex-common", branch = "master", default-features = false }
authored = { git = "https://github.com/Sinity/polylogue-sinex-common", branch = "master" }
authored-generator = { git = "https://github.com/Sinity/polylogue-sinex-common", branch = "master" }
polylogue-model = { path = "crates/model" }
polylogue-sources = { path = "crates/sources" }
polylogue-store = { path = "crates/store" }
polylogue-engine = { path = "crates/engine" }
polylogue-query = { path = "crates/query" }
polylogue-render = { path = "crates/render" }
polylogue-sinex = { path = "crates/sinex" }
polylogue-testkit = { path = "crates/testkit" }
hashed-blobs = { git = "https://github.com/Sinity/polylogue-sinex-common", branch = "master" }
git-identity = { git = "https://github.com/Sinity/polylogue-sinex-common", branch = "master" }
query-language = { git = "https://github.com/Sinity/polylogue-sinex-common", branch = "master" }
references = { git = "https://github.com/Sinity/polylogue-sinex-common", branch = "master" }
canonical-json = { git = "https://github.com/Sinity/polylogue-sinex-common", branch = "master" }
signal-delivery = { git = "https://github.com/Sinity/polylogue-sinex-common", branch = "master" }
shared-signals = { package = "signals", git = "https://github.com/Sinity/polylogue-sinex-common", branch = "master" }
devkit = { git = "https://github.com/Sinity/polylogue-sinex-common", branch = "master", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value", "unbounded_depth", "preserve_order", "float_roundtrip"] }
schemars = { version = "1", features = ["uuid1"] }
thiserror = "2"
blake3 = "1"
memchr = "2"
zstd = "0.13"
jiff = { version = "0.2", default-features = false, features = ["std", "serde", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-always"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "blob", "hooks", "fallible_uint", "trace", "backup"] }
clap = { version = "4.6", features = ["string"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
notify = "8.2"
libc = "0.2"
rustix = { version = "1", features = ["fs", "net", "process", "event"] }
proptest = "1"
tempfile = "3"
base64 = "0.23"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v7", "v4"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "signal", "sync", "macros", "fs", "io-util"] }
unicode-normalization = "0.1"
strsim = "0.11"
ureq = { version = "3", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tower = { version = "0.5", features = ["util"] }
mimalloc = { version = "0.1", default-features = false, features = ["no_thp"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# The skeleton marks unwritten bodies with `todo!()`; deny again once filled.
todo = "warn"
unimplemented = "deny"

# Tests spend most of their CPU in SQLite and JSON, which are dependencies
# and stay optimized. Workspace code is compiled unoptimized: the store's
# unit-test binary took 301 s of CPU at level 1 and 57 s at level 0, and
# compiling, not running, is where checks spend their time.
# Line tables keep backtraces readable. Full debug info made each worktree's
# target directory 12-19 GB and every test link a heavy disk write.
[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = false
codegen-units = 256

[profile.dev.package."*"]
codegen-units = 16
opt-level = 2
debug = false
