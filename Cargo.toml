[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
polylogue-model = { path = "crates/model" }
polylogue-sources = { path = "crates/sources" }
polylogue-store = { path = "crates/store" }
polylogue-engine = { path = "crates/engine" }
polylogue-query = { path = "crates/query" }
polylogue-render = { path = "crates/render" }
credential-masking = { git = "https://github.com/Sinity/polylogue-sinex-common", tag = "v0.2.0" }
hashed-blobs = { git = "https://github.com/Sinity/polylogue-sinex-common", tag = "v0.2.0" }
devkit = { git = "https://github.com/Sinity/polylogue-sinex-common", tag = "v0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"
blake3 = "1"
zstd = "0.13"
jiff = { version = "0.2", default-features = false, features = ["std", "serde", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-always"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
pest = "2.8"
pest_derive = "2.8"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
notify = "8.2"
libc = "0.2"
tempfile = "3"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v7"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt"] }
schemars = "1"
unicode-normalization = "0.1"
strsim = "0.11"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# The skeleton marks unwritten bodies with `todo!()`; deny again once filled.
todo = "warn"
unimplemented = "deny"

# Tests spend most of their CPU in SQLite, JSON and the credential masker.
# Optimizing them cuts suite CPU by about three quarters; level 1 for the
# workspace keeps incremental rebuilds about as cheap as unoptimized ones.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
