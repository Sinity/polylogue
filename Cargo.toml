[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
polylogue-model = { path = "crates/model" }
polylogue-sources = { path = "crates/sources" }
polylogue-store = { path = "crates/store" }
polylogue-engine = { path = "crates/engine" }
polylogue-query = { path = "crates/query" }
polylogue-render = { path = "crates/render" }
polylogue-sinex = { path = "crates/sinex" }
polylogue-testkit = { path = "crates/testkit" }
credential-masking = { git = "https://github.com/Sinity/polylogue-sinex-common", tag = "v0.5.12" }
hashed-blobs = { git = "https://github.com/Sinity/polylogue-sinex-common", tag = "v0.5.12" }
devkit = { git = "https://github.com/Sinity/polylogue-sinex-common", tag = "v0.5.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
thiserror = "2"
blake3 = "1"
gix = { version = "0.89", default-features = false, features = ["sha1"] }
zstd = "0.13"
jiff = { version = "0.2", default-features = false, features = ["std", "serde", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-always"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
pest = "2.8"
pest_derive = "2.8"
clap = { version = "4.6", features = ["string"] }
clap_complete = "4.6"
notify = "8.2"
libc = "0.2"
proptest = "1"
tempfile = "3"
atomicwrites = "0.4.4"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v7"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt"] }
unicode-normalization = "0.1"
strsim = "0.11"
ureq = { version = "3", features = ["json"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
sha2 = "0.10"
tower = { version = "0.5", features = ["util"] }
mimalloc = { version = "0.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# The skeleton marks unwritten bodies with `todo!()`; deny again once filled.
todo = "warn"
unimplemented = "deny"

# Tests spend most of their CPU in SQLite, JSON and the credential masker.
# Optimizing them cuts suite CPU by about three quarters; level 1 for the
# workspace keeps incremental rebuilds about as cheap as unoptimized ones.
# Line tables keep backtraces readable. Full debug info made each worktree's
# target directory 12-19 GB and every test link a heavy disk write.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
