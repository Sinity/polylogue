[package]
name = "polylogue-sinex"
description = "Polylogue on Sinex (primary mode): the archive's row batches and input blobs sent to Sinex, and an empty archive restored from them"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3.workspace = true
polylogue-store.workspace = true
polylogue-model.workspace = true
hashed-blobs.workspace = true
sinex-protocol = { git = "https://github.com/Sinity/sinex", rev = "893a02bc4c4cfed252f83b668ff9f71992352bb1" }
sinex-transport = { git = "https://github.com/Sinity/sinex", rev = "893a02bc4c4cfed252f83b668ff9f71992352bb1" }
sinex-model = { git = "https://github.com/Sinity/sinex", rev = "893a02bc4c4cfed252f83b668ff9f71992352bb1" }
async-nats = "0.47"
tokio = { workspace = true, features = ["rt", "time", "macros"] }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "0.9"
tempfile.workspace = true

[dev-dependencies]
rusqlite.workspace = true
polylogue-testkit.workspace = true
polylogue-engine.workspace = true
devkit = { workspace = true, features = ["pg", "nats"] }

[lints]
workspace = true
