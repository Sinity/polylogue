[package]
name = "polylogue-sinex"
description = "Polylogue on Sinex (primary mode): the archive's row batches and input blobs sent to Sinex, and an empty archive restored from them"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
uuid.workspace = true
blake3.workspace = true
polylogue-store.workspace = true
polylogue-model.workspace = true
hashed-blobs.workspace = true
sinex-protocol = { git = "https://github.com/Sinity/sinex", rev = "c8a5e4b1eb7f9f6724d7d1da4ea8fe4c73722687" }
sinex-transport = { git = "https://github.com/Sinity/sinex", rev = "c8a5e4b1eb7f9f6724d7d1da4ea8fe4c73722687" }
sinex-model = { git = "https://github.com/Sinity/sinex", rev = "c8a5e4b1eb7f9f6724d7d1da4ea8fe4c73722687" }
async-nats = "0.47"
tokio = { workspace = true, features = ["rt", "time", "macros"] }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "0.9"
tempfile.workspace = true

[dev-dependencies]
rusqlite.workspace = true
polylogue-testkit.workspace = true
polylogue-engine.workspace = true
devkit = { workspace = true, features = ["pg", "nats"] }

[lints]
workspace = true
