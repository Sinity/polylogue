[package]
name = "polylogue-sinex"
description = "Polylogue on Sinex (primary mode): publishing archive rows and input bytes, and restoring an archive from Sinex"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
uuid.workspace = true
blake3.workspace = true
polylogue-store.workspace = true
hashed-blobs.workspace = true
sinex-protocol = { git = "https://github.com/Sinity/sinex", rev = "cd5d258b508db3fd8ee1646d26be2a7eeacb3feb" }
sinex-model = { git = "https://github.com/Sinity/sinex", rev = "cd5d258b508db3fd8ee1646d26be2a7eeacb3feb" }
async-nats = "0.47"
tokio = { workspace = true, features = ["rt", "time", "macros"] }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "0.9"

[dev-dependencies]
zip.workspace = true
polylogue-store = { workspace = true, features = ["fixture"] }
rusqlite = { workspace = true, features = ["backup"] }
polylogue-testkit.workspace = true
polylogue-engine.workspace = true
polylogue-model.workspace = true
tempfile.workspace = true
devkit = { workspace = true, features = ["pg", "nats"] }

[features]
faults = ["polylogue-engine/faults"]

[lints]
workspace = true
