[package]
name = "polylogue-sinex"
description = "Polylogue on Sinex: durable capture, canonical facts and a confirmed read index"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
schemars.workspace = true
base64.workspace = true
tempfile.workspace = true
blake3.workspace = true
polylogue-store.workspace = true
polylogue-model.workspace = true
hashed-blobs.workspace = true
query-language.workspace = true
shared-signals.workspace = true
jiff.workspace = true
sinex-protocol = { git = "https://github.com/Sinity/sinex", rev = "d6d2d9fe0a2bacc2f3970e66eea8d5b14d127a80" }
sinex-transport = { git = "https://github.com/Sinity/sinex", rev = "d6d2d9fe0a2bacc2f3970e66eea8d5b14d127a80" }
sinex-model = { git = "https://github.com/Sinity/sinex", rev = "d6d2d9fe0a2bacc2f3970e66eea8d5b14d127a80" }
# The same features as Sinex: JetStream over ring TLS. Leaving out NKeys,
# WebSockets, key-value, object store and service keeps their signing and
# socket crates out of the build.
async-nats = { version = "0.47", default-features = false, features = ["jetstream", "ring", "nuid", "server_2_10", "server_2_11", "server_2_12"] }
tokio.workspace = true
futures-util = "0.3"
uuid.workspace = true
serde.workspace = true
canonical-json.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "1.1"

[dev-dependencies]
polylogue-store = { workspace = true, features = ["fixture"] }
jsonschema = { version = "0.42", default-features = false }
polylogue-testkit.workspace = true
polylogue-engine.workspace = true
devkit = { workspace = true, features = ["pg", "nats"] }

[lints]
workspace = true
