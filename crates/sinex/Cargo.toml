[package]
name = "polylogue-sinex"
description = "Polylogue on Sinex (primary mode): publishing archive rows and input bytes, and restoring an archive from Sinex"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
polylogue-store.workspace = true
hashed-blobs.workspace = true
sinex-protocol = { git = "https://github.com/Sinity/sinex", rev = "d0c4b4a78274ea1e8d367b973b9854e5ed68b6d3" }
sinex-model = { git = "https://github.com/Sinity/sinex", rev = "d0c4b4a78274ea1e8d367b973b9854e5ed68b6d3" }
async-nats = "0.47"
tokio = { workspace = true, features = ["rt", "time", "macros"] }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "0.9"

[dev-dependencies]
polylogue-testkit.workspace = true
blake3.workspace = true
polylogue-engine.workspace = true
polylogue-model.workspace = true
tempfile.workspace = true
devkit = { workspace = true, features = ["pg", "nats"] }

[lints]
workspace = true
