[package]
name = "polylogue-sinex"
description = "Polylogue on Sinex (primary mode): inputs, records and parsed sessions sent to Sinex, and the local register rebuilt from it"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3.workspace = true
polylogue-store.workspace = true
polylogue-model.workspace = true
polylogue-query.workspace = true
hashed-blobs.workspace = true
sinex-protocol = { git = "https://github.com/Sinity/sinex", rev = "7e87515c3c47a8277af3deaabb3fe71e47c61f9e" }
sinex-transport = { git = "https://github.com/Sinity/sinex", rev = "7e87515c3c47a8277af3deaabb3fe71e47c61f9e" }
sinex-model = { git = "https://github.com/Sinity/sinex", rev = "7e87515c3c47a8277af3deaabb3fe71e47c61f9e" }
async-nats = "0.47"
tokio = { workspace = true, features = ["rt", "time", "macros"] }
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "0.9"
tempfile.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tokio = { workspace = true, features = ["sync"] }
polylogue-testkit.workspace = true
polylogue-engine.workspace = true
devkit = { workspace = true, features = ["pg", "nats"] }

[lints]
workspace = true
