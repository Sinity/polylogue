[package]
name = "polylogue-sinex"
description = "Polylogue on Sinex: durable capture, canonical facts and a confirmed read index"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
schemars = "1"
base64.workspace = true
tempfile.workspace = true
blake3.workspace = true
polylogue-store.workspace = true
polylogue-model.workspace = true
hashed-blobs.workspace = true
query-language.workspace = true
shared-signals.workspace = true
jiff.workspace = true
sinex-protocol = { git = "https://github.com/Sinity/sinex", rev = "b609f3efa8e2e708b564c23990494478fd6568b5" }
sinex-transport = { git = "https://github.com/Sinity/sinex", rev = "b609f3efa8e2e708b564c23990494478fd6568b5" }
sinex-model = { git = "https://github.com/Sinity/sinex", rev = "b609f3efa8e2e708b564c23990494478fd6568b5" }
async-nats = "0.47"
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros"] }
futures-util = "0.3"
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "0.9"

[dev-dependencies]
polylogue-store = { workspace = true, features = ["fixture"] }
jsonschema = { version = "0.42", default-features = false }
polylogue-testkit.workspace = true
polylogue-engine.workspace = true
devkit = { workspace = true, features = ["pg", "nats"] }

[lints]
workspace = true
