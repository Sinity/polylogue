[package]
name = "hashed-blobs"
version = "0.1.0"
edition = "2021"
description = "Bytes by BLAKE3 hash, plain or as a delta, sealed or not (joint #11, #12, #14, #19, #23, #24)"
publish = false

[dependencies]
blake3 = "1"
zstd = "0.13"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
