[package]
name = "polylogue-store"
description = "The only code that opens SQLite: archive.db, index.db, embeddings.db, the blob layer and the writer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
query-language.workspace = true
schemars = "1"
libc.workspace = true
polylogue-model.workspace = true
polylogue-query.workspace = true
strsim.workspace = true
hashed-blobs.workspace = true
rusqlite = { workspace = true, features = ["blob", "hooks"] }
blake3.workspace = true
memchr.workspace = true
zstd.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }
base64.workspace = true
thiserror.workspace = true
jiff.workspace = true
tempfile.workspace = true

[dev-dependencies]
serde_json = { workspace = true, features = ["preserve_order"] }
rusqlite = { workspace = true, features = ["hooks"] }

[lints]
workspace = true

[features]
# Test support: archives written row by row or through the writer
# (`fixture`).
fixture = []
# Test support: arm fault points (crate::fault); never enabled by a shipped build.
faults = []
