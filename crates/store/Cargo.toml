[package]
name = "polylogue-store"
description = "The only code that opens SQLite: archive.db, index.db, embeddings.db, the blob layer and the writer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
crossbeam-channel.workspace = true
query-language.workspace = true
schemars.workspace = true
libc.workspace = true
polylogue-model.workspace = true
polylogue-query.workspace = true
hashed-blobs.workspace = true
shared-signals.workspace = true
rusqlite.workspace = true
blake3.workspace = true
unicode-normalization.workspace = true
sha2 = "0.10"
zstd.workspace = true
uuid.workspace = true
serde.workspace = true
canonical-json.workspace = true
serde_json.workspace = true
base64.workspace = true
thiserror.workspace = true
jiff.workspace = true
tempfile.workspace = true
authored.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
polylogue-model = { workspace = true, features = ["fixture"] }
polylogue-query = { workspace = true, features = ["fixture"] }
authored-generator.workspace = true
proptest.workspace = true
shared-signals.workspace = true
# The integration target (tests/store/) reads archives the engine built.
polylogue-sources.workspace = true
polylogue-testkit.workspace = true

[[example]]
name = "archive_format_7"
test = true

[[example]]
name = "reuse_archive_index"
test = true

[lints]
workspace = true

[features]
# Test support: archives written row by row or through the writer
# (`fixture`), with the model's and the query catalog's test support.
fixture = ["polylogue-model/fixture", "polylogue-query/fixture"]
# Test support: arm fault points (crate::fault); never enabled by a shipped build.
faults = []
