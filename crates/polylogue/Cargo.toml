[package]
name = "polylogue"
description = "The Polylogue daemon, CLI, MCP server and hook command"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Polylogue on Sinex (primary mode); off in the default build, which then
# has no NATS dependency.
sinex = ["dep:polylogue-sinex"]

[dependencies]
command-surface.workspace = true
schemars = "1"
rustix = { workspace = true, features = ["event"] }
mimalloc.workspace = true
polylogue-sinex = { workspace = true, optional = true }
polylogue-model.workspace = true
polylogue-sources.workspace = true
polylogue-store.workspace = true
polylogue-engine.workspace = true
polylogue-query.workspace = true
query-language.workspace = true
hashed-blobs.workspace = true
jiff.workspace = true
libc.workspace = true
polylogue-render.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "macros", "fs", "io-util"] }
axum.workspace = true
tokio-util = { version = "0.7", features = ["io", "rt"] }
uuid.workspace = true
tower.workspace = true
base64.workspace = true
blake3.workspace = true
zstd.workspace = true
thiserror.workspace = true
tempfile.workspace = true
unicode-normalization.workspace = true
reqwest.workspace = true

[dev-dependencies]
zip.workspace = true
rustix = { workspace = true, features = ["pty"] }
rusqlite.workspace = true

polylogue-store = { workspace = true, features = ["fixture"] }
polylogue-testkit.workspace = true
proptest.workspace = true

[lints]
workspace = true
