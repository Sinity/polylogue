[package]
name = "polylogue"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
polylogue-query.workspace = true
credential-output.workspace = true
polylogue-engine.workspace = true
polylogue-model.workspace = true
polylogue-store.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
socket2 = "0.6.5"
rustix = { version = "1", features = ["event", "fs"] }
blake3.workspace = true
ctrlc = "3.5.2"
jiff = { version = "0.2", default-features = false, features = ["std"] }
tempfile.workspace = true
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
