[package]
name = "polylogue"
description = "The Polylogue daemon, CLI, MCP server and hook command"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Polylogue's Sinex event kinds. Primary mode is not built in this version:
# with the feature, a primary archive or configuration is refused at start.
sinex = ["dep:polylogue-sinex"]

[dependencies]
crossbeam-channel.workspace = true
command-surface = { workspace = true, features = ["runtime"] }
schemars.workspace = true

web-shell.workspace = true
maud = "0.27"

rustix.workspace = true
mimalloc.workspace = true
polylogue-sinex = { workspace = true, optional = true }
polylogue-model.workspace = true
polylogue-sources.workspace = true
polylogue-store.workspace = true
polylogue-engine.workspace = true
polylogue-query.workspace = true
query-language.workspace = true
hashed-blobs.workspace = true
git-identity.workspace = true
shared-signals.workspace = true
signal-delivery.workspace = true
zbus = { version = "5", default-features = false, features = ["tokio"] }
toml = "1.1"

jiff.workspace = true
libc.workspace = true
polylogue-render.workspace = true
polylogue-reading.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
canonical-json.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tokio-util = { version = "0.7", features = ["io", "rt"] }
uuid.workspace = true
ureq.workspace = true
sha2 = "0.10"
tower.workspace = true
base64.workspace = true
blake3.workspace = true
zstd.workspace = true
thiserror.workspace = true
tempfile.workspace = true
unicode-normalization.workspace = true
reqwest.workspace = true
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
fuzzy-matcher = "0.3"

[dev-dependencies]
polylogue-model = { workspace = true, features = ["fixture"] }
polylogue-query = { workspace = true, features = ["fixture"] }
polylogue-sources = { workspace = true, features = ["fixture"] }
zip.workspace = true
rustix = { workspace = true, features = ["pty"] }
rusqlite.workspace = true

polylogue-store = { workspace = true, features = ["fixture", "faults"] }
polylogue-testkit.workspace = true
query-language = { workspace = true, features = ["conformance"] }
proptest.workspace = true

[lints]
workspace = true
