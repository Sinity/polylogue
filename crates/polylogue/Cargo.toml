[package]
name = "polylogue"
description = "The Polylogue daemon, CLI, MCP server and hook command"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Polylogue on Sinex (primary mode); off in the default build, which then
# has no NATS dependency.
sinex = ["dep:polylogue-sinex"]

[dependencies]
polylogue-sinex = { workspace = true, optional = true }
polylogue-model.workspace = true
polylogue-sources.workspace = true
polylogue-store.workspace = true
polylogue-engine.workspace = true
polylogue-query.workspace = true
polylogue-render.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time"] }
axum.workspace = true
sha2.workspace = true
uuid.workspace = true
jiff.workspace = true
tower.workspace = true
schemars.workspace = true
base64.workspace = true
blake3.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
ureq.workspace = true

[dev-dependencies]
tempfile.workspace = true

polylogue-store = { workspace = true, features = ["fixture"] }
polylogue-testkit.workspace = true

[lints]
workspace = true
