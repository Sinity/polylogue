# `cargo xtask link-common` writes the included, Git-ignored file to build
# against a local checkout of polylogue-sinex-common.
include = [{ path = "local.toml", optional = true }]

[alias]
xtask = "run --quiet --locked -p xtask --"

[env]
# The capture reader must use the bundled connection's committed page view.
# Nothing reads SQLite's process-wide memory statistics or releases its memory
# on demand, and both took a global mutex on every allocation and page fetch:
# memory statistics are off, and each connection keeps its own page cache.
LIBSQLITE3_FLAGS = "-DSQLITE_ENABLE_DBPAGE_VTAB -DSQLITE_DEFAULT_MEMSTATUS=0 -USQLITE_ENABLE_MEMORY_MANAGEMENT"
