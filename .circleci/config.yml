version: 2.1

parameters:
  run_full_suite:
    type: boolean
    default: false

# CircleCI free-tier CI while GitHub Actions is billing-locked. Design keeps
# the per-push cost low:
#   - quick-gate (PRs + master pushes): `devtools verify --quick` itself (not a
#     hand-picked subset of its steps -- see
#     polylogue-ze5i: this job used to reimplement ruff/mypy/render-all as
#     separate `run` steps and silently diverged from what
#     devtools/verify.py's `if not commit:` block actually gates, so
#     schema-versioning and
#     every other check added to that block over time never ran in real CI
#     even though `.github/workflows/ci.yml` referenced them -- that GHA
#     workflow does not execute, only CircleCI does). No pytest; the test
#     suite's pre-merge gate remains the explicitly selected local or hosted
#     verification; this job is the publication gate. The standalone
#     `devtools gate test-collection` diagnoses import/collection failures;
#     an explicit complete-corpus run collects tests during execution.
#   - complete-verification: explicitly trigger a pipeline with
#     run_full_suite=true; no automatic or scheduled corpus run.
#   - dependency-audit (scheduled pipeline named "nightly"): dependency
#     security maintenance.
#   - release-verify (v* tags): build artifacts and store them.
# Operator setup (one-time, UI): Project Settings → Advanced → "Only build
# pull requests" ON; add a scheduled pipeline named "nightly" (master,
# 03:00 UTC). Publishing to PyPI stays a manual local act. Complete-corpus
# runs remain explicit, never a scheduled publication prerequisite.

commands:
  bootstrap:
    steps:
      - checkout
      - run:
          name: Install uv
          command: curl -LsSf https://astral.sh/uv/install.sh | sh
      - restore_cache:
          keys:
            - uv-v1-{{ checksum "uv.lock" }}
            - uv-v1-
      - run:
          name: Sync environment (frozen)
          command: ~/.local/bin/uv sync --extra dev --extra sqlite-compat --group audit --frozen
      - save_cache:
          key: uv-v1-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv
  prepare-history:
    steps:
      - run:
          name: Fetch the schema comparison history
          # The schema gate requires a merge base with master (or its first
          # parent on master), including on fresh isolated checkouts.
          command: |
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow origin
            fi
            git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master

jobs:
  quick-gate:
    docker:
      - image: cimg/python:3.14
    resource_class: medium
    environment: &polylogue_ci_env
      POLYLOGUE_ARCHIVE_ROOT: /tmp/polylogue-archive
      POLYLOGUE_FORCE_PLAIN: "1"
      HYPOTHESIS_PROFILE: ci
      POLYLOGUE_PYTEST_BASETEMP_ROOT: /tmp/polylogue-pytest
      POLYLOGUE_PYTEST_WORKERS: "2"
    steps:
      - bootstrap
      - prepare-history
      - restore_cache:
          keys:
            - mypy-v2-{{ .Branch }}
            - mypy-v2-master
            - mypy-v2-
      - run:
          name: devtools verify --quick
          # Pushes to master run on the default branch by design.
          command: ~/.local/bin/uv run devtools verify --quick --on-default-branch
      - save_cache:
          key: mypy-v2-{{ .Branch }}-{{ epoch }}
          paths:
            # The gate checks on the checkout cache (devtools/mypy_gate.py).
            - .cache/mypy
            # Rendered base-commit schema states; see verify_schema_manifest.
            - .cache/verify/schema-state
  verify-complete:
    docker:
      - image: cimg/python:3.14
    resource_class: medium
    environment: *polylogue_ci_env
    steps:
      - bootstrap
      - prepare-history
      - run:
          name: Verify complete corpus in the isolated runner
          command: ~/.local/bin/uv run devtools verify --runner isolated --all --on-default-branch
      - run:
          name: Require candidate-bound test evidence
          command: ~/.local/bin/uv run python -m devtools.verify_receipt_check --candidate "$CIRCLE_SHA1"
      - run:
          name: Preserve only the verification receipt
          when: always
          command: |
            mkdir -p /tmp/verification-receipts
            ~/.local/bin/uv run python -c '
            from pathlib import Path
            import shutil
            from devtools.verify_receipt_check import current_run_id, run_receipt_path
            root = Path.cwd()
            pointer = root / ".cache/verify/current-run.json"
            if pointer.is_file():
                receipt = run_receipt_path(root, current_run_id(root))
                shutil.copyfile(pointer, "/tmp/verification-receipts/current-run.json")
                if receipt.is_file():
                    shutil.copyfile(receipt, "/tmp/verification-receipts/run.json")
            '
      - store_artifacts:
          path: /tmp/verification-receipts
          destination: verification-receipts
  dependency-audit:
    docker:
      - image: cimg/python:3.14
    resource_class: medium
    environment: *polylogue_ci_env
    steps:
      - bootstrap
      - run:
          name: Dependency security audit
          command: ~/.local/bin/uv run pip-audit --strict --skip-editable

  release-verify:
    docker:
      - image: cimg/python:3.14
    resource_class: medium
    steps:
      - bootstrap
      - run:
          name: Build distributions
          command: ~/.local/bin/uv build
      - run:
          name: Verify distribution
          command: ~/.local/bin/uv run devtools gate distribution --work-dir /tmp/dist-verify
      - store_artifacts:
          path: dist
          destination: dist

workflows:
  complete-verification:
    when:
      and:
        - << pipeline.parameters.run_full_suite >>
        - not:
            equal: [scheduled_pipeline, << pipeline.trigger_source >>]
    jobs:
      - verify-complete
  gate:
    when:
      not:
        equal: [scheduled_pipeline, << pipeline.trigger_source >>]
    jobs:
      - quick-gate:
          filters:
            tags:
              ignore: /.*/
      - release-verify:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
  nightly:
    when:
      and:
        - equal: [scheduled_pipeline, << pipeline.trigger_source >>]
        - equal: [nightly, << pipeline.schedule.name >>]
    jobs:
      - dependency-audit
