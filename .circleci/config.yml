version: 2.1

# CircleCI free-tier CI while GitHub Actions is billing-locked. Design keeps
# the per-push cost low:
#   - quick-gate (PRs + master pushes): `devtools verify --quick` itself (not a
#     hand-picked subset of its steps -- see
#     polylogue-ze5i: this job used to reimplement ruff/mypy/render-all as
#     separate `run` steps and silently diverged from what
#     devtools/verify.py's `if not commit:` block actually gates, so
#     schema-versioning and
#     every other check added to that block over time never ran in real CI
#     even though `.github/workflows/ci.yml` referenced them -- that GHA
#     workflow does not execute, only CircleCI does). No pytest; the test
#     suite's pre-merge gate remains the explicitly selected local or hosted
#     verification; this job is the publication gate. The standalone
#     `devtools gate test-collection` diagnoses import/collection failures;
#     an explicit complete-corpus run collects tests during execution.
#   - dependency-audit (scheduled pipeline named "nightly"): dependency
#     security maintenance.
#   - release-verify (v* tags): build artifacts and store them.
# Operator setup (one-time, UI): Project Settings → Advanced → "Only build
# pull requests" ON; add a scheduled pipeline named "nightly" (master,
# 03:00 UTC). Publishing to PyPI stays a manual local act. Complete-corpus
# runs remain explicit, never a scheduled publication prerequisite.

commands:
  bootstrap:
    steps:
      - checkout
      - run:
          name: Install uv
          command: curl -LsSf https://astral.sh/uv/install.sh | sh
      - restore_cache:
          keys:
            - uv-v1-{{ checksum "uv.lock" }}
            - uv-v1-
      - run:
          name: Sync environment (frozen)
          command: ~/.local/bin/uv sync --extra dev --extra sqlite-compat --group audit --frozen
      - save_cache:
          key: uv-v1-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv

jobs:
  quick-gate:
    docker:
      - image: cimg/python:3.14
    resource_class: medium
    environment: &polylogue_ci_env
      POLYLOGUE_ARCHIVE_ROOT: /tmp/polylogue-archive
      POLYLOGUE_FORCE_PLAIN: "1"
      HYPOTHESIS_PROFILE: ci
      POLYLOGUE_PYTEST_BASETEMP_ROOT: /tmp/polylogue-pytest
      POLYLOGUE_PYTEST_WORKERS: "2"
    steps:
      - bootstrap
      - restore_cache:
          keys:
            - mypy-v2-{{ .Branch }}
            - mypy-v2-master
            - mypy-v2-
      - run:
          name: devtools verify --quick
          # Pushes to master run on the default branch by design.
          command: ~/.local/bin/uv run devtools verify --quick --on-default-branch
      - save_cache:
          key: mypy-v2-{{ .Branch }}-{{ epoch }}
          paths:
            # The gate checks on the checkout cache (devtools/mypy_gate.py).
            - .cache/mypy
            # Rendered base-commit schema states; see verify_schema_manifest.
            - .cache/verify/schema-state
  stacked-review-threads:
    # Branch protection resolves conversations on master only, so a PR merged
    # into this PR's head branch (at any stack depth) is never gated there.
    # Fails while any such PR has an unresolved review thread, naming each PR
    # and thread. Resolving a thread triggers no pipeline: rerun this job.
    # Reads threads with the project's GH_TOKEN environment variable.
    docker:
      - image: cimg/python:3.14
    resource_class: small
    steps:
      - checkout
      - run:
          name: Unresolved review threads on PRs stacked into this PR
          command: |
            if [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              echo "Not a pull request build; nothing to evaluate."
              exit 0
            fi
            # A fork PR's head branch lives in the fork, and a PR can only
            # merge into a branch of this repository, so nothing stacks on it.
            if [ -n "${CIRCLE_PR_USERNAME:-}" ]; then
              echo "Fork pull request; no PR in this repository can merge into its head."
              exit 0
            fi
            python -m devtools.stacked_review_threads \
              --repo "$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" \
              --pr "${CIRCLE_PULL_REQUEST##*/}"

  dependency-audit:
    docker:
      - image: cimg/python:3.14
    resource_class: medium
    environment: *polylogue_ci_env
    steps:
      - bootstrap
      - run:
          name: Dependency security audit
          command: ~/.local/bin/uv run pip-audit --skip-editable || true

  release-verify:
    docker:
      - image: cimg/python:3.14
    resource_class: medium
    steps:
      - bootstrap
      - run:
          name: Build distributions
          command: ~/.local/bin/uv build
      - run:
          name: Verify distribution
          command: ~/.local/bin/uv run devtools gate distribution --work-dir /tmp/dist-verify
      - store_artifacts:
          path: dist
          destination: dist

workflows:
  gate:
    when:
      not:
        equal: [scheduled_pipeline, << pipeline.trigger_source >>]
    jobs:
      - quick-gate:
          filters:
            tags:
              ignore: /.*/
      - stacked-review-threads:
          filters:
            branches:
              ignore: master
            tags:
              ignore: /.*/
      - release-verify:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
  nightly:
    when:
      and:
        - equal: [scheduled_pipeline, << pipeline.trigger_source >>]
        - equal: [nightly, << pipeline.schedule.name >>]
    jobs:
      - dependency-audit
