version: 2.1

# CircleCI free-tier CI while GitHub Actions is billing-locked. Design keeps
# the per-push cost low:
#   - quick-gate (PRs + master pushes): `devtools verify --quick` itself (not a
#     hand-picked subset of its steps -- see
#     polylogue-ze5i: this job used to reimplement ruff/mypy/render-all as
#     separate `run` steps and silently diverged from what
#     devtools/verify.py's `if not commit:` block actually gates, so
#     schema-versioning and
#     every other check added to that block over time never ran in real CI
#     even though `.github/workflows/ci.yml` referenced them -- that GHA
#     workflow does not execute, only CircleCI does). No pytest; the test
#     suite's pre-merge gate remains the explicitly selected local or hosted
#     verification; this job is the publication gate.
#   - policy-checks (scheduled pipeline named "nightly"): policy checks that
#     are not cheap/deterministic enough for every push (timestamp-doctrine).
#     Runs nightly so a policy that fails continuously is at least visible
#     somewhere.
#   - dependency-audit (scheduled pipeline named "nightly"): dependency
#     security maintenance.
#   - release-verify (v* tags): build artifacts and store them.
# Operator setup (one-time, UI): Project Settings → Advanced → "Only build
# pull requests" ON; add a scheduled pipeline named "nightly" (master,
# 03:00 UTC). Publishing to PyPI stays a manual local act. Complete-corpus
# runs remain explicit, never a scheduled publication prerequisite.

commands:
  bootstrap:
    steps:
      - checkout
      - run:
          name: Install uv
          command: curl -LsSf https://astral.sh/uv/install.sh | sh
      - restore_cache:
          keys:
            - uv-v1-{{ checksum "uv.lock" }}
            - uv-v1-
      - run:
          name: Sync environment (frozen)
          command: ~/.local/bin/uv sync --extra dev --extra sqlite-compat --group audit --frozen
      - save_cache:
          key: uv-v1-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv

jobs:
  quick-gate:
    docker:
      - image: cimg/python:3.14
    resource_class: medium
    environment: &polylogue_ci_env
      POLYLOGUE_ARCHIVE_ROOT: /tmp/polylogue-archive
      POLYLOGUE_FORCE_PLAIN: "1"
      HYPOTHESIS_PROFILE: ci
      POLYLOGUE_PYTEST_BASETEMP_ROOT: /tmp/polylogue-pytest
      POLYLOGUE_PYTEST_WORKERS: "2"
    steps:
      - bootstrap
      - restore_cache:
          keys:
            - mypy-v1-{{ .Branch }}
            - mypy-v1-master
            - mypy-v1-
      - run:
          name: devtools verify --quick
          command: ~/.local/bin/uv run devtools verify --quick
      - save_cache:
          key: mypy-v1-{{ .Branch }}-{{ epoch }}
          paths:
            - .mypy_cache

  lab-policies:
    docker:
      - image: cimg/python:3.14
    resource_class: medium
    environment: *polylogue_ci_env
    steps:
      - bootstrap
      # Each currently-red check runs with `when: always` so one failure
      # doesn't hide the pass/fail signal of the others in the same job.
      - run:
          name: policy timestamp-doctrine
          command: ~/.local/bin/uv run devtools gate timestamp-doctrine
          when: always
  dependency-audit:
    docker:
      - image: cimg/python:3.14
    resource_class: medium
    environment: *polylogue_ci_env
    steps:
      - bootstrap
      - run:
          name: Dependency security audit
          command: ~/.local/bin/uv run pip-audit --skip-editable || true

  release-verify:
    docker:
      - image: cimg/python:3.14
    resource_class: medium
    steps:
      - bootstrap
      - run:
          name: Build distributions
          command: ~/.local/bin/uv build
      - run:
          name: Verify distribution
          command: ~/.local/bin/uv run devtools gate distribution --work-dir /tmp/dist-verify
      - store_artifacts:
          path: dist
          destination: dist

workflows:
  gate:
    when:
      not:
        equal: [scheduled_pipeline, << pipeline.trigger_source >>]
    jobs:
      - quick-gate:
          filters:
            tags:
              ignore: /.*/
      - release-verify:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
  nightly:
    when:
      and:
        - equal: [scheduled_pipeline, << pipeline.trigger_source >>]
        - equal: [nightly, << pipeline.schedule.name >>]
    jobs:
      - dependency-audit
      - lab-policies
