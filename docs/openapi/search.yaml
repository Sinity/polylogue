        in: query
        description: Page size (default 50).
        required: false
        schema:
          type: integer
          minimum: 1
          default: 50
      - name: offset
        in: query
        description: Row offset. Best-effort for ranked search; use ``next_cursor`` for stable pagination.
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: provider
        in: query
        description: Provider name filter.
        required: false
        schema:
          type: string
      - name: origin
        in: query
        description: Public origin filter for session-list mode.
        required: false
        schema:
          type: string
      - name: repo
        in: query
        description: Repository filter for session-list mode.
        required: false
        schema:
          type: string
      - name: since
