  /api/sessions/{session_id}/read:
    get:
      summary: Execute a session read-view
      description: Executes one supported single-session read profile and returns the stable ``SessionReadViewEnvelope``.
        Supported profiles currently include ``messages``, ``raw``, ``context``, ``context-image``, ``neighbors``, ``correlation``,
        ``effective_context``, ``lineage``, ``topology``. The envelope shape is stable; individual ``payload`` content is
        the shared DTO for the selected read profile.
      operationId: readSessionView
      security:
      - machineBearer: []
      - webCredentialCookie: []
      parameters:
      - name: session_id
        in: path
        description: Resolved Polylogue session id.
        required: true
        schema:
          type: string
      - name: view
        in: query
        description: Read-view id from /api/read-view-profiles.
        required: false
        schema:
          type: string
          enum:
          - messages
          - raw
          - context
          - context-image
          - neighbors
          - correlation
          - effective_context
          - lineage
          - topology
          default: messages
      - name: format
        in: query
        description: Output format accepted by the selected read view.
        required: false
        schema:
          type: string
          enum:
          - json
          default: json
      - name: limit
        in: query
        required: false
        description: Messages/neighbor page size where applicable.
        schema:
          type: integer
          minimum: 1
      - name: offset
        in: query
        required: false
        description: Message offset for the messages view.
        schema:
          type: integer
          minimum: 0
      - name: around
        in: query
        required: false
        description: Message id to centre the messages window on. The route resolves it to the offset of the limit-sized window
          containing that message and reports that offset; a message that is not part of the session is refused with message_not_found
          rather than answered with page zero.
        schema:
          type: string
      - name: related_limit
        in: query
        required: false
        description: Number of related sessions to include in the context view.
        schema:
          type: integer
          minimum: 1
          default: 5
      - name: include_messages
        in: query
        required: false
        description: Include message excerpts in context-image payloads.
        schema:
          type: boolean
          default: true
      - name: max_tokens
        in: query
        required: false
        description: Token budget for the compiled context image; over-budget segments are omitted.
        schema:
          type: integer
          minimum: 1
      - name: no_redact
        in: query
        required: false
        description: Return unredacted context-image path/provenance details where available.
        schema:
          type: boolean
          default: false
      - name: window_hours
        in: query
        required: false
        description: Neighbor discovery window in hours.
        schema:
          type: integer
          minimum: 1
          default: 24
      - name: confidence_threshold
        in: query
        required: false
        description: Minimum confidence for correlation evidence.
        schema:
          type: number
          minimum: 0
          maximum: 1
          default: 0.3
      - name: repo_path
        in: query
        required: false
        description: Repository path for correlation evidence.
        schema:
          type: string
      - name: since_hours
        in: query
        required: false
        description: Correlation scan window on each side of the session.
        schema:
          type: integer
          minimum: 1
          default: 2
      - name: at_position
        in: query
        required: false
        description: 'Read-view option advertised by /api/read-view-profiles: at_position.'
        schema:
          type: string
      - name: node_offset
        in: query
        required: false
        description: 'Read-view option advertised by /api/read-view-profiles: node_offset.'
        schema:
          type: string
      - name: node_limit
        in: query
        required: false
        description: 'Read-view option advertised by /api/read-view-profiles: node_limit.'
        schema:
          type: string
      - name: edge_offset
        in: query
        required: false
        description: 'Read-view option advertised by /api/read-view-profiles: edge_offset.'
        schema:
          type: string
      - name: edge_limit
        in: query
        required: false
        description: 'Read-view option advertised by /api/read-view-profiles: edge_limit.'
        schema:
          type: string
      responses:
        '200':
          description: Executed read-view envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionReadViewEnvelope'
        '400':
          description: Unsupported view/format or credential-shaped query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryErrorPayload'
        '404':
          description: Session not found.
        '401':
          description: Machine bearer or web credential was not accepted.
          headers:
            X-Polylogue-Web-Credential-State:
              description: Present when the first-party web credential was evaluated.
              schema:
                type: string
                enum: *id001
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/QueryErrorPayload'
                - $ref: '#/components/schemas/WebCredentialFailurePayload'
        '403':
          description: Host, origin, or web credential scope was not admitted.
          headers:
            X-Polylogue-Web-Credential-State:
              description: Present when the first-party web credential was evaluated.
              schema:
                type: string
                enum: *id001
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/QueryErrorPayload'
                - $ref: '#/components/schemas/WebCredentialFailurePayload'
