  securitySchemes:
    machineBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Machine-client token configured by --api-auth-token.
    webCredentialCookie:
      type: apiKey
      in: cookie
      name: polylogue_web_credential
      description: 'Short-lived, origin-bound HttpOnly credential issued by bootstrapWebCredential. Browser clients use credentials:
        same-origin and never read the cookie value.'
  x-polylogue-ranking-policy:
    default: mixed-bm25-rrf-vector
    version: '1'
    description: The ``ranking_policy`` and ``ranking_policy_version`` fields on ``SearchEnvelope`` declare the ordering semantics
      in use. Consumers should pin a known version and treat any change as a contract event.
x-polylogue-route-contracts:
- method: GET
  pattern: /
  kind: browser_shell
  stability: shell_supported
  auth_policy: unauthenticated_loopback
  response_contract: semantic archive overview HTML
  notes: Canonical typed WebUI overview; browser data access remains behind the authenticated /api boundary.
- method: GET
  pattern: /observability
  kind: browser_shell
  stability: shell_supported
  auth_policy: credential_if_configured
  response_contract: semantic observability HTML
  notes: SSR-first registry and status projection; credentials protect embedded insight evidence when configured.
- method: GET
  pattern: /cost
  kind: browser_shell
  stability: shell_supported
  auth_policy: credential_if_configured
  response_contract: semantic cost/usage HTML
  notes: SSR-first registry-driven cost rollup, usage timeline, and session drill-down; credentials protect embedded spend
    evidence when configured.
- method: GET
  pattern: /sessions
  kind: browser_shell
  stability: shell_supported
  auth_policy: unauthenticated_loopback
  response_contract: semantic session list HTML
  notes: SSR-first origin/date/repo faceted session list; Preact enhances only bounded pagination.
- method: GET
  pattern: /sessions/:session_id
  kind: browser_shell
  stability: shell_supported
  auth_policy: unauthenticated_loopback
  response_contract: semantic session read HTML
  notes: 'SSR-first session shell: header, lineage banner, and a simple message-flow placeholder Preact enhances with paging.'
- method: GET
  pattern: /search
  kind: browser_shell
  stability: shell_supported
  auth_policy: unauthenticated_loopback
  response_contract: semantic search results HTML
  notes: SSR-first ranked search over the shared SearchEnvelope; Preact enhances only cursor-based pagination.
- method: GET
  pattern: /assets/:asset
  kind: browser_shell
  stability: shell_supported
  auth_policy: unauthenticated_loopback
  response_contract: manifest-governed immutable Vite asset
  notes: Only content-hashed files named by the packaged Vite manifest are served.
- method: GET
  pattern: /s/:session_id
  kind: browser_shell
  stability: shell_supported
  auth_policy: unauthenticated_loopback
  response_contract: semantic session read HTML
  notes: Typed WebUI session deep-link; equivalent to /sessions/:session_id.
- method: GET
  pattern: /w/:mode
  kind: browser_shell
  stability: shell_supported
  auth_policy: unauthenticated_loopback
  response_contract: text/html web shell
  notes: Workspace shell bootstrap for registered workspace modes.
- method: GET
  pattern: /p
  kind: browser_shell
  stability: shell_supported
  auth_policy: unauthenticated_loopback
  response_contract: text/html paste browser
  notes: Standalone reader page; archive API calls remain authenticated.
- method: GET
  pattern: /a
  kind: browser_shell
  stability: shell_supported
  auth_policy: unauthenticated_loopback
  response_contract: text/html attachment library
  notes: Standalone reader page; archive API calls remain authenticated.
- method: GET
  pattern: /healthz/live
  kind: operational
  stability: operational
  auth_policy: unauthenticated_loopback
  response_contract: health liveness JSON
  notes: Unauthenticated for systemd/docker/kubernetes probes.
- method: GET
  pattern: /healthz/ready
  kind: operational
  stability: operational
  auth_policy: unauthenticated_loopback
  response_contract: health readiness JSON
  notes: Unauthenticated for systemd/docker/kubernetes probes.
- method: GET
  pattern: /metrics
  kind: operational
  stability: operational
  auth_policy: unauthenticated_loopback
  response_contract: Prometheus text exposition
  notes: Unauthenticated for Prometheus scrapers; no raw archive content.
- method: GET
  pattern: /api/sessions
  kind: read_query
  stability: stable
  auth_policy: credential_if_configured
  response_contract: SearchEnvelope | SessionListResponse
  notes: declaration=daemon.find.sessions; request=SessionSearchQuery
  domain_operation: sessions.find
- method: GET
  pattern: /api/status
  kind: operational
  stability: stable
  auth_policy: credential_if_configured
  response_contract: DaemonStatusPayload
  notes: declaration=daemon.status; request=StatusQuery
  domain_operation: daemon.status
- method: GET
  pattern: /api/query-units
  kind: read_query
  stability: stable
  auth_policy: credential_if_configured
  response_contract: QueryUnitResultEnvelope
  notes: declaration=daemon.query.units; request=QueryUnitQuery
  domain_operation: query.units
- method: GET
  pattern: /api/sessions/:id/read
  kind: read_detail
  stability: stable
