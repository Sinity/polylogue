x-polylogue-query-ast:
  schema_version: polylogue.query-explain-ast.v1
  schema: '#/components/schemas/QueryExpressionExplanationAst'
  description: Canonical, versioned projection of the query DSL's compiled predicate tree, unit-source pipeline, and lowering
    plan. Every query DSL expression -- fielded compact queries, ``sessions where ...`` Boolean expressions, terminal unit
    sources (``actions where ...``), and durable-reference pipelines (``from result-set:... | ...``) -- lowers to this one
    documented shape. Obtain it via the MCP ``explain`` operation (``kind="query"``) or ``Polylogue.explain_query_expression(expression)``;
    there is no separate HTTP route yet (tracked as a future extension of this schema's live surface).
