        in: query
        description: 'Explicit unit-source expression for the first page. Omit it when passing an opaque ``continuation``.
          Examples: ``messages where session.repo:polylogue AND role:assistant AND text:timeout``; ``actions where session.repo:polylogue
          AND tool:bash AND text:pytest``; ``blocks where session.origin:codex-session AND type:code AND text:timeout``; ``assertions
          where kind:decision AND status:active AND text:review``; ``files where session.repo:polylogue AND action:file_edit
          AND path:archive/query``; ``runs where session.repo:polylogue AND role:main``; ``observed-events where kind:tool_finished
          AND status:failed | group by tool | count``; ``context-snapshots where boundary:session_start``; ``delegations where
          mapping_state:resolved AND instruction:review``.'
        required: false
        schema:
          type: string
      - name: continuation
        in: query
        description: Opaque QueryTransaction continuation returned by the previous page. Pass it back unchanged and without
