# The joint vision catalog: uses that need both Polylogue and Sinex.
# Same form as polylogue-spec/vision/uses.toml and sinex-spec/vision/uses.toml;
# `reads` names Polylogue query units as "polylogue:<unit>" and Sinex event kinds
# as "sinex:<kind>". Draft by the Polylogue session, 2026-10-12; the Sinex session
# adds the Sinex side of each gap.

[features]   # feature -> the joint text that owns it
brief_machine = "decisions.md#18"
resolved_objects = "decisions.md#28"
one_store = "decisions.md#27"
logical_day = "decisions.md#15"
claims = "decisions.md#16"
read_as = "decisions.md#17"
turns = "decisions.md#22"
change_feed = "topics/03-transport.md"

[[use]]
id = "failure-with-machine-context"
title = "What the machine was doing when an agent's run failed"
act = "this cargo test failed in session X: what else was running, and was the disk or memory under pressure then?"
reads = ["polylogue:tool_calls", "polylogue:turns", "sinex:command.executed", "sinex:command.started", "sinex:resource.sampled", "sinex:process.killed", "sinex:log.line"]
needs = ["turns", "brief_machine"]
shows = "the failing call, its turn's span, and the machine events and pressure inside that span"
mark = "intended"
consumer = "agent"
origin = "expanded"
cite = "joint #18 (machine section) and #22 (turn spans)"
prototype = ""
gaps = ["Sinex side: process starts are recorded by `system.audit` (execve, kept as material with per-minute summaries, planned) and the asciinema reader's `command.started`; per-process questions need a replay of the audit material into events, the same limit as network flows. Memory and disk pressure are `resource.sampled` (planned, `system.machine-telemetry`), out-of-memory kills `process.killed`"]
level = 0

[[use]]
id = "time-per-project"
title = "Where my time went, by project, across terminal, editor and agents"
act = "how much of this week went to Polylogue, counting my own terminal and editor time and the agents I ran?"
reads = ["polylogue:sessions", "polylogue:turns", "sinex:window.focused", "sinex:command.executed"]
needs = ["turns", "logical_day"]
shows = "hours per project per logical day, split into operator time and agent time, each figure with its sources"
mark = "intended"
consumer = "agent"
origin = "seeded"
cite = "sinex intent-origins 2025-06-13 ('show what I'm doing with my time at will'); polylogue vision"
prototype = ""
gaps = ["project identity across sources: a repository path in Polylogue and a window title in Sinex name the same project only by evidence, which needs the entity layer", "Sinex side, narrower than an entity layer: Sinex already computes `project` from `cwd`, a repository path or a window title against the configured project list (`sinex-spec/spec/query.md` \u00a73.1), and Polylogue sessions carry `cwd` and the git repository, so repositories join on that list. The entity layer is needed only for names outside the list (a window title naming no path)"]
level = 0

[[use]]
id = "chats-vs-project"
title = "Chats checked against the current state of a project"
act = "which ideas in my chats about Sinex are done, still relevant, or never realized?"
reads = ["polylogue:messages", "polylogue:notes", "sinex:commit.created"]
needs = ["claims", "resolved_objects"]
shows = "each idea from the chats with its state (done with the commit, open, superseded), every state a checked claim"
mark = "intended"
consumer = "agent"
origin = "seeded"
cite = "uses-from-chats.md `chats-vs-project` (ChatGPT 2026-06-16, 06-19, 06-23)"
prototype = ""
gaps = ["ideas are not a unit: extracting them is a rubric pass (joint #16) with no defined output kind", "commits link to sessions, not to ideas", "Sinex side: a commit joins a session by the commit hash both record (`related`, an exact shared key), so only the idea-to-commit link needs the ideas unit"]
level = 0

[[use]]
id = "idea-ledger"
title = "All my ideas, and how they tie together"
act = "show every idea I've raised, across chats, journal and notes, grouped by the project or concept it belongs to"
reads = ["polylogue:messages", "sinex:note.observed", "sinex:operator.log.entry"]
needs = ["claims"]
shows = "a ledger of ideas, each with where it was raised and the concepts it connects to"
mark = "intended"
consumer = "agent"
origin = "seeded"
cite = "uses-from-chats.md `idea-ledger` (ChatGPT 2025-05-10; AI Studio 2025-08-28) and the Sinex section's `project-ledger`"
prototype = ""
gaps = ["entity identity: a concept named differently in a chat and a note", "ideas are not a unit (as above)", "Sinex side: ideas would be candidate claims (the storage/authority split: a model or rubric pass proposes, the operator judges), owned by whichever project ran the pass, cited across"]
level = 0

[[use]]
id = "chats-to-notes"
title = "Notes written from chats, linked both ways"
act = "which vault notes came from this conversation, and which conversations does this note draw on?"
reads = ["polylogue:sessions", "polylogue:messages", "sinex:note.observed"]
needs = ["resolved_objects"]
shows = "the two-way links between a note and its source sessions, from the note's own citations"
mark = "plausible"
origin = "seeded"
cite = "uses-from-chats.md `chats-to-notes` (AI Studio 2025-04-24, 2025-04-08); notes already cite chats in front matter"
prototype = ""
gaps = ["a vault note citing `extrinsic.chatlog.gemini.*` resolves to a Polylogue session only through an alias table nobody owns", "Sinex side: the vault parser should emit a typed reference for each chat citation in a note's front matter, resolved to a Polylogue session by the provider's native ID (an exact key); an alias table is needed only for legacy names, and the vault source owns it"]
level = 0

[[use]]
id = "person-across-sources"
title = "Everything about one person, across chats, mail and messages"
act = "what have I discussed with or about Anna, in AI chats, mail and Messenger?"
reads = ["polylogue:messages", "sinex:chat.message", "sinex:mail.message.observed", "sinex:contact.observed", "sinex:call.observed"]
needs = []
shows = "one timeline per person, each item with its source"
mark = "plausible"
origin = "expanded"
cite = "polylogue vision gap summary (entity identity, 8 uses); sinex vision gap 2"
prototype = ""
gaps = ["entity identity across sources: no shared identity for a person, project or place; links only from evidence or operator confirmation, never from text matching alone", "Sinex side: the entity layer belongs in Sinex, where most identities live (address books, mail, messengers); links carry the same basis as fusion (`identifier`: a shared address, number or handle; `operator`: a confirmed link; never `rule` inference from names alone), and Polylogue mentions link to it as notes or derived links. Address books are a planned source not yet in use (`contacts.vcard`)"]
level = 0

[[use]]
id = "unasked-surfacing"
title = "Being told, unasked, when something needs me"
act = "tell me when an agent has waited on me for 20 minutes, or the machine is about to run out of disk during a build"
reads = ["polylogue:sessions", "sinex:resource.sampled"]
needs = ["brief_machine"]
shows = "a notification with the evidence and a link, under declared rules"
mark = "intended"
consumer = "push"
origin = "expanded"
cite = "polylogue vision gaps (surfacing, 4 uses); sinex vision gap 1"
prototype = ""
gaps = ["no outgoing surface in either project, and no rule for when the system may interrupt the operator", "Resolved by the same rule shape in both projects (sinex-spec/spec/surfaces.md §6a, the rule schema; Polylogue user-data.md): each project signals over its own facts; an agent waiting on the operator is Polylogue's, machine pressure is Sinex's, so no fact is signalled twice"]
level = 0

[[use]]
id = "speech-as-source"
title = "Spoken thinking kept and searchable beside chats"
act = "find what I said aloud about the brief design last week, next to the chats on it"
reads = ["polylogue:messages", "sinex:transcript.segment.observed", "sinex:audio.segment.recorded"]
needs = ["logical_day"]
shows = "transcript segments interleaved with chat turns by time"
mark = "speculative"
origin = "seeded"
cite = "polylogue vision gap (speech, 1 use); sinex intent-origins 2023-09-29 (transcription tool)"
prototype = ""
gaps = ["Sinex side: speech is already a Sinex source (`media.audio`, `media.audio-transcript`, in use), so the gap is Polylogue's: a spoken note is Sinex material, and Polylogue would read its transcript segments as context, not capture them"]
level = 0

[[use]]
id = "exocortex-interface"
title = "The exocortex as an interface, not an application"
act = "ask one question and get an answer drawn from machine history and conversations alike"
reads = ["polylogue:sessions", "sinex:command.executed"]
needs = ["read_as", "brief_machine"]
shows = "one answer citing both projects' records, read back as a sentence"
mark = "intended"
consumer = "agent"
origin = "seeded"
cite = "uses-from-chats.md, Sinex section (2025-04-20)"
prototype = ""
gaps = ["no single query surface spans both projects; each answers its own query language", "Sinex side: in backed mode Polylogue's resolved objects are `polylogue.*` events in Sinex, so Sinex's query language and MCP tools already span both for facts (time, sessions, commits); conversational search and meaning stay in Polylogue's language. The missing piece is one entry point that routes a question to the right one, not a merged language"]
level = 0

[[use]]
id = "goals-from-journal"
title = "Projects and goals derived from the journal, checked against what I did"
act = "which goals from my journal this month got time, in agents or by hand, and which didn't?"
reads = ["sinex:note.observed", "sinex:steering.record", "sinex:operator.log.entry", "polylogue:sessions", "sinex:window.focused"]
needs = ["logical_day", "claims"]
shows = "each goal with the time and sessions that served it, or none"
mark = "plausible"
origin = "seeded"
cite = "uses-from-chats.md, Sinex section (2025-04-25)"
prototype = ""
gaps = ["entity identity: a goal named in the journal and a project in Polylogue", "Sinex side: goals already exist as data in the operator's steering records (`operator.steering`, planned), which are better evidence than free-text extraction; the journal adds candidate goals for the operator to confirm"]
level = 0

[[use]]
id = "agent-coordination"
title = "Agents coordinating across projects and quotas"
act = "which agents are working on which repositories now, which wait on me, and how much Codex and Claude quota is left?"
reads = ["polylogue:sessions", "polylogue:events", "sinex:command.executed"]
needs = ["brief_machine"]
shows = "live states per repository with quota remaining, each from stored facts"
mark = "intended"
consumer = "push"
origin = "seeded"
cite = "uses-from-chats.md `coordination` (2026-07-09: 'seems potentially well positioned to host such coordination')"
prototype = ""
gaps = ["quota remaining is a provider number neither project collects", "Sinex side: provider quota could be a Sinex source (each provider's usage endpoint or the CLI's own report, polled), recorded like any sampled state; none is in the catalog yet"]
level = 0

[[use]]
id = "event-triggered-agent"
title = "A CI failure starts an agent session with cited context"
act = "when CI fails on a branch I own, start an agent in that repository with the failing run, the last sessions that touched the code, and what the machine was doing"
reads = ["sinex:ci.run.observed", "sinex:commit.created", "polylogue:sessions", "polylogue:tool_calls"]
needs = ["brief_machine", "resolved_objects"]
shows = "a new agent session whose takeover briefing cites the failing run, the commits and the earlier sessions that touched those files"
mark = "plausible"
origin = "seeded"
cite = "sinex-7z0.9 (event-triggered agents), via the Sinex session's open-beads audit (97189b3)"
prototype = ""
gaps = ["no outgoing surface that can start an agent (the unasked-surfacing gap, with an action instead of a notification)", "a takeover briefing is built for a pasted session reference; one assembled from a Sinex event is not specified"]
level = 0

[[use]]
id = "how-much-i-wrote"
title = "How much I actually wrote, across prompts, chat and notes"
act = "what text did I supply to agents, what pastes did the provider report, and which spans match clipboard copies?"
reads = ["polylogue:messages", "sinex:clipboard.copied", "sinex:note.observed"]
needs = ["turns"]
shows = "operator-supplied, provider-unmarked and clipboard-matched byte proxies per day and project, with separate provider reports and ambiguous clipboard candidates; unknown origin stays unknown"
mark = "intended"
consumer = "agent"
origin = "expanded"
cite = "joint decision 30; sinex analysis.md §4.2 (Text-origin evidence and writing proxies)"
prototype = "sinex-spec/prototype/paste-attribution"
gaps = []
level = 0

[[use]]
id = "work-firehose"
title = "A live view of files and agent activity"
act = "show me, as it happens, which files change and what each coding agent is doing and producing, per repository"
reads = ["polylogue:sessions", "polylogue:events", "sinex:file.changed", "sinex:command.executed"]
needs = ["turns", "brief_machine"]
shows = "one stream per repository: file changes, agent turns and their tool calls, commands, each cited"
mark = "plausible"
consumer = "view"
origin = "seeded"
cite = "journal 2026-07-30: \"I thought I need some sort of custom 'firehose' view/webui for relevant files, coding agent activity, outputs etc. then kinda realized that this is obviously actual good usecase of sinex to prioritize\""
prototype = ""
gaps = ["a view the operator opens fails the consumer test until something pushes into it; its likeliest push form is the machine section's pending lines, which already show a project's running work"]
level = 0
