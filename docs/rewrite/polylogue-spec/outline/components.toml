# The outline: every component of the finished Polylogue, breadth-first (README.md). Checked by check_outline.py.
#
# Fields: id; crate (a crate of plan/workspace.md, or "external" for programs outside the workspace);
# slice (plan/slices.md); does (one sentence); owns (tables as "<db>:<table>", db = archive | index | embeddings,
# or other state in words); writers (other components allowed to write the tables it owns); writes (tables of
# other components it writes); uses (components it calls; the crate edge must be allowed by workspace.md);
# interfaces; spec ("<file>#<heading text>"); provides (vision features); serves (vision uses, optional: a use is
# also served when every feature it needs is provided); laws (plan/testing/laws.md numbers placed here);
# solidity (outline | specified | prototyped | built); prototype (path, when prototyped).

