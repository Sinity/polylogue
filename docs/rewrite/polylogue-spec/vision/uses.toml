# The vision catalog: uses that should grow on Polylogue (README.md describes the form). Checked by check_uses.py.

[features]   # feature -> the spec file and heading that own it
search = "spec/query.md#Full-text search"
semantic = "spec/query.md#Semantic search"
query = "spec/query.md#Shape of a query"
stages = "spec/query.md#Stages"
evidence_until = "spec/query.md#sessions"
saved_queries = "spec/user-data.md#Saved queries and kept results"
signals = "spec/user-data.md#Saved queries and kept results"
notes = "spec/user-data.md#Notes: one mechanism"
markers = "spec/user-data.md#Inline markers"
briefings = "spec/user-data.md#Briefings for agents"
resume = "spec/user-data.md#Resume candidates"
recall = "spec/user-data.md#Recall"
judgment = "spec/user-data.md#Judgment"
checked_claims = "spec/user-data.md#Checked claims and annotation passes"
pages = "spec/user-data.md#Pages, workspaces and investigations"
cost = "spec/analysis.md#Usage and cost"
tool_outcomes = "spec/analysis.md#Tool calls"
time = "spec/analysis.md#Time"
session_facts = "spec/analysis.md#Session facts"
lineage = "spec/analysis.md#Lineage marks and tree cost"
embeddings = "spec/analysis.md#Embeddings and semantic search"
git = "spec/analysis.md#Git correlation and the changes view"
measures = "spec/analysis.md#Measures and their definitions"
compaction = "spec/analysis.md#Compaction"
reports = "spec/analysis.md#Reports built from the above"
proof = "spec/analysis.md#What a record proves"
model_read = "spec/workflows.md#How do my agents behave"
live_state = "spec/model.md#Live state"
runs = "spec/model.md#Run"
deliveries = "spec/model.md#Delivery"
variants = "spec/model.md#Variant"
config_in_force = "spec/model.md#Configuration in force"
work_graph = "spec/model.md#The work graph"
processes = "spec/model.md#Process"
branches = "spec/rendering.md#Inherited messages and branches"
merge_routes = "spec/convergence.md#Sessions built from several inputs"
sources = "spec/sources/README.md"
raw_retention = "spec/storage/blobs.md"
excision = "spec/storage/archive-db.md#How excision works"
mcp = "spec/surfaces/mcp-and-hooks.md#MCP server for agents"
hooks = "spec/surfaces/mcp-and-hooks.md#Briefings injected by hooks"
cli = "spec/surfaces/cli.md#Verbs"
status = "spec/surfaces/cli.md#Status"
web_reader = "spec/surfaces/web.md"
export = "spec/export-format.md#The document"
otel_export = "spec/export-format.md#OpenTelemetry export"
render_for_models = "spec/rendering.md#Rendering for models"
live_view = "spec/rendering.md#The live view"
lineage_view = "spec/rendering.md#The lineage view"
privacy = "spec/behavior.md#Privacy"
sql = "spec/workflows.md#Ask the archive in SQL"

[[use]]
id = "distill-thread"
title = "A long chat distilled into a kept artifact"
act = "distill this 400-message chat into a standalone document I can read instead, and keep it current as the chat grows"
level = 1
query = "notes where kind:distillate stale:true"
output = "2 rows\n  chatgpt:6a57fc1e  distillate r3  covers 412 of 431 messages  stale: 19 newer\n  claude-ai:3f20…   distillate r1  covers 88 of 140 messages   stale: 52 newer"
source_note = "covered and newer counts from note_target rows and their seen_hash against the session's current messages; revision from the note's root family"
degrades = "a session with no distillate is not listed; a distillate whose target messages were excised shows `target gone`"
reads = ["sessions", "messages", "notes"]
needs = ["model_read", "notes", "render_for_models"]
shows = "a distillate note on the session citing the message range it covers, shown as stale once the chat grows past it"
consumer = "agent"
mark = "intended"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (distill-thread; the most repeated request)"

[[use]]
id = "merge-branches"
title = "Branches and copies of one chat brought together"
act = "which of these branches of the same chat says what, and how do they differ?"
level = 2
query = "messages where written_by:human inherited:* \"chrono\""
output = "3 rows\n  #8  Shorter, and mention chrono.\n  #2  let's use chrono, not time\n  #4  let's use chrono, not time   (inherited from #2)"
source_note = "rows from message; the inherited mark and its source from message.inherited_from (lineage marks)"
degrades = "a copy whose source session is missing is shown as its holder's own message with `source not in archive`"
expected = { "kind" = "count", "value" = 3 }
reads = ["sessions", "messages", "links"]
needs = ["branches", "merge_routes", "lineage"]
shows = "the branches side by side with shared messages counted once"
consumer = "agent"
mark = "intended"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (merge-branches)"

[[use]]
id = "ask-not-reread"
title = "Ask the archive instead of rereading old chats"
act = "did any old chat cover how to structure the capture daemon? just answer"
level = 1
query = "messages where near:\"how to structure the capture daemon\" | limit 10"
output = "10 rows ranked by similarity, each: session, date, first line, score"
source_note = "similarity from embeddings.db vectors; dates from message.at"
degrades = "without embeddings the result is `degraded` with the note `semantic search is not enabled`, and a full-text query is suggested"
reads = ["messages", "blocks"]
needs = ["search", "semantic", "model_read"]
shows = "an answer with references to the messages it rests on"
consumer = "agent"
mark = "intended"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (ask-not-reread)"

[[use]]
id = "chats-vs-project"
title = "Chats reconciled with a project as it stands"
act = "of everything discussed about Polylogue in web chats, what was done, what is still relevant, and what was never realized?"
level = 1
query = "messages where session.origin:(chatgpt|claude-ai|aistudio) \"polylogue\" since:2026-01-01 | group by session | count"
output = "one row per web chat mentioning the project, with the count of matching messages; the done/open/abandoned split is a model-read pass over these chats"
source_note = "rows from message and the full-text index"
degrades = "chats whose provider export lacks dates are left out of `since:` and counted in `notes`"
reads = ["sessions", "messages", "notes"]
needs = ["search", "model_read", "git", "checked_claims"]
shows = "three lists (done, open, abandoned), each item citing the chat and, where done, the commit or session that did it"
consumer = "agent"
mark = "intended"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (chats-vs-project, several 2026-06 requests)"
gaps = ["no entity identity: a person, project or concept mentioned across sessions is not an entity, so nothing joins its mentions with each other or with Sinex's sources (joint gap, also found by Sinex)", "stated plans and todo lists are not units: Claude Code todos/ and plans/ are stored but not parsed, and plans stated in chats have no structure, so 'what was planned' cannot be queried"]

[[use]]
id = "idea-ledger"
title = "All my ideas, and how they tie together"
act = "list every idea I have had about the exocortex, and which ideas are the same idea in different words"
level = 0
reads = ["messages", "notes"]
needs = ["semantic", "embeddings", "model_read", "notes"]
shows = "a ledger of ideas, each with its first and latest mention and links between ideas"
consumer = "agent"
mark = "intended"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (idea-ledger)"
gaps = ["no entity identity: a person, project or concept mentioned across sessions is not an entity, so nothing joins its mentions with each other or with Sinex's sources (joint gap, also found by Sinex)", "query language cannot express grouping rows by meaning: `near:` ranks rows by similarity to one target, but no stage clusters a set into groups of the same idea in different words (planned extension: `cluster by near`, query.md)"]

[[use]]
id = "chats-to-notes"
title = "Notes written from chats"
act = "turn what this chat settled into notes in my vault, linked back to the messages"
level = 1
query = "notes where author:operator source:* since:2026-10-01"
output = "rows of notes written from inline markers, each with the message it came from"
source_note = "note.source is the message an inline marker came from"
degrades = "a note whose source message was excised keeps its text and shows `source excised`"
reads = ["messages", "notes"]
needs = ["model_read", "notes", "export"]
shows = "note files citing the chat messages they came from"
consumer = "agent"
mark = "intended"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (chats-to-notes)"

[[use]]
id = "stance-map"
title = "A map of my stated views, checked for contradictions"
act = "what have I said I believe about agent autonomy, and where do my statements contradict each other?"
level = 1
query = "notes where kind:claim key:stance rubric:stance-pass | group by value | count"
output = "one row per stated position (value), with how many messages state it; contradictions are pairs judged in the pass"
source_note = "rows written by an annotation pass under the `stance-pass` rubric"
degrades = "positions not yet passed over are absent; the pass's sampled agreement is shown in `notes`"
reads = ["messages", "notes"]
needs = ["search", "model_read", "checked_claims", "judgment"]
shows = "stated positions with dates, contradictions paired, each judged by me"
consumer = "agent"
mark = "intended"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (stance-map)"
gaps = ["no entity identity: a person, project or concept mentioned across sessions is not an entity, so nothing joins its mentions with each other or with Sinex's sources (joint gap, also found by Sinex)"]

[[use]]
id = "my-voice"
title = "Replies drafted in my own voice"
act = "draft a reply the way I would write it, from how I have written before"
level = 1
query = "messages where written_by:human words > 80 | sort by random(3) | limit 20"
output = "20 of my own longer messages, as the examples a drafting client is given"
source_note = "human-written messages and their word counts"
degrades = "with fewer than 20 such messages all are returned"
reads = ["messages"]
needs = ["search", "semantic", "export"]
shows = "a draft, with the past messages it took as examples"
consumer = "agent"
mark = "intended"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (my-voice)"
gaps = ["generation is outside the substrate: Polylogue can supply the operator's own writing as context, but drafting in their voice is a client of it, not a feature"]

[[use]]
id = "prompted-review"
title = "Learning by prompts, not flashcards"
act = "ask me now and then about things I learned in past chats, so I keep them"
level = 1
query = "messages where written_by:model has:code_lang session.tag:learning | sort by random(7) | limit 1"
output = "one past answer, as the prompt for a review question"
source_note = "message rows; the tag on the session"
degrades = "with no tagged sessions the result is `empty`; when to show it is not a query"
reads = ["messages", "notes"]
needs = ["model_read", "notes", "signals"]
shows = "a question from a past chat at a chosen moment, with the answer from that chat"
consumer = "push"
mark = "intended"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (prompted-review)"
gaps = ["no outgoing surface: Polylogue answers queries and injects at hook points, but cannot surface something unasked (a notification, a scheduled review), and no rule says when it may"]

[[use]]
id = "topic-threads"
title = "Long-lived chats per topic"
act = "everything about home networking, as one running thread across all the chats where it came up"
level = 1
query = "messages where \"home network\" | sort by at asc"
output = "every message mentioning the topic across all chats, oldest first, grouped under each session's title"
source_note = "full-text index over message text"
degrades = "messages in sessions whose text is excised are left out and counted in `notes`"
reads = ["sessions", "messages", "notes"]
needs = ["search", "notes", "pages"]
shows = "one reading view assembled from many chats on a topic, ordered in time"
consumer = "view"
mark = "plausible"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (topic-threads)"
gaps = ["no entity identity: a person, project or concept mentioned across sessions is not an entity, so nothing joins its mentions with each other or with Sinex's sources (joint gap, also found by Sinex)"]

[[use]]
id = "branch-tree"
title = "A conversation as a tree with named branches"
act = "show this chat as a tree and let me name the branches"
level = 1
query = "messages where session.id:chatgpt:6a57fc1e active:*"
output = "the session's messages including abandoned branches, each with its parent and branch point; names come from title notes on branch points"
source_note = "message parent ids and active path from the provider's tree (ChatGPT mapping)"
degrades = "a provider that records no tree (most agent harnesses) shows one path and says so"
reads = ["sessions", "messages", "notes"]
needs = ["branches", "notes", "web_reader"]
shows = "the branch tree with names (title notes on branch points)"
consumer = "view"
mark = "plausible"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (branch-tree)"

[[use]]
id = "fuzzy-recall"
title = "A half-remembered chat found again"
act = "there was a chat where a model compared three backup tools, I think in spring, find it"
level = 1
query = "sessions where origin:(chatgpt|claude-ai) \"backup\" started between 2026-03-01 and 2026-06-01"
output = "sessions ranked by relevance, each with title, date and the best-matching passage"
source_note = "full-text index; started from session.started"
degrades = "a session whose start is unknown is excluded from the window and counted in `notes`"
reads = ["sessions", "messages"]
needs = ["search", "semantic", "recall"]
shows = "candidate chats ranked, each with the matching passage"
consumer = "agent"
mark = "intended"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (fuzzy-recall); evidence/real-questions.md B1-B6"

[[use]]
id = "quote-back"
title = "What a model told me, quoted back"
act = "what exactly did the model say about my situation back then? quote it"
level = 2
query = "messages where written_by:human \"chrono\" session.origin:claude-code"
expected = { kind = "count", value = 1 }
output = "up to 3 rows: date, session title, and the full message text"
source_note = "message text from the text table, verbatim"
degrades = "an excised message is not returned"
reads = ["messages", "blocks"]
needs = ["search", "render_for_models"]
shows = "the exact message text with its date and session"
consumer = "agent"
mark = "intended"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (quote-back); spec/workflows.md §3"

[[use]]
id = "kept-analysis"
title = "An analysis reused instead of redone"
act = "I analyzed this in another chat; use that instead of redoing it"
level = 1
query = "notes where kind:saved_query value:\"dbus analysis\""
output = "the kept result with its query and the time it was computed"
source_note = "saved_query notes and kept results (user-data.md)"
degrades = "a kept result whose inputs changed since is marked `stale`"
reads = ["messages", "notes"]
needs = ["search", "saved_queries", "notes"]
shows = "the earlier analysis found and cited, kept as a result"
consumer = "agent"
mark = "intended"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (kept-analysis)"

[[use]]
id = "model-behaviour-study"
title = "Model behaviour studied across chats"
act = "in which chats did a model seem to fight itself or reverse its own advice?"
level = 0
reads = ["messages", "sessions"]
needs = ["search", "model_read", "checked_claims"]
shows = "chats where it happened, each with the reversing messages"
mark = "plausible"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (model-behaviour-study); spec/workflows.md §21"

[[use]]
id = "all-providers"
title = "All my AI chats in one place"
act = "ChatGPT, Claude, Gemini, Grok and agent sessions, searchable together"
level = 2
query = "sessions | group by origin | count"
output = "claude-code 3, codex 2, chatgpt 1, claude-ai 1"
source_note = "session.origin over top-level sessions (subagents excluded by default)"
degrades = "an origin whose location is unreadable is listed in `status`, not here"
expected = { "kind" = "groups", "value" = { "claude-code" = 3, "codex" = 2, "chatgpt" = 1, "claude-ai" = 1 } }
reads = ["sessions", "messages"]
needs = ["sources", "search", "merge_routes"]
shows = "one archive across providers"
consumer = "workflow"
mark = "intended"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (all-providers)"

[[use]]
id = "context-control"
title = "What enters an agent's context, controlled"
act = "give the new agent exactly the relevant past context, not too much"
level = 2
query = "deliveries where recipient:claude-code:7f3a2c10-0004 event:prompt_reference"
expected = { kind = "count", value = 1 }
output = "1 row: what the briefing included, what it left out (`left_out`), bytes against budget"
source_note = "the delivery row recorded by the hook"
degrades = "a briefing that timed out is recorded with outcome `timeout` and what was cut"
reads = ["sessions", "messages", "notes", "deliveries"]
needs = ["briefings", "hooks", "deliveries"]
shows = "a briefing within budget, recorded with what it left out"
consumer = "push"
mark = "intended"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (context-control)"

[[use]]
id = "memory-substrate"
title = "One substrate for agent memory and my own marks"
act = "my highlights and an agent's memory entries should be the same kind of thing"
level = 1
query = "notes where author:* kind:(note|tag) target:claude-code:7f3a2c10-0002"
output = "every note and tag on the session, by operator and agents alike, with author"
source_note = "note rows; author is `operator` or a session id"
degrades = "withdrawn notes are left out unless `withdrawn:*`"
reads = ["notes", "messages"]
needs = ["notes", "markers"]
shows = "highlights and memory as notes with kind, author and target"
consumer = "agent"
mark = "intended"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (memory-substrate)"

[[use]]
id = "code-memory"
title = "Agent memory generated from a codebase"
act = "what does an agent need to know about this repository that past sessions already found out?"
level = 0
reads = ["sessions", "tool_calls", "files", "notes"]
needs = ["briefings", "session_facts", "git"]
shows = "a project briefing from past sessions' findings about the code"
mark = "plausible"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (code-memory)"
gaps = ["no index of code facts (modules, functions, their history) across sessions; directory briefings are the only code-shaped memory"]

[[use]]
id = "coordination-substrate"
title = "Polylogue as where agents coordinate"
act = "which agents are working where, on what, and who can take over when quota runs out?"
level = 1
query = "sessions where running:true | group by repo | count"
output = "repositories with the number of live agents in each, then per session: live state, task, harness"
source_note = "live state computed at read time from hook and process rows"
degrades = "sessions with only file-growth evidence are `unknown`, never `working`"
reads = ["sessions", "processes", "runs", "events"]
needs = ["live_state", "runs", "mcp", "cost"]
shows = "live agents by repository with their tasks and remaining quota"
consumer = "push"
mark = "intended"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (coordination-substrate, 2026-07-09)"

[[use]]
id = "cockpit"
title = "A cockpit: what is happening now, in five seconds"
act = "what needs me right now?"
level = 2
query = "sessions where live:waiting"
expected = { world = "live", clock = "2026-10-09 15:00:00", kind = "rows", value = ["V1"] }
output = "waiting first (with what each waits on), then working, idle and unknown"
source_note = "live, waiting_on from the live-state rules"
degrades = "a stopped daemon gives exit code 6; with no process evidence a session can only be `unknown` or `stale`"
reads = ["sessions", "processes", "events"]
needs = ["live_state", "live_view", "status"]
shows = "waiting agents first, then working ones, then stale ones, with what each waits on"
consumer = "push"
mark = "intended"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (cockpit); evidence/meta-vision.md scene 1"
prototype = "prototype/crates/daemon"

[[use]]
id = "pre-solved-work"
title = "Issues that carry their own solution"
act = "write this task so the next agent only implements it, using what past sessions found"
level = 1
query = "messages where written_by:model \"root cause\" session.repo:polylogue since:30d"
output = "model messages stating causes in the repository's sessions, as the evidence a task text cites"
source_note = "full-text index; session repo from git evidence"
degrades = "sessions without git evidence have no repo and are not matched"
reads = ["sessions", "messages", "notes"]
needs = ["model_read", "notes", "briefings"]
shows = "a task text citing the sessions whose findings it rests on"
consumer = "agent"
mark = "intended"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (pre-solved-work); spec/workflows.md §7"

[[use]]
id = "secretary"
title = "A secretary agent fed by the archives"
act = "collect every obligation raised in my sessions into a backlog, with where each came from"
level = 1
query = "notes where kind:claim key:obligation check:(fails|unknown)"
output = "open obligations collected by a pass, each with its source message and why it is not yet met"
source_note = "claims written by a pass; check evaluated at read time"
degrades = "obligations whose check cannot be evaluated show `unknown` with the reason"
reads = ["messages", "notes"]
needs = ["model_read", "checked_claims", "notes", "signals"]
shows = "a backlog of obligations, each citing its message, checked off by later evidence"
consumer = "push"
mark = "intended"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (secretary, 2025-11-03)"
gaps = ["no outgoing surface: Polylogue answers queries and injects at hook points, but cannot surface something unasked (a notification, a scheduled review), and no rule says when it may", "stated plans and todo lists are not units: Claude Code todos/ and plans/ are stored but not parsed, and plans stated in chats have no structure, so 'what was planned' cannot be queried"]

[[use]]
id = "prompt-improvement"
title = "Better prompts for agent loops, from history"
act = "which of my prompts to agents led to good outcomes, and which wasted runs?"
level = 2
query = "messages where written_by:human | group by session.origin | count"
output = "claude-code 9, chatgpt 3, codex 3, claude-ai 2"
source_note = "human-written messages (prompt_kind) grouped by the owning session's origin"
degrades = "an edited prompt on an abandoned branch is excluded unless `active:*`"
expected = { "kind" = "groups", "value" = { "claude-code" = 9, "chatgpt" = 3, "codex" = 3, "claude-ai" = 2 } }
reads = ["messages", "sessions", "notes"]
needs = ["search", "session_facts", "checked_claims"]
shows = "prompts grouped with the outcomes of the sessions they started"
consumer = "agent"
mark = "intended"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (prompt-improvement); spec/workflows.md §20"

[[use]]
id = "second-opinion"
title = "A second opinion from another model"
act = "show another model the project and these discussions and ask what it thinks"
level = 0
reads = ["sessions", "messages"]
needs = ["export", "render_for_models"]
shows = "a bounded excerpt rendered for a model, with its references"
mark = "plausible"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (second-opinion)"

[[use]]
id = "trajectory"
title = "A project's trajectory and velocity"
act = "how fast did this project move over time, and what slowed it?"
level = 1
prototype = "prototypes/vision/trajectory.py"
query = "sessions where repo:morrow | group by week(started) | agg count, sum:tool_calls, sum:cost"
output = "one row per week: sessions, tool calls, cost (with unknown cost counted)"
source_note = "session facts; week in the operator's time zone"
degrades = "weeks with no sessions are absent, not zero"
reads = ["sessions", "tool_calls", "runs"]
needs = ["git", "measures", "time", "reports"]
shows = "activity and commits over time, with the sessions behind each change"
consumer = "agent"
mark = "intended"
origin = "seeded"
cite = "polylogue-sinex-joint/vision/uses-from-chats.md (trajectory); spec/workflows.md §17"
gaps = ["query language has no series statistics over grouped rows (median, longest empty run, later half against earlier)", "session counts measure activity, not velocity; commits beside sessions are needed"]

[[use]]
id = "plans-projected"
title = "What the project would be if its plans were carried out"
act = "what would Polylogue be if every plan we wrote down were done?"
level = 0
reads = ["notes", "messages"]
needs = ["pages", "model_read"]
