# How each gap found by the uses is resolved (README.md, Gaps): fixed in the spec, set aside,
# kept by design, planned as an extension, or joint (needs Sinex). check_uses.py requires one per gap.

[[disposition]]
match = "no entity identity"
outcome = "set_aside"
where = "SET-ASIDE.md#No entity identity across sessions and sources"
note = "with Sinex's knowledge-graph layer (the operator, 2026-05-25); the narrow evidence-only form is the way back; a joint gap too"

[[disposition]]
match = "stated plans and todo lists are not units"
outcome = "set_aside"
where = "SET-ASIDE.md#Stated plans and todo lists are not units"
note = "a plans unit from TodoWrite calls and todo files"

[[disposition]]
match = "no outgoing surface"
outcome = "fixed"
where = "spec/user-data.md#Saved queries and kept results"
note = "signals: a watch with a delivery rule in the shape both projects share (joint evaluator polylogue-sinex-joint/prototype/signals/)"

[[disposition]]
match = "generation is outside the substrate"
outcome = "by_design"
where = "spec/purpose.md#Explicitly not in scope"
note = "drafting in the operator's voice is a client; Polylogue supplies the examples"

[[disposition]]
match = "no dataset export shaped for training"
outcome = "set_aside"
where = "SET-ASIDE.md#No dataset export for training or evaluation"
note = "an export mode for (context, prompt, accepted outcome) records"

[[disposition]]
match = "query language cannot express grouping rows by meaning"
outcome = "planned"
where = "spec/query.md#Planned extensions"
note = "`cluster by near`, an extension; degraded without embeddings"

[[disposition]]
match = "no index of code facts"
outcome = "set_aside"
where = "SET-ASIDE.md#No index of code facts across sessions"
note = "a derived table of files, symbols and sessions"

[[disposition]]
match = "query language has no series statistics"
outcome = "planned"
where = "spec/query.md#Planned extensions"
note = "`| series` over grouped periods, complete periods only"

[[disposition]]
match = "session counts measure activity, not velocity"
outcome = "planned"
where = "spec/query.md#Planned extensions"
note = "commits as a unit read each commit's span (analysis.md, git correlation)"

