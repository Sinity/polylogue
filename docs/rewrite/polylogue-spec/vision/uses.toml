[[use]]
id = "stray-idea-triage"
title = "A stray idea dropped anywhere reaches an agent that decides what to do with it"
act = "I type 'check whether the catch-up loop is idempotent under a crash' into a capture line; a triage agent queues it as a task or brings it to tomorrow's briefing"
level = 0
reads = ["notes"]
needs = ["notes", "signals", "pages", "mcp"]
shows = "consumer: a triage agent woken by a signal on new idea notes, which writes a task reference or a briefing item back as a note; the operator sees one line"
mark = "plausible"
origin = "seeded"
cite = "operator decision record 2026-05-24 `polylogue-v1-sketch`, example A; depends on questions.md #47 (conversing with agents or directing them)"
prototype = ""
gaps = []

[[use]]
id = "spawn-through-polylogue"
title = "An agent asks Polylogue to start an agent of a given kind, instead of a native subagent"
act = "an agent calls Polylogue to start a reviewer agent on this branch; the new session is recorded with its parent, kind and task from the first record"
level = 0
reads = ["sessions"]
needs = ["mcp", "lineage", "runs", "live_state"]
shows = "the spawned session linked to its spawner, with its kind and task, live in status"
consumer = "agent"
mark = "speculative"
origin = "seeded"
cite = "operator chats 2026-06-14 (\"agent could MCP call polylogue to spawn agent of given kind… IDK it might be that native subagents are usually enough\") and 2026-06-17 (\"didn't think it through properly yet\"), via evidence/intent-web-journal.md; related to questions.md #47"
prototype = ""
gaps = []

[[use]]
id = "context-reboot"
title = "Start a fresh session instead of compacting, losing none of the direct prose"
act = "a long session is getting heavy; I start a new one and paste the old session's ID; the new agent gets my prompts verbatim, the plan and open items, and the archive keeps the whole old history"
level = 1
query = "links where kind:reference"
output = "the reference links from each rebooted session to the session it took over, with how (briefing or mention)"
source_note = "the delivery row of the takeover briefing, and the pasted ID in the first prompt"
degrades = "a reboot whose first prompt names no session ID has no link; it is an ordinary new session"
reads = ["sessions", "messages"]
needs = ["briefings", "hooks", "lineage", "resume"]
shows = "a takeover briefing of the old session (the operator's prompts verbatim, todo list, open items), the new session linked to it by a reference link"
consumer = "push"
mark = "intended"
origin = "seeded"
cite = "operator journal 2026-05-03 (\"drop very long codex/claude code session histories… polylogue as actual archive and claudecode's state being just current state\") and 2026-06-29 (\"'direct prose' is the actually important part of the session to preserve… compaction, but better\"), via evidence/intent-web-journal.md"
prototype = ""
gaps = []

[[use]]
