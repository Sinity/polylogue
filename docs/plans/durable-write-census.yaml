    function: "write_literal_text"
    table: "?"
    kind: "update"
    tier: "unresolved"
    classification: guarded_producer_refinement
    reason: "The shared incremental TEXT writer requires the exact retained original native connection owner and an active transaction. Audit retains its allowlist of operation_events.detail_json and audit_continuity_control.pending_payload_json and verified canonical literal chunks. The CaptureJob producer fills its same-transaction placeholders in capture_jobs.intent_json, capture_job_events.refs_json/payload_json, capture_job_native_acquisitions.header_json, capture_job_native_members.metadata_json, and capture_job_native_assets.outcome_json; duplicate/CAS/acquisition-state checks precede publication. These are current receiver registry cells, not archive tiers. The annotation importer fills only refs/failures/metadata cells of temp.annotation_import_literals on the same native User connection. Its completed canonical values enter annotation_batches through one checked INSERT…SELECT inside the atomic schema/batch/assertion transaction, after immutable existing-batch digest and schema checks; complete provenance is verified before commit. No durable JSON CHECK is bypassed or temporarily weakened. The helper fills the producer-selected row before commit, enforces physical SQLite length and exact streamed byte count, and retains failed Blob settlement with its creator. This moves the previous Audit placeholder refinement without permitting revisions of already published confident payloads."
  - file: "polylogue/storage/sqlite/archive_tiers/user_write.py"
    function: "advance_session_marker_delivery"
    table: "session_marker_delivery"
    kind: "upsert_do_update"
    tier: "user"
    classification: lifecycle_transition
    reason: "polylogue-bp12n.1 sink delivery position. The row is a per-session cursor, not content: session_id is the primary key and the only mutable columns are the input binding and the applied timestamp. The upsert carries its own prior state in the conflict clause -- WHERE excluded.applied_at_ms >= session_marker_delivery.applied_at_ms -- so the position advances monotonically and a late or replayed delivery cannot rewind it. It commits in the same transaction as the assertion rows it describes, which is why it is in user.db rather than a rebuildable tier: after a crash a derived cursor could disagree with the durable rows it claims to have delivered. No column carries a producer judgement that a later pass recomputes"
  - file: "polylogue/storage/sqlite/archive_tiers/user_write.py"
    function: "advance_accepted_marker_delivery_cursor"
    table: "accepted_marker_delivery_cursor"
    kind: "update"
    tier: "user"
    classification: lifecycle_transition
    reason: "The singleton is the durable sink acknowledgement for immutable accepted-marker source history. Its writer first verifies the exact prior stream and sequence, then advances only to the immediate successor inside the caller-owned assertion-lowering transaction; stale or skipped work raises instead of changing the cursor. It stores delivery progress, not a recomputable producer judgement."
