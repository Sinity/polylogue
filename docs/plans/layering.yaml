# Inter-package layering rules.
#
# Each rule declares forbidden imports for a package ring. The current
# enforced baseline is intentionally the no-backward-import contract: substrate
# rings must not reach into insight/lab/surface adapters. Aspirational surface
# slimming belongs in coverage manifests until call sites are moved.
#
# Semantics:
#   - "disallow" means the import is always forbidden
#   - "allow" with an empty or absent from list means all sources are allowed
#   - "allow" with a from list restricts imports to those packages only
#   - writer modules declare their owned surfaces in the module docstring as
#     "Writer module: <tier>[, <tier>]". The policy is the audited inventory.
#   - durability/interruption pairs are deliberately distinct: durable writes
#     are atomic, rebuildable writes are replayable, and ops writes restart.
#   - a module may own multiple tiers only through a named twin-write contract.

writer_modules:
  marker: "Writer module:"
  # This boundary inventories tier-owning archive facade modules. Lower-level
  # query helpers execute on caller-supplied connections and do not own tiers.
  mutation_roots: [polylogue/storage/sqlite/archive_tiers]
  modules:
    - path: polylogue/storage/sqlite/archive_tiers/archive.py
      surfaces:
        - tier: index
          durability: rebuildable
          interruption: replayable
      entrypoints: [delete_sessions]
    - path: polylogue/storage/sqlite/archive_tiers/revision_governance.py
      surfaces:
        - tier: index
          durability: rebuildable
          interruption: replayable
        - tier: source
          durability: durable
          interruption: atomic
      entrypoints:
        [admit_raw_and_parsed_result, admit_raw_artifact_blob_ref, admit_raw_artifact_payload,
        apply_raw_membership_classification, apply_raw_revision_replay,
        classify_raw_revision_cohort_for_frozen_candidate,
        classify_raw_revision_cohort_for_live_watch, classify_raw_revision_cohort_for_rebuild_repair,
        finalize_raw_parse_state,
        mark_raw_parse_failed,
        record_current_parser_source_census,
        release_provisional_full_revisions, replace_raw_membership_census,
        write_parsed_for_retained_raw, write_parsed_for_retained_raw_result, write_raw_and_parsed,
        write_raw_and_parsed_result]
      twin_write_contract: raw-membership-classification
    - path: polylogue/storage/sqlite/archive_tiers/revision_application.py
      surfaces:
        - tier: index
          durability: rebuildable
          interruption: replayable
      entrypoints: [record_revision_application_sync]
    - path: polylogue/storage/sqlite/archive_tiers/source_write.py
      surfaces:
        - tier: source
          durability: durable
          interruption: atomic
      entrypoints:
        [apply_source_raw_state_update, bind_source_raw_revision, record_capture_mode_observation,
        record_excised_blob_hash, record_raw_container_coordinate, refine_raw_origin, write_history_sidecar,
        delete_source_hook_event, write_source_blob_refs, write_source_hook_event, write_source_raw_session,
        write_source_raw_session_blob_ref, upsert_raw_artifact]
    - path: polylogue/storage/sqlite/archive_tiers/write.py
      surfaces:
        - tier: index
          durability: rebuildable
          interruption: replayable
      entrypoints:
        [apply_insight_materialization, rebuild_archive_messages_fts, repair_stale_prefix_branch_points,
        replace_parser_ingest_flag_tags, upsert_insight_materialization, upsert_parser_ingest_flag_tags,
        upsert_session_profile_costs, write_parsed_session_to_archive]
    - path: polylogue/storage/sqlite/archive_tiers/session_annotations_write.py
      surfaces:
        - tier: index
          durability: rebuildable
          interruption: replayable
        - tier: user
          durability: durable
          interruption: atomic
      entrypoints:
        [upsert_session_phase, upsert_session_tag, upsert_session_work_event]
      twin_write_contract: session-tag-assertion-mirror
    - path: polylogue/storage/sqlite/archive_tiers/embedding_write.py
      surfaces:
        - tier: embeddings
          durability: rebuildable
          interruption: replayable
      entrypoints:
        [begin_embedding_attempt, complete_embedding_attempt_success, mark_session_embedding_error,
        record_embedding_failure, resolve_embedding_failure, resolve_open_embedding_failures_for_session,
        supersede_embedding_attempt, upsert_message_embedding, upsert_message_embeddings]
    - path: polylogue/storage/sqlite/archive_tiers/user_write.py
      surfaces:
        - tier: user
          durability: durable
          interruption: atomic
      entrypoints:
        [judge_assertion_candidate, judge_assertion_candidates, mark_assertion_status, upsert_annotation, upsert_assertion,
        upsert_blackboard_note, upsert_comparative_judgment_assertion, upsert_correction, upsert_mark,
        upsert_pathology_findings_as_assertions,
        upsert_recall_pack, upsert_saved_view, upsert_session_metadata_assertion, upsert_session_tag_assertion,
        upsert_suppression, upsert_transform_candidate_assertions, upsert_findings_as_assertions, upsert_workspace,
        ack_judgment_automation_receipt_outbox, upsert_judgment_automation_receipt_outbox]
    - path: polylogue/storage/sqlite/archive_tiers/user_annotations.py
      surfaces:
        - tier: user
          durability: durable
          interruption: atomic
      entrypoints: [persist_annotation_batch, persist_annotation_schema, persist_builtin_annotation_schemas]
    - path: polylogue/storage/sqlite/archive_tiers/context_delivery_write.py
      surfaces:
        - tier: user
          durability: durable
          interruption: atomic
      entrypoints: [write_context_delivery]
    - path: polylogue/storage/sqlite/archive_tiers/user_settings_write.py
      surfaces:
        - tier: user
          durability: durable
          interruption: atomic
      entrypoints: [set_user_setting]
    - path: polylogue/storage/sqlite/archive_tiers/ops_write.py
      surfaces:
        - tier: ops
          durability: disposable
          interruption: restartable
      entrypoints:
        [add_convergence_debt, record_cursor_lag_sample, record_daemon_stage_event, record_fts_drift_sample,
        record_ingest_attempt, record_schema_drift_sample,
        record_daemon_lifecycle_heartbeat, record_daemon_lifecycle_signal, record_daemon_lifecycle_start,
        record_daemon_lifecycle_stop, record_judgment_scheduler_receipt,
        record_mcp_call, record_route_observation, upsert_embedding_catchup_run,
        upsert_ingest_cursor]
    - path: polylogue/storage/sqlite/archive_tiers/ingest_precedence.py
      surfaces:
        - tier: index
          durability: rebuildable
          interruption: replayable
      entrypoints: [record_capture_gap_event, record_source_outage_events]
    - path: polylogue/storage/sqlite/archive_tiers/index_fast_forward_executor.py
      surfaces:
        - tier: index
          durability: rebuildable
          interruption: replayable
      entrypoints: [apply_index_fast_forward]
  twin_write_contracts:
    - name: raw-membership-classification
      module: polylogue/storage/sqlite/archive_tiers/revision_governance.py
      surfaces: [index, source]
      entrypoints: [apply_raw_membership_classification]
      reason: "Applying a semantic member-head decision persists the derived session row (index) and the per-raw membership/authority decision (source) together so a partial write can never leave one raw id's authority state inconsistent with the session it was or was not accepted into."
    - name: session-tag-assertion-mirror
      module: polylogue/storage/sqlite/archive_tiers/session_annotations_write.py
      surfaces: [index, user]
      entrypoints: [upsert_session_tag]
      reason: "Legacy single-file archives co-locate assertions; a user tag mirrors to its durable assertion only when that table is present."

rules:
  - target: polylogue/cli
    description: >-
      CLI surface adapter — should route through insights/operations/api
      rather than substrate internals (polylogue-2ciy). 121 pre-existing
      direct substrate imports are baselined (ratchet: new ones fail, the
      baselined count may only shrink); insights/operations/api imports are
      unrestricted.
    disallow:
      from: [polylogue/storage, polylogue/pipeline, polylogue/sources]
      baseline: docs/plans/layering-surface-baseline.json

  - target: polylogue/mcp
    description: >-
      MCP surface adapter — should route through insights/operations/api
      rather than substrate internals (polylogue-2ciy). 9 pre-existing
      direct substrate imports are baselined (ratchet: new ones fail);
      insights/operations/api imports are unrestricted.
    disallow:
      from: [polylogue/storage, polylogue/pipeline, polylogue/sources]
      baseline: docs/plans/layering-surface-baseline.json

  - target: polylogue/api
    description: >-
      API surface — adapter boundary over substrate and insights. Already
      the thinnest of the four surfaces conceptually, but still has 57
      pre-existing direct substrate imports, baselined the same way
      (polylogue-2ciy).
    disallow:
      from: [polylogue/storage, polylogue/pipeline, polylogue/sources]
      baseline: docs/plans/layering-surface-baseline.json

  - target: polylogue
    description: >-
      Production must not depend on the repo control plane. `devtools` exists to
      verify and release this package; a production import inverts that, so a
      developer tool becomes a runtime dependency that escapes the catalog's own
      doc/CI discipline. This direction had NO rule at all until it was added,
      which is how `polylogue ops diagnostics workload` came to be implemented
      by devtools/daemon_workload_probe.py (3,165 lines) without appearing in
      the devtools command catalog; that entry and archive_space_report's were
      pruned from the baseline once both modules relocated into
      polylogue/operations/ (WS-C tranche 3). The two remaining importers
      (click_app.py's checkout_guard safety check, scenarios/execution.py's
      command_catalog reference, tracked as the tranche-2 60gzo scenario-
      layering item) are an audited allowlist, not an accepted pattern: new
      ones fail, and the right fix for an entry is to move the code into
      polylogue/ where its caller lives.
    disallow:
      from: [devtools]
      baseline: docs/plans/layering-surface-baseline.json

  - target: polylogue/storage
    description: "Storage substrate must not import surface adapters."
    disallow:
      from: [polylogue/cli, polylogue/mcp, polylogue/daemon, polylogue/ui, polylogue/rendering]

  - target: polylogue/pipeline
    description: "Pipeline orchestration must not import interactive surfaces."
    disallow:
      from: [polylogue/cli, polylogue/mcp, polylogue/daemon, polylogue/ui]

  - target: polylogue/sources
    description: "Source acquisition/parsing must not import surface adapters."
    disallow:
      from: [polylogue/cli, polylogue/mcp, polylogue/daemon, polylogue/ui]

  - target: polylogue/insights
    description: "Derived insights must not import daemon/MCP/UI adapters."
    disallow:
      from: [polylogue/daemon, polylogue/mcp, polylogue/ui]

  - target: polylogue/daemon
    description: >-
      Daemon convergence and HTTP/web-reader surface adapter. This is the
      one surface with a real, load-bearing reason to reach substrate
      directly (convergence stages ARE the writer-adjacent orchestration
      layer), so its baseline is by far the largest of the four (215
      pre-existing direct substrate imports, polylogue-2ciy) — still
      ratcheted (new ones fail), not exempted outright, so growth is
      visible in review even where it may sometimes be legitimate.
    disallow:
      from: [polylogue/storage, polylogue/pipeline, polylogue/sources]
      baseline: docs/plans/layering-surface-baseline.json

  - target: polylogue/declarations
    description: >-
      Shared storage-free DeclarationSpec/derivation kernel (polylogue-o21.1)
      — domain registries (MCP, sources, insights, maintenance, ...) consume
      this package; it must never import a domain registry, surface adapter,
      or storage/config internals back.
    disallow:
      from:
        [
          polylogue/api,
          polylogue/archive,
          polylogue/cli,
          polylogue/config,
          polylogue/daemon,
          polylogue/insights,
          polylogue/maintenance,
          polylogue/mcp,
          polylogue/operations,
          polylogue/sources,
          polylogue/storage,
          polylogue/ui,
        ]
