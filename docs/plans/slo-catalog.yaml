    p95_ms: 400
    gate: "informational"
    tier: "cheap-local"

  daemon_warm_status:
    description: >-
      Installed warm CLI status including operation startup and local
      rendering. CURRENT WORKER-HEAD REPRODUCTION: 2026-09-25 at
      043b4729fee11e4b49c3d3d67c1c3f484e87d4e3, managed Python 3.14.4 and
      pytest-benchmark 5.3.0, 5 rounds, p50 2206.9 ms (mean 2269.3,
      stddev 213.6; estimated p95 2620.6 ms). Focused receipt
      20260925T062125Z-focused-test-3827203-f6a9d642 passed one selected
      workload; its runtime points at this checkout's .venv, and the command
      returned nonempty JSON (1935 bytes, 57 rows). The 400/800 ms target
      remains unchanged and this is a performance defect. Import-time cost
      remains assigned to open polylogue-8s70; no recalibration is made here.
      PREVIOUS WORKER-HEAD REPRODUCTION: 2026-09-25 at
      fcf3fcae08ca8d42ed45fccae820c4bf9e235d9f, managed Python 3.14.4
      workstation run, 5 rounds, p50 2386.2 ms (mean 2369.5, stddev 131.1;
      estimated p95 2585.2 ms). Focused receipt
      20260925T043821Z-focused-test-3382898-e7572d2d passed; the checkout
      import was confirmed and the lane returned a nonempty JSON response.
      This reproduces the over-budget result and keeps the 400/800 ms target;
      no recalibration. The prior common-head measurement below remains
      evidence for the separate phase-attribution run.
      CURRENT COMMON-HEAD REPRODUCTION: 2026-09-25 at
      0fb01e982c236c1ad3ad06c046f02d3d019c8258, managed Python 3.14.4
      workstation run, 5 rounds, p50 2266.1 ms (mean 2259.4, stddev 74.3;
      estimated p95 2381.6 ms). The focused receipt is
      20260925T003229Z-focused-test-2446973-a958609f; the checkout import was
      confirmed and the lane returned a nonempty JSON response. RULING:
      retain 400/800 ms as the target and record a real performance defect.
      The import tax remains attributable to polylogue-8s70, which is open;
      no budget change is made here. The earlier 9ef655cb8 measurement below
      is historical and is superseded by this common-head run.
      MEASURED 2026-09-22 at 9ef655cb8, 5 rounds x 2 runs on a
      host running five other lanes: p50 3521.8 / 3647.9 ms, p95 3736.3 /
      3760.9 ms -- about 9x the budget below, and stable (4% run-to-run).
      RULING (polylogue-gd9i1 AC4): performance DEFECT against a retained
      target, not a recalibration. The lane launches the installed console
      script, so it pays the same import tax as cli_status_cold and resolves
      under polylogue-8s70 rather than here; relaxing the budget would encode
      that tax as acceptable. Stays informational until 8s70 lands, then
      re-measure before deciding the number.
    benchmark_test: "tests/benchmarks/test_daemon_operation_profile.py::test_bench_daemon_warm_status"
    p50_ms: 400
    p95_ms: 800
    gate: "informational"
    tier: "lab"

  daemon_static_completion:
    description: >-
      Static shell/query completion without archive hydration. GRADUATED from
      informational 2026-09-22 (polylogue-dpm6o AC3): the lane now takes 5
      rounds, so its p95 is estimated from a real spread instead of from the
      single sample a one-shot lane reports as both p50 and p95. MEASURED at
      9ef655cb8, 2 runs on a loaded host: p50 32.8 / 41.2 ms, p95 39.2 / 48.3
      ms -- inside the budget below with ~3x headroom on p95.
    benchmark_test: "tests/benchmarks/test_daemon_operation_profile.py::test_bench_daemon_static_completion"
    p50_ms: 80
    p95_ms: 150
    gate: "required"
    tier: "lab"

  daemon_live_completion:
    description: >-
      Archive-backed completion through the typed daemon operation. GRADUATED
      2026-09-22 (polylogue-dpm6o AC3) on a 5-round distribution. MEASURED at
      9ef655cb8, 2 runs on a loaded host: p50 31.5 / 32.1 ms, p95 42.4 / 46.4
      ms -- inside the budget below with ~6x headroom on p95.
    benchmark_test: "tests/benchmarks/test_daemon_operation_profile.py::test_bench_daemon_live_completion"
    p50_ms: 150
    p95_ms: 300
    gate: "required"
    tier: "lab"

  daemon_cancellation:
    description: >-
      Read cancellation including connection and admission release. GRADUATED
      2026-09-22 (polylogue-dpm6o AC3) on a 5-round distribution. MEASURED at
      9ef655cb8, 2 runs on a loaded host: p50 32.2 / 34.2 ms, p95 122.1 /
      124.5 ms -- inside the budget below with ~4x headroom. Worth knowing:
      this lane's tail is 3.7x its median and reproduces across runs. A
      one-shot lane could not have shown that at all, because it reports its
      single sample as both p50 and p95.
    benchmark_test: "tests/benchmarks/test_daemon_operation_profile.py::test_bench_daemon_cancellation"
    p50_ms: 250
    p95_ms: 500
    gate: "required"
    tier: "lab"

  daemon_concurrent_reads:
    description: >-
      Mixed interactive reads while representative background work progresses.
      CURRENT WORKER-HEAD RE-TEST: 2026-09-25 at
      043b4729fee11e4b49c3d3d67c1c3f484e87d4e3, managed Python 3.14.4 and
      pytest-benchmark 5.3.0, 5 rounds, p50 206.3 ms (mean 221.5,
      stddev 48.5; estimated p95 301.4 ms). Focused receipt
      20260925T062221Z-focused-test-3831360-e8243eb7 passed one selected
      workload with four unique limit/offset requests; interference p95 was
      277 ms. The 250/500 ms target remains unchanged. The separate
      controlled archive-path latency injection and cache-hit control passed
      at receipt 20260925T061858Z-focused-test-3815716-d8027aa4. The
      PREVIOUS WORKER-HEAD RE-TEST: 2026-09-25 at
      fcf3fcae08ca8d42ed45fccae820c4bf9e235d9f, managed Python 3.14.4,
      5 rounds, p50 125.9 ms (mean 139.8, stddev 35.2; estimated p95
      197.6 ms). Focused receipt
      20260925T043633Z-focused-test-3376922-d4ba4282 passed. The worker
      requests distinct limit/offset pairs; the controlled archive-path
      injection and cache-hit control remain covered by the passing
      20260925T003346Z-focused-test-2452791-04e859c2 receipt below.
      Worker-head AC2 checks also passed at this revision: the archive-path
      latency injection plus cache-hit control in receipt
      20260925T044302Z-focused-test-3394086-b1e67291, and the unique
      mixed-load request series across rounds in receipt
      20260925T044340Z-focused-test-3396273-0b1aa3c3.
      GRADUATED 2026-09-22 (polylogue-dpm6o AC3, polylogue-gd9i1 AC2) on a
      5-round distribution AND a proven-valid series. MEASURED at 9ef655cb8,
      2 runs on a loaded host: p50 113.1 / 116.6 ms, p95 120.7 / 126.1 ms --
      inside the budget below with ~4x headroom, and tight (3% run-to-run).
      VALIDITY: the series is proven to reach the archive query path rather
      than the daemon read cache by
      test_read_series_separates_cache_hits_from_archive, which injects
      latency into _query_payload and requires every uncached read to pay it
      while a repeated read does not. That is the #5211 fault this lane's
      neighbour shipped with; "distinct params per worker" is a claim about
      the code, and this is the measurement.
    benchmark_test: "tests/benchmarks/test_daemon_operation_profile.py::test_bench_daemon_concurrent_reads"
    p50_ms: 250
    p95_ms: 500
    gate: "required"
    tier: "lab"

  daemon_mixed_load:
    description: >-
      Interactive reads served while background units occupy the same bounded
      scheduler. Gates the interactive side; the profile additionally asserts
      nonzero background throughput, a bounded background admission wait, and
      that the write load did not grow the state the measured read joins.
      CURRENT WORKER-HEAD REPRODUCTION: 2026-09-25 at
      043b4729fee11e4b49c3d3d67c1c3f484e87d4e3, managed Python 3.14.4 and
      pytest-benchmark 5.3.0, 5 rounds, p50 1990.7 ms (mean 2067.5,
      stddev 342.5; estimated p95 2630.9 ms). Focused receipt
      20260925T062041Z-focused-test-3824817-12e0f2cb passed one selected
      workload with nonempty reads, real writes, and background progress.
      The 250/500 ms product target remains a performance defect; the
      catalog's separate 4000/6000 ms informational noise ceiling is retained
      unchanged, not adopted as
      the product target and not recalibrated.
      Phase attribution in that receipt (quiet/writer p95 ms): admission
      queue 0/629, read-frame acquisition 0/0, query compute 1.833/4.264,
      cache invalidation 0/0, instrumentation tail 42.342/684, and response
      serialization 2/3. Instrumentation tail is the dominant measured
      phase. The writer series had 40 reads, 123 completed background
      operations at 11.533/s, 2272.7 ms maximum background queue wait, and
      744 ms maximum writer hold. These measurements attribute observed time
      to phases; they do not establish the mechanism causing the contention.
      The mixed-load unique-request anti-vacuity test, including its
      controlled archive-path injection and cache-hit positive control,
      passed separately at receipt
      20260925T062303Z-focused-test-3835330-9c893250.
      The declared product target stays 250/500 ms; the catalog's 4000/6000
      ms row remains an informational noise ceiling. Both remain unchanged.
      PREVIOUS WORKER-HEAD REPRODUCTION: 2026-09-25 at
      fcf3fcae08ca8d42ed45fccae820c4bf9e235d9f, managed Python 3.14.4
      workstation run, 5 rounds, p50 1477.3 ms (mean 1489.3, stddev 39.6;
      estimated p95 1554.4 ms). Focused receipt
      20260925T043736Z-focused-test-3380360-dc19d8d1 passed with nonempty
      reads, writes, and background progress. This run measures latency but
      its devtools receipt did not retain the phase payload. Keep the product
      target at 250/500 ms as a real performance defect; retain the separate
      4000/6000 ms informational ceiling as a shared-host noise ceiling.
      A follow-up structured capture at receipt
      20260925T044006Z-focused-test-3388060-1144ab53 was flaky (initial exit
      1, then one green retry) and its benchmark JSON had empty extra_info;
      it is invalid for phase attribution and is not scored.
      The previous ruling said a recalibration was owed but could not be taken
      because the lane could not declare a p95. Both reasons are now fixed
      (polylogue-bp12n.4 AC4), and the recalibration is taken -- but not in the
      direction the fix suggested. See the third point.
      (1) REPEATABLE. The lane took one round because its write load added a
      fresh tag per write and cli.query rows carry user tags -- list_summaries
      LEFT JOINs the user-overlay tag relation on every plain listing
      (archive.py:6335-6337), so round N really was reading the backlog rounds
      1..N-1 left. Measured, not reasoned: restore the per-write fresh tag and
      the later rounds' reads breach the 5s client deadline and come back
      outcome == "timed-out". The write load now cycles a bounded tag set, so
      every round reads the same shape, and the lane takes 5 rounds.
      (2) VALID. The lane's reads were not all archive reads. Its params were
      "2 + index % 4" over range(8) -- 2,3,4,5,2,3,4,5 -- so four of the eight
      were cache hits, and mutation.session.tag cannot invalidate them because
      it commits changed_session_ids=() (archive.py:4262) and so never moves
      the cache epoch. That is the #5211 fault this lane's neighbour was fixed
      for, still live here. Params are now unique across the whole repeated
      window, proved two-sided by
      test_mixed_load_series_stays_on_the_archive_path_across_rounds.
      (3) STILL NOT A TARGET, and this is the measured result rather than a
      deferral. MEASURED 2026-09-22 at b24e49f63 + this change, 4 runs on a
      shared host: p50 1437.6 / 1436.0 / 3328.7 / 1532.7 ms, p95 1538.3 /
      1597.6 / 4992.5 / 1911.8 ms. Within a run the five rounds are tight (p95
      spread 3.9% across the first two runs); run to run the same lane spans
      2.3x, and the outlier is one run of the four. The third run
      was host-wide contention, not this lane -- untouched `query` went p95
      77.4 -> 389.4 ms and cli_status_cold 3350 -> 4465 ms in the same run,
      while `reader` got faster. So a real distribution was necessary for a
      budget and is not sufficient for one: the dominant variance here is host
      load, not the workload, and this is the most concurrency-sensitive lane
      in the catalog. Numbers below are a NOISE CEILING chosen above the worst
      observed run so the lane catches a genuine regression without firing on a
      busy host -- they are not a target this workload is being held to, and
      tightening them needs a quiet-host re-measure, not a choice.
      Stays informational for the same reason cli_status_cold does. Note that
      an informational gate does not make the numbers free: a MEASURED
      violation blocks whatever the gate says (see this file's header), which
      is why the ceiling is set where it is.
      The substantive finding is unchanged and now rests on honest reads:
      ~180 ms per read under write load against ~28 ms per read quiet
      (daemon_concurrent_reads, same host, same runs) -- ~6.4x, the ~6x the
      bead flags. Wave 6 adds a pinned phase receipt to this lane: the managed
      run records quiet and writer-load p50/p95/p99 for read-frame acquisition,
      query compute, cache invalidation, instrumentation tail, and response
      serialization tail, plus queue delay, writer hold, and background
      throughput. The receipt also names the writer-load p95 dominant phase;
      any remaining unexplained tail is retained as instrumentation tail rather
      than silently charged to query compute. The 250/500 ms product target is
      preserved; this informational ceiling remains a noise ceiling until a
      quiet-host run attributes a fixable phase.
      CURRENT COMMON-HEAD REPRODUCTION AND RULING: 2026-09-25 at
      0fb01e982c236c1ad3ad06c046f02d3d019c8258, managed Python 3.14.4
      workstation run, 5 rounds. daemon_mixed_load p50 is 2513.2 ms (mean
      2941.3, stddev 878.3; estimated p95 4386.2 ms), below the unchanged
      4000/6000 ms informational noise ceiling. Its product target remains
      250/500 ms and is still a performance defect; neither set of numbers is
      recalibrated. Receipt 20260925T003121Z-focused-test-2442550-720b0a6b
      passed the workload with nonempty reads, real tag writes, and background
      progress. The accompanying benchmark JSON records quiet/writer p95 ms:
      admission queue 0/1314, read-frame acquisition 0/0, query compute
      2.111/2.878, cache invalidation 0/0, instrumentation tail 67.505/1237.972,
      response serialization 2/3. Background admission wait peaked at 7511 ms;
      79 background operations completed at 5.24/s. Request admission queue
      and instrumentation tail dominate this run; the remaining measurements
      are small. These are phase observations, not proof of the underlying
      cause of the historical slowdown. Concurrent reads re-tested at p50
      132.0 ms (5 rounds; receipt
      20260925T002931Z-focused-test-2434941-f3b28b7b), with the 500 ms
      controlled archive-path injection and cache-hit control passing in
      receipt 20260925T003346Z-focused-test-2452791-04e859c2.
      The dispatch's 2150.2 ms mixed-load and 5748.2 ms warm-status claims stay
      visible as invalid history: the former included cache hits, while the
      latter came from an exit-125 subprocess importing outside the checkout.
      This fresh reproduction supersedes neither the retained targets nor the
      older historical records; it adds common-head evidence and phase data.
    benchmark_test: "tests/benchmarks/test_daemon_operation_profile.py::test_bench_daemon_mixed_load"
    p50_ms: 4000
    p95_ms: 6000
    gate: "informational"
    tier: "lab"

  ingest_to_searchable:
    description: "Live daemon ingest through FTS publication until the new content is visible to find"
    benchmark_test: "tests/benchmarks/test_daemon_convergence.py::test_convergence_single_file_perf"
    p50_ms: 5000
    p95_ms: 10000
    gate: "informational"
    tier: "lab"

  cli_status_cold:
    description: >-
      polylogue status --format json, cold subprocess, no daemon reachable,
      empty archive (deferred until polylogue-8s70's import-tax fix lands).
      Baseline as of this row's introduction: p50 ~1.80s, p95 ~1.81s
      (5 rounds, this repo's dev host) -- dominated by builtins.compile
      across ~870 modules on the readiness/storage.repair import chain
      (polylogue-8s70's own cProfile finding), not query cost.
      RE-MEASURED 2026-09-22 at 9ef655cb8, 5 rounds x 2 runs: p50 4169.3 /
      3212.6 ms, p95 4423.6 / 3311.3 ms. That is roughly double the recorded
      1.80s baseline, but the two are NOT comparable: this host was running
      five other lanes, and this lane's 30% run-to-run spread is the widest
      in the catalog -- it is a cold interpreter start, so it measures
      whatever CPU it can get. Whether cold start regressed or the host was
      simply busy is NOT established here, and the way to settle it is a
      quiet-host re-measure, not a budget change.
      Stays informational for that reason: the lane is too noisy on a shared
      host to carry a real budget, which is a measured answer rather than a
      deferral. Target values below remain the aspirational post-fix budget,
      not today's passing bar.
    benchmark_test: "tests/benchmarks/test_cli_cold_start.py::test_bench_cli_status_cold"
    p50_ms: 500
    p95_ms: 800
    gate: "informational"
    tier: "lab"
