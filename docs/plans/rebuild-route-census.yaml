# Rebuild-entrypoint caller census -- read by `devtools gate rebuild-routes`.
#
# The campaign invariant is that a derived tier is rebuilt only by ordinary
# daemon convergence. `devtools gate layering` was cited as its check and does
# not check it: its writer census asks which file executes its own DML, so a
# route that orchestrates existing tier writers is invisible to it. This file
# is the declaration that makes the real criterion enforceable.
#
# `entrypoints` is policy: the functions that rebuild a derived tier. Add one
# when a new derived-tier rebuild primitive appears; the gate refuses a name
# here that resolves to no definition, so a rename cannot empty the census.
#
# `routes` is the census: every function the gate observes as a direct caller
# of an entrypoint, or as an entry root of the upward closure (a reaching
# function that no other reaching function calls). Both populations must be
# declared. An entry may leave when its route is gone; a new one cannot appear
# without this edit and its review.

package: polylogue

entrypoints:
  - polylogue.pipeline.services.indexing.rebuild_index
  - polylogue.storage.fts.fts_lifecycle.rebuild_fts_index_async
  - polylogue.storage.derived.session.rebuild.rebuild_session_insights_sync
  - polylogue.storage.derived.session.rebuild.rebuild_session_insights_async
  - polylogue.storage.derived.session.rebuild.rebuild_archive_session_insights

# Forward reachability is computed from these seeds so a `daemon_convergence`
# classification is proven rather than asserted. The analysis is an
# under-approximation -- a stage body reached only through a registry or a
# stored callable is not followed -- so being outside this reach is not proof
# of anything, while being inside it is proof of reachability.
convergence_stage_seeds:
  - polylogue.daemon.convergence_stages.make_default_convergence_stages

routes:
  # ── Demo/fixture seeding ────────────────────────────────────────────
  - function: polylogue.demo.seed._materialize_session_insights
    kinds: [direct_caller]
    entrypoints:
      - polylogue.storage.derived.session.rebuild.rebuild_session_insights_sync
    route: fixture_seeding
    reason: >-
      Seeds the deterministic demo archive. It is reached only from
      apply_demo_post_ingest_augmentation, whose own entry points are declared
      below. Not a route over an operator archive.

  - function: polylogue.demo.seed._seed_demo_archive_owned.finish
    kinds: [entry_root]
    entrypoints:
      - polylogue.storage.derived.session.rebuild.rebuild_session_insights_sync
    route: fixture_seeding
    reason: >-
      The post-ingest half of seed_demo_archive, run on a worker thread
      (asyncio.to_thread) so its synchronous archive custody never blocks the
      seed's event loop; the thread hop is why it is a root. It is reached from
      `polylogue demo seed`, `demo receipts` and `demo tour`, which build a
      throwaway demo archive in-process and refuse an unsafe target with
      DemoSeedTargetUnsafeError rather than writing wherever they are pointed.

  # ── Daemon-hosted demo augmentation ─────────────────────────────────
  - function: polylogue.operations.daemon_mutations.maintenance_demo_augment
    kinds: [entry_root]
    entrypoints:
      - polylogue.storage.derived.session.rebuild.rebuild_session_insights_sync
    route: daemon_operation
    reason: >-
      Handler for the declared `maintenance.demo.augment` operation
      (polylogue/operations/daemon_protocol.py), capability-gated on
      archive.demo_augment and executed inside the daemon under its authority.
      It applies demo-only post-ingest writes over context.archive_root; it is
      a root because the dispatcher resolves handlers by name.

  - function: polylogue.operations.mutation_actuators.InsightsRebuildActuator.apply
    kinds: [direct_caller, entry_root]
    entrypoints:
      - polylogue.storage.derived.session.rebuild.rebuild_session_insights_sync
    route: unreached
    reason: >-
      Nothing under polylogue/ constructs InsightsRebuildActuator. The
      `maintenance.insights.rebuild` operation is served by
      execute_insights_rebuild_operation, which converges through
      SessionInsightMaintenance and the shared session-profile owner, not
      through this actuator.

  - function: polylogue.pipeline.services.indexing.IndexService.rebuild_index
    kinds: [direct_caller, entry_root]
    entrypoints:
      - polylogue.pipeline.services.indexing.rebuild_index
      - polylogue.storage.fts.fts_lifecycle.rebuild_fts_index_async
    route: unreached
    reason: >-
      IndexService is re-exported from polylogue.pipeline but constructed by no
      production caller; only tests instantiate it. A full FTS rebuild through
      this class would be a second index-tier build path.

  - function: polylogue.pipeline.services.indexing.rebuild_index
    kinds: [direct_caller]
    entrypoints:
      - polylogue.pipeline.services.indexing.rebuild_index
      - polylogue.storage.fts.fts_lifecycle.rebuild_fts_index_async
    route: unreached
    reason: >-
      The module-level FTS rebuild is called only by IndexService.rebuild_index
      above, which has no production caller of its own.

  - function: polylogue.storage.derived.session.rebuild.rebuild_archive_session_insights
    kinds: [entry_root]
    entrypoints:
      - polylogue.storage.derived.session.rebuild.rebuild_archive_session_insights
    route: unreached
    reason: >-
      Its docstring claimed polylogue.api calls it; at this head nothing in
      production does, and its only callers are tests and
      tests/visual/conftest.py.

  - function: polylogue.storage.derived.session.rebuild.rebuild_session_insights_async
    kinds: [entry_root]
    entrypoints:
      - polylogue.storage.derived.session.rebuild.rebuild_session_insights_async
    route: unreached
    reason: >-
      The async twin of rebuild_session_insights_sync is exported and exercised
      only by tests; no production caller reaches it.

  - function: polylogue.storage.sqlite.archive_tiers.archive.ArchiveStore.rebuild_session_insights
    kinds: [direct_caller, entry_root]
    entrypoints:
      - polylogue.storage.derived.session.rebuild.rebuild_session_insights_sync
    route: unreached
    reason: >-
      The retained archive adapter delegates to this Store mutation owner.
      No product caller reaches the adapter; tests exercise its physical
      custody across the materializer's internal commits.
