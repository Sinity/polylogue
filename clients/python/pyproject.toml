[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polylogue-client"
version = "0.1.0"
requires-python = ">=3.10"
description = "Python access to the Polylogue daemon through its declared commands"

[tool.setuptools.packages.find]
include = ["polylogue"]
