[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
devkit = { workspace = true, features = ["cli", "bench"] }
libc.workspace = true
# The sandbox only: the archives would build the engine and the store into
# every xtask command.
polylogue-testkit = { path = "../crates/testkit", default-features = false }
serde_json.workspace = true

tempfile.workspace = true
workspace-hack = { version = "0.1", path = "../crates/workspace-hack" }
