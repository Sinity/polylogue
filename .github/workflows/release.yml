name: Release

# Dispatched by Release Please with its released tag, or triggered by an
# independently pushed annotated tag matching `vX.Y.Z`. Builds the
# wheel + sdist, smokes them through gate distribution on the
# build host, runs an installed-wheel smoke matrix across supported
# Python versions on Linux + macOS, signs the artifacts with Sigstore
# keyless OIDC, emits a CycloneDX SBOM, then:
#   - publishes to PyPI via Trusted Publishing (OIDC, no API token).
#
# The OCI image is built and published by `.github/workflows/container.yml`,
# which fans out across slim + distroless variants and linux/amd64 + linux/arm64.
#
# A manual `workflow_dispatch` path can replay an already-created tag. This is
# intentionally a release-artifact recovery path, not a way to publish the
# current default branch under an older version number.
#
# PyPI Trusted Publishing must be configured once in the project on
# pypi.org under "Publishing" → "Add a new pending publisher" with:
#   owner = Sinity, repo = polylogue, workflow = release.yml,
#   environment = pypi.
# See docs/release.md for the operator checklist.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vX.Y.Z tag whose exact source should be built (required to publish)"
        required: false
        default: ""
      publish:
        description: "Publish to PyPI (false = dry-run build/smoke only)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-tool-requirements
          path: packaging/*.txt
          if-no-files-found: error

  build:
    name: build-and-smoke
    needs: release-toolchain
    timeout-minutes: 20
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      main_hashes: ${{ steps.hashes.outputs.main }}
      mcp_hashes: ${{ steps.hashes.outputs.mcp }}
      hooks_hashes: ${{ steps.hashes.outputs.hooks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Manual recovery must package the immutable tag, not the workflow
          # branch that happens to contain this recovery machinery.
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0
      - name: Verify release source identity
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if [[ -z "${tag}" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ -n "${tag}" ]]; then
            if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release_tag must be vX.Y.Z, got '${tag}'"
              exit 1
            fi
            version="$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
            if [[ "${version}" != "${tag#v}" ]]; then
              echo "::error::${tag} does not match pyproject.toml version ${version}"
              exit 1
            fi
            tag_revision="$(git rev-parse "refs/tags/${tag}^{commit}")"
            if [[ "$(git rev-parse HEAD)" != "${tag_revision}" ]]; then
              echo "::error::checked-out source does not match ${tag} target"
              exit 1
            fi
            if [[ -n "${RELEASE_TAG}" ]]; then
              release_revision="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.target_commitish')"
              if [[ ! "${release_revision}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::GitHub Release ${tag} does not record an immutable commit SHA"
                exit 1
              fi
              if [[ "${tag_revision}" != "${release_revision}" ]]; then
                echo "::error::${tag} no longer matches its GitHub Release target"
                exit 1
              fi
            fi
          fi
          echo "revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.14t"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-tool-requirements
          path: ${{ runner.temp }}/release-tools
      - name: Install dev dependencies (frozen lockfile)
        run: uv sync --extra dev --group audit --frozen
      - name: Build wheel + sdist and smoke installed entrypoints
        run: uv run devtools gate distribution --work-dir "${RUNNER_TEMP}/dist" --keep-work-dir
        env:
          POLYLOGUE_FORCE_PLAIN: "1"
          UV_BUILD_CONSTRAINT: ${{ runner.temp }}/release-tools/hatchling.txt
      - name: Verify installed wheel exposes the exact build revision
        env:
          EXPECTED_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          uv venv "${RUNNER_TEMP}/build-info-venv"
          uv pip install --python "${RUNNER_TEMP}/build-info-venv/bin/python" "${RUNNER_TEMP}/dist/dist"/*.whl
          "${RUNNER_TEMP}/build-info-venv/bin/python" -I - <<'PY'
          import json
          import os

          from polylogue.version import VERSION_INFO

          payload = {
              "version": VERSION_INFO.version,
              "revision": VERSION_INFO.commit,
              "dirty": VERSION_INFO.dirty,
          }
          print(json.dumps(payload, sort_keys=True))
          assert payload["revision"] == os.environ["EXPECTED_REVISION"], payload
          assert len(payload["revision"] or "") == 40, payload
          assert payload["dirty"] is False, payload
          PY
      - name: Install hash-locked metadata checker
        run: |
          uv venv "${RUNNER_TEMP}/twine-venv"
          uv pip install --python "${RUNNER_TEMP}/twine-venv/bin/python" --require-hashes -r "${RUNNER_TEMP}/release-tools/twine.txt"
      - name: twine check (PyPI metadata long-description renderability)
        run: |
          "${RUNNER_TEMP}/twine-venv/bin/python" -m twine check "${RUNNER_TEMP}/dist/dist"/*.whl "${RUNNER_TEMP}/dist/dist"/*.tar.gz
      - name: Extract project version from pyproject.toml
        id: version
        run: |
          version=$(uv run python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Build polylogue-mcp wrapper distribution (#1309)
        run: |
          uv build --build-constraints "${RUNNER_TEMP}/release-tools/hatchling.txt" --require-hashes --out-dir "${RUNNER_TEMP}/dist-mcp" packaging/polylogue-mcp
          "${RUNNER_TEMP}/twine-venv/bin/python" -m twine check "${RUNNER_TEMP}/dist-mcp"/*.whl "${RUNNER_TEMP}/dist-mcp"/*.tar.gz
      - name: Build polylogue-hooks wrapper distribution (#1309)
        run: |
          uv build --build-constraints "${RUNNER_TEMP}/release-tools/hatchling.txt" --require-hashes --out-dir "${RUNNER_TEMP}/dist-hooks" packaging/polylogue-hooks
          "${RUNNER_TEMP}/twine-venv/bin/python" -m twine check "${RUNNER_TEMP}/dist-hooks"/*.whl "${RUNNER_TEMP}/dist-hooks"/*.tar.gz
      - name: Stage top-level wheel + sdist for downstream jobs
        run: |
          mkdir -p staged-dist
          cp "${RUNNER_TEMP}/dist/dist"/*.whl staged-dist/
          cp "${RUNNER_TEMP}/dist/dist"/*.tar.gz staged-dist/
          ls -la staged-dist/
      - name: Stage polylogue-mcp + polylogue-hooks wrapper distributions
        run: |
          mkdir -p staged-dist-mcp staged-dist-hooks
          cp "${RUNNER_TEMP}/dist-mcp"/*.whl staged-dist-mcp/
          cp "${RUNNER_TEMP}/dist-mcp"/*.tar.gz staged-dist-mcp/
          cp "${RUNNER_TEMP}/dist-hooks"/*.whl staged-dist-hooks/
          cp "${RUNNER_TEMP}/dist-hooks"/*.tar.gz staged-dist-hooks/
          ls -la staged-dist-mcp/ staged-dist-hooks/
      - name: Record staged distribution hashes
        id: hashes
        run: |
          python - <<'PYHASH'
          import hashlib, json, os
          from pathlib import Path
          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for kind, directory in [("main", "staged-dist"), ("mcp", "staged-dist-mcp"), ("hooks", "staged-dist-hooks")]:
                  hashes = {path.name: digest(path) for path in sorted(Path(directory).iterdir())}
                  print(f"{kind}={json.dumps(hashes, separators=(',', ':'))}", file=output)
          PYHASH
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distribution-artifacts
          path: staged-dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distribution-artifacts-mcp
          path: staged-dist-mcp/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distribution-artifacts-hooks
          path: staged-dist-hooks/*
          if-no-files-found: error

  installed-smoke:
    name: installed-smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The polylogue wheel declares `requires-python = ">=3.14"`; pip refuses
        # to install it on anything older, so an older leg here is a guaranteed
        # failure, not coverage. Keep this matrix equal to pyproject's floor.
        # `installed-smoke-hooks` below keeps 3.11+ because the polylogue-hooks
        # wheel declares its own `>=3.11` floor.
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distribution-artifacts
          path: dist/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}t
      - name: Install built wheel into fresh venv
        shell: bash
        run: |
          python -m venv .venv-smoke
          # shellcheck disable=SC1091
          source .venv-smoke/bin/activate
          wheel=$(find dist -maxdepth 1 -type f -name '*.whl' | sort | head -n1)
          echo "Installing ${wheel}"
          python -m pip install "${wheel}"
      - name: Smoke installed entrypoints against an empty XDG archive
        shell: bash
        env:
          POLYLOGUE_FORCE_PLAIN: "1"
        run: |
          # shellcheck disable=SC1091
          source .venv-smoke/bin/activate
          archive_root="${RUNNER_TEMP}/polylogue-archive"
          mkdir -p "${archive_root}"
          export POLYLOGUE_ARCHIVE_ROOT="${archive_root}"
          polylogue --version
          polylogue --help > /dev/null
          polylogued --help > /dev/null
          polylogue-mcp --help > /dev/null
          # `analyze` against an empty XDG archive must not crash on first-run
          # (covers schema bootstrap on a fresh database).
          polylogue --plain analyze
          # `--plain analyze --count` is the smoke parity with gate distribution.
          polylogue --plain analyze --count
          python -m polylogue --version

  installed-smoke-hooks:
    # polylogue-hooks has no runtime dependencies, so this smoke installs the
    # wrapper wheel in isolation (no polylogue, no third-party packages) and
    # exercises the polylogue-hook console script end-to-end (#1309).
    name: installed-smoke-hooks (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: build
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distribution-artifacts-hooks
          path: dist-hooks/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install polylogue-hooks wheel into fresh venv (no other deps)
        shell: bash
        run: |
          python -m venv .venv-hooks
          # shellcheck disable=SC1091
          source .venv-hooks/bin/activate
          wheel=$(find dist-hooks -maxdepth 1 -type f -name '*.whl' | sort | head -n1)
          python -m pip install "${wheel}"
          # Confirm zero third-party runtime closure (only pip/setuptools/wheel + polylogue-hooks).
          python -m pip list --format=freeze | sort > installed.txt
          cat installed.txt
          if grep -vE '^(pip|setuptools|wheel|polylogue-hooks)==' installed.txt; then
            echo "polylogue-hooks pulled an unexpected runtime dependency" >&2
            exit 1
          fi
      - name: Exercise polylogue-hook console script
        shell: bash
        run: |
          # shellcheck disable=SC1091
          source .venv-hooks/bin/activate
          # polylogue-hooks derives its spool from the resolved archive root
          # (polylogue-o7hx), not a separate hook-specific env override.
          archive_root="${RUNNER_TEMP}/polylogue-hooks-archive"
          export POLYLOGUE_ARCHIVE_ROOT="${archive_root}"
          sidecar="${archive_root}/hooks"
          # Supported event must succeed and write one pending spool envelope.
          printf '{"session_id":"abc123","model":"sonnet"}' | polylogue-hook SessionStart
          pending=$(find "${sidecar}/pending" -maxdepth 1 -type f -name '*.json')
          test -n "${pending}"
          grep -q '"event_type":"SessionStart"' "${pending}"
          # Unsupported event must exit non-zero without crashing the harness.
          if printf '{}' | polylogue-hook NotARealEvent; then
            echo "polylogue-hook should have rejected an unknown event type" >&2
            exit 1
          fi

  pipx-smoke:
    # pipx is the documented user-facing install route. Install the built
    # wheel with pipx itself so console-script discovery is not accidentally
    # relying on the repository's dev environment or a plain venv path.
    name: pipx-smoke
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distribution-artifacts
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-tool-requirements
          path: release-tools/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14t"
      - name: Install built wheel through pipx and smoke every console script
        shell: bash
        env:
          POLYLOGUE_FORCE_PLAIN: "1"
          PIPX_HOME: ${{ runner.temp }}/pipx-home
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx-bin
        run: |
          set -euo pipefail
          python -m pip install --user --require-hashes -r release-tools/pipx.txt
          wheel=$(find dist -maxdepth 1 -type f -name '*.whl' | sort | head -n1)
          python -m pipx install --suffix=-smoke "${wheel}"
          archive_root="${RUNNER_TEMP}/polylogue-pipx-archive"
          mkdir -p "${archive_root}"
          export POLYLOGUE_ARCHIVE_ROOT="${archive_root}"
          "${PIPX_BIN_DIR}/polylogue-smoke" --version
          "${PIPX_BIN_DIR}/polylogue-smoke" --plain analyze --count
          "${PIPX_BIN_DIR}/polylogued-smoke" --help > /dev/null
          "${PIPX_BIN_DIR}/polylogue-mcp-smoke" --help > /dev/null

  installed-smoke-mcp:
    # polylogue-mcp is a thin wrapper that pins the matching polylogue release.
    # Install both wheels together and confirm the console script resolves
    # exactly the same target the full polylogue install does (#1309).
    name: installed-smoke-mcp (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # This leg installs the main polylogue wheel alongside the wrapper, so
        # it inherits polylogue's `requires-python = ">=3.14"` floor even though
        # polylogue-mcp's own metadata permits 3.11.
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distribution-artifacts
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distribution-artifacts-mcp
          path: dist-mcp/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}t
      - name: Install polylogue + polylogue-mcp wrapper into fresh venv
        shell: bash
        run: |
          python -m venv .venv-mcp
          # shellcheck disable=SC1091
          source .venv-mcp/bin/activate
          main_wheel=$(find dist -maxdepth 1 -type f -name '*.whl' | sort | head -n1)
          mcp_wheel=$(find dist-mcp -maxdepth 1 -type f -name '*.whl' | sort | head -n1)
          python -m pip install "${main_wheel}" "${mcp_wheel}"
      - name: Smoke polylogue-mcp wrapper console script
        shell: bash
        env:
          POLYLOGUE_FORCE_PLAIN: "1"
        run: |
          # shellcheck disable=SC1091
          source .venv-mcp/bin/activate
          polylogue-mcp --help > /dev/null

  sbom:
    name: sbom
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distribution-artifacts
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-tool-requirements
          path: release-tools/
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.14t"
      - name: Generate CycloneDX SBOM from built wheel
        run: |
          wheel=$(find dist -maxdepth 1 -type f -name '*.whl' | sort | head -n1)
          mkdir -p sbom
          # Resolve the dependency closure inside a fresh venv so the SBOM
          # reflects what `pip install polylogue==X.Y.Z` would actually pull.
          uv venv .venv-sbom
          # shellcheck disable=SC1091
          source .venv-sbom/bin/activate
          uv pip install "${wheel}"
          uv venv .venv-sbom-tools
          uv pip install --python .venv-sbom-tools/bin/python --require-hashes -r release-tools/cyclonedx-bom.txt
          .venv-sbom-tools/bin/cyclonedx-py environment .venv-sbom \
            --output-format json \
            --output-file sbom/polylogue-${{ needs.build.outputs.version }}.cdx.json
          .venv-sbom-tools/bin/cyclonedx-py environment .venv-sbom \
            --output-format xml \
            --output-file sbom/polylogue-${{ needs.build.outputs.version }}.cdx.xml
          ls -la sbom/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-artifacts
          path: sbom/*
          if-no-files-found: error

  publish-pypi:
    name: publish-pypi
    needs: [build, installed-smoke, installed-smoke-mcp, installed-smoke-hooks, pipx-smoke, sbom]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true' && inputs.release_tag != '')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/polylogue/${{ needs.build.outputs.version }}/
    permissions:
      # OIDC token for PyPI Trusted Publishing + Sigstore keyless signing.
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distribution-artifacts
          path: dist/
      - name: List artifacts about to be signed and published
        run: ls -la dist/
      - name: Verify staged distribution hashes
        env:
          EXPECTED_HASHES: ${{ needs.build.outputs.main_hashes }}
        run: |
          python - <<'PYHASH'
          import hashlib, json, os
          from pathlib import Path
          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          expected = json.loads(os.environ["EXPECTED_HASHES"])
          actual = {path.name: digest(path) for path in Path("dist").iterdir() if path.is_file()}
          if not expected or actual != expected:
              raise SystemExit("staged distribution hashes do not match the build job")
          PYHASH
      - name: Pin Sigstore bootstrap installer
        # The pinned action invokes pip install uv and uv pip install uv.
        # Both resolvers must select the same fixed release.
        run: |
          printf 'uv==0.12.21\n' > "${RUNNER_TEMP}/sigstore-bootstrap-constraints.txt"
      - name: Sign wheel + sdist with Sigstore (keyless OIDC)
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        env:
          PIP_CONSTRAINT: ${{ runner.temp }}/sigstore-bootstrap-constraints.txt
          UV_CONSTRAINT: ${{ runner.temp }}/sigstore-bootstrap-constraints.txt
        with:
          inputs: |
            ./dist/*.whl
            ./dist/*.tar.gz
          upload-signing-artifacts: true
      - name: Drop Sigstore bundles before PyPI upload
        # PyPI's gh-action-pypi-publish rejects anything other than .whl / .tar.gz
        # in the dist/ directory. The .sigstore bundles are retained as the
        # `signing-artifacts-publish-pypi` workflow artifact attached to the
        # run by sigstore/gh-action-sigstore-python.
        run: |
          find dist/ -type f ! \( -name '*.whl' -o -name '*.tar.gz' \) -delete
          ls -la dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
          verbose: true

  dispatch-homebrew:
    name: Dispatch Homebrew after main package publication
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch exact published tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
          RECOVERY_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            gh workflow run homebrew-bump.yml --ref "${RELEASE_TAG}"
          else
            gh workflow run homebrew-bump.yml --ref "${GITHUB_REF_NAME}" -f "release_tag=${RECOVERY_TAG}"
          fi

  publish-pypi-mcp:
    # Independent Trusted Publisher binding on PyPI is required for this
    # project name. Register it once via PyPI → Publishing → Add a new pending
    # publisher with owner=Sinity, repo=polylogue, workflow=release.yml,
    # environment=pypi-mcp before the first tagged release reaches this job.
    name: publish-pypi-mcp
    needs: [build, installed-smoke-mcp, sbom, publish-pypi]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true' && inputs.release_tag != '')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment:
      name: pypi-mcp
      url: https://pypi.org/project/polylogue-mcp/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distribution-artifacts-mcp
          path: dist/
      - name: List artifacts about to be signed and published
        run: ls -la dist/
      - name: Verify staged distribution hashes
        env:
          EXPECTED_HASHES: ${{ needs.build.outputs.mcp_hashes }}
        run: |
          python - <<'PYHASH'
          import hashlib, json, os
          from pathlib import Path
          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          expected = json.loads(os.environ["EXPECTED_HASHES"])
          actual = {path.name: digest(path) for path in Path("dist").iterdir() if path.is_file()}
          if not expected or actual != expected:
              raise SystemExit("staged distribution hashes do not match the build job")
          PYHASH
      - name: Pin Sigstore bootstrap installer
        # The pinned action invokes pip install uv and uv pip install uv.
        # Both resolvers must select the same fixed release.
        run: |
          printf 'uv==0.12.21\n' > "${RUNNER_TEMP}/sigstore-bootstrap-constraints.txt"
      - name: Sign wheel + sdist with Sigstore (keyless OIDC)
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        env:
          PIP_CONSTRAINT: ${{ runner.temp }}/sigstore-bootstrap-constraints.txt
          UV_CONSTRAINT: ${{ runner.temp }}/sigstore-bootstrap-constraints.txt
        with:
          inputs: |
            ./dist/*.whl
            ./dist/*.tar.gz
          upload-signing-artifacts: true
      - name: Drop Sigstore bundles before PyPI upload
        run: |
          find dist/ -type f ! \( -name '*.whl' -o -name '*.tar.gz' \) -delete
          ls -la dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
          verbose: true

  publish-pypi-hooks:
    # Independent Trusted Publisher binding on PyPI is required for this
    # project name. Register it once via PyPI → Publishing → Add a new pending
    # publisher with owner=Sinity, repo=polylogue, workflow=release.yml,
    # environment=pypi-hooks before the first tagged release reaches this job.
    name: publish-pypi-hooks
    needs: [build, installed-smoke-hooks, sbom]
