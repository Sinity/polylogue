name: package

# Builds the Nix package of each master commit and publishes its runtime
# closure to sinity.cachix.org, where Sinnix fetches it when it moves its pin
# to that commit; Sinnix never compiles a product. The build is the flake at
# the pushed revision, so it is the same derivation Sinnix evaluates (the
# product keeps its own nixpkgs). Sinnix can pin a revision master does not
# contain, such as a deployment branch's head: build it with
# `gh workflow run package -f rev=<commit>`.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      rev:
        description: Commit to build and publish
        required: true

env:
  REV: ${{ inputs.rev || github.sha }}

concurrency:
  group: package-${{ inputs.rev || github.sha }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space for the build
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          sudo nohup rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: sinity
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Build the package
        run: |
          out=$(nix build --no-link --print-build-logs --print-out-paths "github:${GITHUB_REPOSITORY}/${REV}#default")
          echo "built $out"
          echo "out=$out" >> "$GITHUB_ENV"
      - name: Publish the package and its compiler dependencies to sinity.cachix.org
        run: |
          dependencies=$(nix build --no-link --print-out-paths "github:${GITHUB_REPOSITORY}/${REV}#polylogue-dependencies")
          cachix push sinity "$out" "$dependencies"
