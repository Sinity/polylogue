name: Extension Release

# Packages the browser-extension/ Manifest V3 source into Chrome (.zip) and
# Firefox (.xpi) artifacts, runs addons-linter and the in-tree manifest
# validator, captures store-submission screenshots via headless Playwright,
# and uploads the bundle to the corresponding GitHub Release.
#
# Trigger surface:
#   - tag push v*.*.*    → builds, lints, screenshots, attaches to release
#   - workflow_dispatch  → dry-run build, or backfills an existing release tag
#   - pull_request paths → build + validate only (no upload), smoke gate
#
# Versioning: the build script reads `version` from the [project] table of
# pyproject.toml and rewrites browser-extension/{manifest.json,package.json}
# to match. The committed sources are normally kept in sync by the
# release-please bump PR, but a tag push will re-sync defensively before
# packaging.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths:
      - browser-extension/**
      - .github/workflows/extension-release.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vX.Y.Z tag to build from and attach to (empty = dry-run)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-toolchain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extension-release-tools
          path: |
            browser-extension/package.json
            browser-extension/package-lock.json
            browser-extension/scripts/screenshots.mjs
            browser-extension/scripts/screenshots.test.mjs
          if-no-files-found: error

  build:
    name: build-validate-screenshot
    needs: release-toolchain
    env:
      RELEASE_TOOLS: ${{ runner.temp }}/extension-release-tools
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-extension
    outputs:
      version: ${{ steps.summary.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Recovery builds the extension sources that belong to the release,
          # not whatever code later reached the default branch.
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Record packaged source revision
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if [[ -z "${tag}" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ -n "${tag}" ]]; then
            if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release_tag must be vX.Y.Z, got '${tag}'"
              exit 1
            fi
            tag_revision="$(git rev-parse "refs/tags/${tag}^{commit}")"
            if [[ "$(git rev-parse HEAD)" != "${tag_revision}" ]]; then
              echo "::error::checked-out source does not match ${tag} target"
              exit 1
            fi
            if [[ -n "${RELEASE_TAG}" ]]; then
              release_revision="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.target_commitish')"
              if [[ ! "${release_revision}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::GitHub Release ${tag} does not record an immutable commit SHA"
                exit 1
              fi
              if [[ "${tag_revision}" != "${release_revision}" ]]; then
                echo "::error::${tag} no longer matches its GitHub Release target"
                exit 1
              fi
            fi
          fi
          echo "revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: extension-release-tools
          path: ${{ runner.temp }}/extension-release-tools
      - name: Install locked release tools
        run: npm ci --prefix "${RELEASE_TOOLS}"
      - name: Install dependencies
        run: npm ci
      - name: Validate manifest (in-tree, fast)
        run: npm run validate
      - name: Lint sources
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build Chrome zip + Firefox xpi
        run: npm run build
      - name: Lint Firefox xpi
        run: |
          set -euo pipefail
          xpi=$(find dist -maxdepth 1 -type f -name 'polylogue-browser-capture-*-firefox.xpi' | sort | head -n1)
          # Validate the same unpacked Firefox bundle with the locked linter.
          mkdir -p dist/firefox-unpacked
          unzip -qo "$xpi" -d dist/firefox-unpacked
          "${RELEASE_TOOLS}/node_modules/.bin/addons-linter" dist/firefox-unpacked
      - name: Install Playwright Chromium
        run: npm run --prefix "${RELEASE_TOOLS}" install:screenshot-browser
      - name: Capture submission screenshots
        run: |
          cp -R src "${RELEASE_TOOLS}/src"
          npm run --prefix "${RELEASE_TOOLS}" test:screenshots
          npm run --prefix "${RELEASE_TOOLS}" screenshots -- --out "${GITHUB_WORKSPACE}/browser-extension/dist/screenshots"
      - name: Summarize artifacts
        id: summary
        run: |
          set -euo pipefail
          version=$(node -e "console.log(require('./dist/build-manifest.json').version)")
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Built artifacts for version ${version}:"
          ls -la dist/
      - name: Write store-submission manifest
        env:
          VERSION: ${{ steps.summary.outputs.version }}
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          dist = Path("dist")
          version = os.environ["VERSION"]
          revision = os.environ["SOURCE_REVISION"]
          chrome = sorted(dist.glob("polylogue-browser-capture-*-chrome.zip"))
          firefox = sorted(dist.glob("polylogue-browser-capture-*-firefox.xpi"))
          if len(chrome) != 1 or len(firefox) != 1:
              raise SystemExit(f"expected one Chrome zip and one Firefox xpi, found chrome={chrome}, firefox={firefox}")
          artifacts = [chrome[0], firefox[0]]
          expected_names = {
              f"polylogue-browser-capture-{version}-chrome.zip",
              f"polylogue-browser-capture-{version}-firefox.xpi",
          }
          if {path.name for path in artifacts} != expected_names:
              raise SystemExit(f"artifact names do not match version {version}: {artifacts}")
          if re.fullmatch(r"[0-9a-f]{40}", revision) is None:
              raise SystemExit(f"source revision is not a full immutable SHA: {revision!r}")
          payload = {
              "schema_version": 1,
              "version": version,
              "source_revision": revision,
              "firefox_gecko_id": json.loads((dist / "build-manifest.json").read_text())["firefox_gecko_id"],
              "artifacts": [
                  {
                      "name": path.name,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "size_bytes": path.stat().st_size,
                  }
                  for path in artifacts
              ],
          }
          target = dist / f"polylogue-browser-capture-{version}-store-submission.json"
          target.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(target.read_text(), end="")
          PY
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-extension-${{ steps.summary.outputs.version }}
          path: |
            browser-extension/dist/polylogue-browser-capture-*-chrome.zip
            browser-extension/dist/polylogue-browser-capture-*-firefox.xpi
            browser-extension/dist/polylogue-browser-capture-*-store-submission.json
            browser-extension/dist/build-manifest.json
            browser-extension/dist/screenshots/**
          if-no-files-found: error

  attach-to-release:
    name: attach-to-release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download workflow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: browser-extension-${{ needs.build.outputs.version }}
          path: artifacts/
      - name: Resolve target tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.release_tag }}"
          fi
          if [ -z "${tag}" ]; then
            echo "no target tag — skipping upload" >&2
            exit 0
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must be vX.Y.Z, got '${tag}'"
            exit 1
          fi
          if [[ "${{ needs.build.outputs.version }}" != "${tag#v}" ]]; then
            echo "::error::artifact version ${{ needs.build.outputs.version }} does not match ${tag}"
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Upload artifacts to release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # `gh release upload --clobber` overwrites identically-named
          # assets so a retried workflow does not 422 on duplicates.
          gh release upload "${TAG}" \
            artifacts/polylogue-browser-capture-*-chrome.zip \
            artifacts/polylogue-browser-capture-*-firefox.xpi \
            artifacts/polylogue-browser-capture-*-store-submission.json \
            artifacts/build-manifest.json \
            --clobber --repo "${GITHUB_REPOSITORY}"
          # Screenshots are uploaded as a tar.gz so the release page does
          # not balloon with 18 individual PNGs.
          tar -C artifacts/screenshots -czf "store-screenshots-${TAG}.tar.gz" .
          gh release upload "${TAG}" "store-screenshots-${TAG}.tar.gz" \
            --clobber --repo "${GITHUB_REPOSITORY}"
