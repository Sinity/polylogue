name: Release Please

# Watches conventional-commit subjects on `master` and maintains a single
# open release PR that bumps `pyproject.toml`, updates `CHANGELOG.md`, and
# tags `vX.Y.Z` on merge. The downstream `release.yml` workflow handles
# the actual PyPI publish. Explicit dispatches below start the tag consumers
# because GITHUB_TOKEN-created tag pushes do not trigger workflow runs.
#
# See docs/release.md for the operator-facing flow.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.release.outputs.release_created == 'true' && steps.release.outputs.tag_name || '' }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  dispatch:
    name: Dispatch ${{ matrix.workflow }}
    needs: release-please
    if: needs.release-please.outputs.release_tag != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workflow: [release.yml, container.yml, extension-release.yml, flakehub.yml, cachix.yml]
    steps:
      - name: Dispatch released tag consumer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.release_tag }}
          WORKFLOW: ${{ matrix.workflow }}
        # Separate jobs retain the successful producer's outputs when failed
        # jobs are rerun. One rejected dispatch cannot prevent other consumers.
        run: |
          set -euo pipefail
          case "${WORKFLOW}" in
            release.yml) gh workflow run "${WORKFLOW}" --ref "${RELEASE_TAG}" -f "release_tag=${RELEASE_TAG}" -f publish=true ;;
            container.yml) gh workflow run "${WORKFLOW}" --ref "${RELEASE_TAG}" -f push=true ;;
            *) gh workflow run "${WORKFLOW}" --ref "${RELEASE_TAG}" ;;
          esac
