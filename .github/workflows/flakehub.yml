name: FlakeHub

# Publish the polylogue flake to FlakeHub (https://flakehub.com) for
# discoverability beyond niche Nix circles. Triggered on release tags
# matching `vX.Y.Z`, Release Please dispatch on its exact released tag,
# and manual branch dispatch (e.g. for a rolling `0.1.x`
# pre-release publish from master).
#
# FlakeHub uses OIDC for authentication (no secrets required), keyed off
# the `id-token: write` permission on this workflow.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag or rolling channel to publish (e.g. 0.1.0-rolling)"
        required: false
        default: "0.1.0-rolling"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
        with:
          source-tag: v3.22.5
      - name: Push flake to FlakeHub
        uses: DeterminateSystems/flakehub-push@e001ee821cdb763ef120c01f1048bfb2f938bb9c
        with:
          source-revision: e001ee821cdb763ef120c01f1048bfb2f938bb9c
          visibility: public
          rolling: ${{ github.event_name == 'workflow_dispatch' && github.ref_type != 'tag' }}
          rolling-minor: ${{ github.event_name == 'workflow_dispatch' && github.ref_type != 'tag' && inputs.tag || '' }}
          tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
