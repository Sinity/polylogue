name: PR scope authority

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-scope-authority-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: pr-scope-authority
    runs-on: ubuntu-latest
    env:
      EVENT_PR: ${{ github.event.pull_request.number }}
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the event base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch candidate commit as Git data
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${EVENT_BASE_SHA}" ]]
          candidate_ref="refs/polylogue/pr-scope-authority/${EVENT_PR}"
          git fetch --no-tags origin "+refs/pull/${EVENT_PR}/head:${candidate_ref}"
          [[ "$(git rev-parse "${candidate_ref}^{commit}")" == "${EVENT_HEAD_SHA}" ]]
      - name: Validate with base-authoritative code
        shell: bash
        run: |
          set -euo pipefail
          python devtools/pr_scope.py check-authority \
            --pr "${EVENT_PR}" \
            --repo "${GITHUB_REPOSITORY}" \
            --event-head-sha "${EVENT_HEAD_SHA}" \
            --event-base-sha "${EVENT_BASE_SHA}"
