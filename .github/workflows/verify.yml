name: Verify

# The real test evidence for a change. Hosted CI runs only the quick gate, so a
# green PR check there does not mean tests ran; this job runs `devtools verify`
# on the workstation runner, where pytest goes through the host's single
# `pytest` pueue slot automatically.
# On demand only. Candidates land on the quick gate; the corpus runs once per
# landing wave and nightly through agentctl's verify_all, which owns the host
# pytest pool. A push trigger queued one host pytest run per merge.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# One run per ref: a newer push supersedes the run for the same PR. Host-wide
# serialisation of pytest is the pueue `pytest` slot, not GitHub; a global
# group here cancels every waiting run whenever another PR pushes.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: [self-hosted, sinnix-prime]
    timeout-minutes: 120
    steps:
      # clean: false keeps the runner's gitignored state -- the testmon
      # datafile and the devshell venv -- so a run selects instead of seeding.
      # `devtools verify` provisions the graph itself: it keeps this checkout's
      # own datafile, and copies the primary's only when that one would select
      # where this one would re-execute the corpus.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: false

      - name: Check that the pull request is still open
        id: pr-state
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          state=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            | jq --raw-output .state)
          if [ "$state" != open ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # `devtools verify` names the run it produced in .cache/verify/current-run.json;
      # the receipt check below is bound to that run id, never to the newest file.
      - name: Verify
        id: verify
        if: steps.pr-state.outputs.skip != 'true'
        run: |
          export PATH="/run/current-system/sw/bin:$PATH"
          nix develop --command devtools verify
          echo "run_id=$(jq --raw-output .run_id .cache/verify/current-run.json)" >> "$GITHUB_OUTPUT"
        env:
          POLYLOGUE_FORCE_PLAIN: "1"
          POLYLOGUE_PYTEST_WORKERS: "4"

      # A zero exit is not the evidence; the run receipt is. The check fails
      # unless this run's receipt succeeded and either a pytest step ran to
      # success or the selection was "none" for a recorded reason.
      - name: Require test evidence in the run receipt
        if: steps.pr-state.outputs.skip != 'true'
        env:
          VERIFY_RUN_ID: ${{ steps.verify.outputs.run_id }}
        run: |
          export PATH="/run/current-system/sw/bin:$PATH"
          nix develop --command python -m devtools.verify_receipt_check --run-id "$VERIFY_RUN_ID"
