name: check

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      rev:
        description: Exact full commit SHA to check
        required: true

# Test logs list failures as they happen; after the summary they list slow
# tests and repeat each failure's full output.
env:
  CARGO_TERM_COLOR: always
  NEXTEST_STATUS_LEVEL: fail
  NEXTEST_FINAL_STATUS_LEVEL: slow
  NEXTEST_FAILURE_OUTPUT: immediate-final

concurrency:
  group: check-${{ inputs.rev || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # A pull request's checkout is its merge commit; the first parent is the
      # base branch's tip, the base `xtask check` selects tests against.
      # A manual run instead checks exactly the requested source commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.rev || '' }}
      - name: Verify the selected source commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_REV: ${{ inputs.rev }}
        run: |
          actual=$(git rev-parse HEAD)
          printf 'requested commit: %s\nchecked commit: %s\n' "$EXPECTED_REV" "$actual"
          test "$actual" = "$EXPECTED_REV"
      - name: Free disk space for the test build
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          sudo nohup rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Browser extension checks and real archives
        run: |
          sudo apt-get install --yes zip
          npm --prefix extension ci
          npm --prefix extension run check
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@nextest
      - name: nats-server for the Sinex client tests
        run: |
          curl -sSfL https://github.com/nats-io/nats-server/releases/download/v2.10.22/nats-server-v2.10.22-linux-amd64.tar.gz | tar xz
          sudo mv nats-server-v2.10.22-linux-amd64/nats-server /usr/local/bin/
      # Every event may reuse master's whole target directory, whose source
      # commit is recorded alongside it. Full test selection on master is
      # independent of compiler reuse. A fresh checkout makes source files
      # newer than the saved build. Cargo uses file times, so sources are dated before
      # the build and the files that differ from the saved commit are dated
      # now: Cargo rebuilds the packages those files belong to and the ones
      # depending on them, and reuses the rest.
      - name: Restore master's build
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: check-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Date sources against the restored build
        run: |
          built=$(cat target/source-commit 2>/dev/null) || exit 0
          git fetch --no-tags --depth=1 origin "$built" || exit 0
          git ls-files -z | xargs -0 touch -h -d '2000-01-01 00:00:00 UTC'
          git diff --no-renames --name-only -z "$built" HEAD | xargs -0 -r touch -h -c
          echo "restored build of $built; $(git diff --no-renames --name-only "$built" HEAD | wc -l) files differ"
      # Pull requests check their merge tree; pushes and exact-revision dispatches run all tests.
      - name: cargo xtask check
        run: cargo xtask check ${{ github.event_name == 'pull_request' && '--changed-base HEAD^1' || '' }}
      # A failed test leaves a valid build, so it is saved too.
      - name: Save master's build
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: git rev-parse HEAD > target/source-commit
      - if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}
