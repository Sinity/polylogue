name: check

on:
  workflow_dispatch:
    inputs:
      rev:
        description: Exact synthetic experiment commit
        required: true

concurrency:
  group: sqlite-version-control-${{ inputs.rev }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rev }}
          fetch-depth: 1
      - name: Verify exact experimental source
        env:
          EXPECTED_REV: ${{ inputs.rev }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REV"
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Free hosted disk space before full synthetic generation
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
      - name: Build the synthetic-only native experiment
        run: CARGO_TARGET_DIR="$RUNNER_TEMP/sqlite-versions-target" cargo build --release --locked -j 2 --manifest-path experiment/Cargo.toml
      - name: Version selection, original citations and interrupted publication
        run: python3 -I experiment/check.py --root "$RUNNER_TEMP/sqlite-versions-case" --binary "$RUNNER_TEMP/sqlite-versions-target/release/sqlite-versions"
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: sinity
          skipPush: true
      - name: Verify the frozen production ranking oracle
        run: |
          runtime=$(nix build --no-link --print-out-paths --option max-jobs 0 "github:${GITHUB_REPOSITORY}/df0f6aead03ee6329e8e768497b3d6688c5d9512#default")
          nix store verify --sigs-needed 1 "$runtime"
          "$runtime/bin/polylogue" --version | grep -F df0f6aead03ee6329e8e768497b3d6688c5d9512
          echo "production_runtime=$runtime" >> "$GITHUB_ENV"
      - name: Production distinct-text vocabulary and exact native ranking
        run: |
          python3 -I experiment/ranking.py --root "$RUNNER_TEMP/compact-ranking-screen" \
            --binary "$RUNNER_TEMP/sqlite-versions-target/release/sqlite-versions" \
            --production "$production_runtime/bin/polylogue" \
            --revision df0f6aead03ee6329e8e768497b3d6688c5d9512
      - name: Retain synthetic receipts and final partitions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-version-control
          path: ${{ runner.temp }}/sqlite-versions-case
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain production parity screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-distinct-text-screen
          path: ${{ runner.temp }}/compact-ranking-screen
          if-no-files-found: ignore
          retention-days: 7
