name: Sinex binary recovery diagnostic

on:
  workflow_dispatch:
    inputs:
      rev:
        description: Exact full test source revision
        required: true

permissions:
  contents: read

concurrency:
  group: sinex-binary-recovery-${{ inputs.rev }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"
  NEXTEST_STATUS_LEVEL: pass
  NEXTEST_FINAL_STATUS_LEVEL: all
  NEXTEST_FAILURE_OUTPUT: immediate-final
  OLD_PACKAGE: /nix/store/rfnnzfnla0jfv3ck0nvaj165bmshifjn-sinex-0.1.0
  NEW_PACKAGE: /nix/store/2sd07wlaxadikb4i07qwbny5qzgrngs1-sinex-0.1.0
  PG_PACKAGE: /nix/store/9hi4z663c6c4kanj67dxh878nacy5wc9-postgresql-and-plugins-18.6
  SINEXD: /nix/store/2sd07wlaxadikb4i07qwbny5qzgrngs1-sinex-0.1.0/bin/sinexd
  SINEXD_BEFORE: /nix/store/rfnnzfnla0jfv3ck0nvaj165bmshifjn-sinex-0.1.0/bin/sinexd
  SINEXD_REVISION: cd4551a384702c183c5aa3afc8132cd200404b4a
  SINEXD_BEFORE_REVISION: 3fbb9d0ee5d7741e55c260c99030322d795b1937

jobs:
  native_recovery:
    name: native Sinex binary recovery
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # A pull request's checkout is its merge commit; the first parent is the
      # base branch's tip, the base `xtask check` selects tests against.
      # A manual run instead checks exactly the requested source commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.rev || '' }}
      - name: Verify the selected source commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_REV: ${{ inputs.rev }}
        run: |
          actual=$(git rev-parse HEAD)
          printf 'requested commit: %s\nchecked commit: %s\n' "$EXPECTED_REV" "$actual"
          test "$actual" = "$EXPECTED_REV"
      - name: Free disk space for the test build
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          sudo nohup rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shells for completion tests
        run: sudo apt-get install --yes zip zsh fish
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@nextest
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: sinity
          skipPush: true
      - name: nats-server for the Sinex client tests
        run: |
          curl -sSfL https://github.com/nats-io/nats-server/releases/download/v2.10.22/nats-server-v2.10.22-linux-amd64.tar.gz | tar xz
          sudo mv nats-server-v2.10.22-linux-amd64/nats-server /usr/local/bin/
      - name: Substitute and verify exact signed runtimes
        run: |
          set -euo pipefail
          nix-store --realise "$OLD_PACKAGE" "$NEW_PACKAGE" "$PG_PACKAGE" --option substitute true --option always-allow-substitutes true --option max-jobs 0 --option builders ""
          nix store verify --sigs-needed 1 "$OLD_PACKAGE" "$NEW_PACKAGE" "$PG_PACKAGE"
          "$OLD_PACKAGE/bin/sinexd" --version
          "$NEW_PACKAGE/bin/sinexd" --version
          "$PG_PACKAGE/bin/postgres" --version
          echo "$PG_PACKAGE/bin" >> "$GITHUB_PATH"
      # Every event may reuse master's whole target directory, whose source
      # commit is recorded alongside it. Full test selection on master is
      # independent of compiler reuse. A fresh checkout makes source files
      # newer than the saved build. Cargo uses file times, so sources are dated before
      # the build and the files that differ from the saved commit are dated
      # now: Cargo rebuilds the packages those files belong to and the ones
      # depending on them, and reuses the rest.
      - name: Restore master's build
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: check-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Date sources against the restored build
        run: |
          built=$(cat target/source-commit 2>/dev/null) || exit 0
          git fetch --no-tags --depth=1 origin "$built" || exit 0
          git ls-files -z | xargs -0 touch -h -d '2000-01-01 00:00:00 UTC'
          git diff --no-renames --name-only -z "$built" HEAD | xargs -0 -r touch -h -c
          echo "restored build of $built; $(git diff --no-renames --name-only "$built" HEAD | wc -l) files differ"
      - name: Run only the native binary recovery case
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sx-recovery"
          export TMPDIR="$RUNNER_TEMP/sx-recovery"
          cargo xtask test -p polylogue-sinex --test rebuild --build-jobs 1 --test-threads 1 --run-ignored only --retries 0 --success-output immediate-final -E 'test(binary_recovery::a_new_binary_recovers_originals_and_admission_after_the_old_binary_refuses_its_declaration)'
