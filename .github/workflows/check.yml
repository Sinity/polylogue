name: search-work-budget diagnostic

on:
  workflow_dispatch:
    inputs:
      rev:
        description: Exact diagnostic source commit (never a release check)
        required: true

concurrency:
  group: search-work-budget-${{ inputs.rev }}
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ inputs.rev }}
      - name: Verify the exact diagnostic source
        env:
          EXPECTED_REV: ${{ inputs.rev }}
        run: |
          actual=$(git rev-parse HEAD)
          printf 'requested commit: %s\nchecked commit: %s\n' "$EXPECTED_REV" "$actual"
          test "$actual" = "$EXPECTED_REV"
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Focused Reader and complete-key discriminator
        run: cargo test --locked -p polylogue-store --features faults --lib search_budget_diagnostic -- --nocapture --test-threads=1
