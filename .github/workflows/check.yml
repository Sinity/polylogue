name: check

on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  push:
    branches: [master]
    paths-ignore: ["**/*.md", "docs/**"]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the test build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@nextest
      - name: nats-server for the Sinex client tests
        run: |
          curl -sSfL https://github.com/nats-io/nats-server/releases/download/v2.10.22/nats-server-v2.10.22-linux-amd64.tar.gz | tar xz
          sudo mv nats-server-v2.10.22-linux-amd64/nats-server /usr/local/bin/
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: cargo xtask check
        run: cargo xtask check
