name: check
on:
  workflow_dispatch:
    inputs:
      rev:
        description: Exact revision with the comparison fixture
        required: true
jobs:
  event-collision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ inputs.rev }}
      - uses: ./.github/actions/rust
        with:
          rev: ${{ inputs.rev }}
      - run: cargo xtask test -p polylogue-store --lib -E 'test(a_replayed_event_cannot_collide_with_the_rebuilds_reading)'
