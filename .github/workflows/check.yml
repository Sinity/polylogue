name: check

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # A pull request's checkout is its merge commit; the first parent is the
      # base branch's tip, the base `xtask check` selects tests against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Free disk space for the test build
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          sudo nohup rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@nextest
      - name: nats-server for the Sinex client tests
        run: |
          curl -sSfL https://github.com/nats-io/nats-server/releases/download/v2.10.22/nats-server-v2.10.22-linux-amd64.tar.gz | tar xz
          sudo mv nats-server-v2.10.22-linux-amd64/nats-server /usr/local/bin/
      # Master builds from scratch and saves its whole target directory, the
      # exact build of that commit; a pull request starts from it. Cargo
      # decides freshness by file times, and a fresh checkout makes every
      # source newer than the saved build, so every source is dated before
      # the build and the files that differ from the saved commit are dated
      # now: Cargo rebuilds the packages those files belong to and the ones
      # depending on them, and reuses the rest.
      - name: Restore master's build
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: check-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Date sources against the restored build
        if: github.event_name == 'pull_request'
        run: |
          built=$(cat target/source-commit 2>/dev/null) || exit 0
          git fetch --no-tags --depth=1 origin "$built" || exit 0
          git ls-files -z | xargs -0 touch -h -d '2000-01-01 00:00:00 UTC'
          git diff --no-renames --name-only -z "$built" HEAD | xargs -0 -r touch -h -c
          echo "restored build of $built; $(git diff --no-renames --name-only "$built" HEAD | wc -l) files differ"
      # Pull requests run the tests their changes can affect; master runs all.
      - name: cargo xtask check
        run: cargo xtask check ${{ github.event_name == 'pull_request' && '--changed-base HEAD^1' || '' }}
      # A failed test leaves a valid build, so it is saved too.
      - name: Save master's build
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
        run: git rev-parse HEAD > target/source-commit
      - if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ hashFiles('rust-toolchain.toml') }}-${{ github.sha }}
