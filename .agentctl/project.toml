schema = 1
[project]
id = "polylogue"
display_name = "Polylogue"
root_markers = ["Cargo.toml", "crates"]
[environment]
kind = "direct"
command = ["env"]
inherit = ["HOME", "USER", "PATH", "LANG", "XDG_RUNTIME_DIR", "CARGO_TARGET_DIR"]
unset = ["PYTHONPATH", "PYTHONHOME"]

[operations.fast]
description = "Formatting, crate boundaries and strict Clippy in the development queue"
exec = ["nix", "develop", "--command", "cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "fast"]
pool = "normal"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"
cap = "cargo"
unit_properties = ["MemoryHigh=8G"]

[operations.check]
description = "Formatting, crate boundaries and the full workspace test suite (cargo nextest)"
exec = ["nix", "develop", "--command", "cargo", "run", "--locked", "-p", "xtask", "--", "check"]
pool = "bulk"
result = "exit"
timeout_seconds = 1200
scratch = "tmpfs"
cache = "none"
cap = "cargo"
unit_properties = ["MemoryHigh=8G"]

[operations.baseline]
description = "The full suite on the master-baseline checkout; the host queues it on each new master head"
exec = ["nix", "develop", "--command", "cargo", "run", "--locked", "-p", "xtask", "--", "check"]
pool = "bulk"
result = "exit"
timeout_seconds = 1200
scratch = "tmpfs"
cache = "none"
cap = "cargo"
unit_properties = ["MemoryHigh=8G"]

[operations.scenarios]
description = "End-to-end runs of the real daemon, CLI and MCP server over synthetic archives"
exec = ["nix", "develop", "--command", "cargo", "run", "--locked", "-p", "xtask", "--", "scenarios"]
pool = "bulk"
result = "exit"
timeout_seconds = 1800
scratch = "tmpfs"
cache = "none"
cap = "cargo"
unit_properties = ["MemoryHigh=8G"]

[operations.compile]
description = "Compile selected packages without waiting behind bulk qualification"
exec = ["nix", "develop", "--command", "cargo", "check", "--locked"]
arguments = "required"
pool = "normal"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"
cap = "cargo"
unit_properties = ["MemoryHigh=8G"]

[operations.focused]
description = "Selected package or test checks with the normal development queue"
exec = ["nix", "develop", "--command", "cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "test"]
arguments = "required"
pool = "normal"
result = "exit"
timeout_seconds = 1800
scratch = "tmpfs"
cache = "none"
cap = "cargo"
unit_properties = ["MemoryHigh=8G"]

[operations.package]
description = "Clean Nix build of the polylogue package (nix flake check)"
exec = ["nix", "flake", "check", "--print-build-logs"]
pool = "bulk"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"
cap = "cargo"

[operations.exec]
description = "Run a command in the Nix development shell"
exec = ["nix", "develop", "--command"]
arguments = "required"
pool = "bulk"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"

[operations.bench]
description = "Run the corpus benchmark through the shared job queue"
exec = ["nix", "develop", "--command", "cargo", "run", "--locked", "-p", "xtask", "--", "bench"]
arguments = "required"
pool = "normal"
result = "exit"
timeout_seconds = 7200
scratch = "nvme"
cache = "none"
cap = "cargo"
max_io_pressure = 5

[operations.measure]
description = "Run performance measurements without the background I/O cap"
exec = ["nix", "develop", "--command"]
arguments = "required"
pool = "normal"
result = "exit"
timeout_seconds = 7200
scratch = "nvme"
cache = "none"
cap = "cargo"
max_io_pressure = 5

[operations.fmt]
description = "Format the workspace"
exec = ["nix", "develop", "--command", "cargo", "fmt", "--all"]
pool = "normal"
result = "exit"
timeout_seconds = 300
scratch = "nvme"
cache = "none"

[operations.lock]
description = "Update selected Cargo.lock entries, e.g. -- -p serde"
exec = ["nix", "develop", "--command", "cargo", "update"]
arguments = "required"
pool = "normal"
result = "exit"
timeout_seconds = 300
scratch = "nvme"
cache = "none"

[operations.extension]
description = "Run extension npm commands: ci, test -- <files>, run validate, run build"
exec = ["nix", "develop", "--command", "env", "npm_config_cache=extension/.npm-cache", "npm", "--prefix", "extension"]
arguments = "required"
pool = "normal"
result = "exit"
timeout_seconds = 900
cache = "none"
