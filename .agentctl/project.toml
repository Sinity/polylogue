schema = 1
[project]
id = "polylogue"
display_name = "Polylogue Rust foundation"
root_markers = ["Cargo.toml", "crates"]
[environment]
kind = "direct"
command = ["env"]
inherit = ["HOME", "USER", "PATH", "LANG", "XDG_RUNTIME_DIR"]
unset = ["PYTHONPATH", "PYTHONHOME"]
[operations.foundation_check]
description = "Build and test the exact isolated foundation candidate"
exec = ["nix", "flake", "check", "--print-build-logs", "--max-jobs", "1"]
arguments = "required"
pool = "bulk"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"
[operations.foundation_build]
description = "Build explicit isolated foundation outputs"
exec = ["nix", "build", "--no-link", "--print-build-logs", "--max-jobs", "1"]
arguments = "required"
pool = "bulk"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"
[operations.foundation_exec]
description = "Run explicit Nix development-shell command in isolated foundation"
exec = ["nix", "develop", "--command"]
arguments = "required"
pool = "bulk"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"
[operations.foundation_store_tests]
description = "Run the bounded focused foundation store suite"
exec = ["nix", "develop", "--command", "cargo", "test", "--locked", "-p", "polylogue-store"]
pool = "normal"
result = "exit"
timeout_seconds = 180
scratch = "nvme"
cache = "none"

[operations.shared_file_layer_check]
description = "Package and test the standalone shared crate and disposable tag consumer"
exec = ["nix", "develop", "--command", "python3", "scripts/check-shared-file-layer.py"]
pool = "normal"
result = "exit"
timeout_seconds = 600
scratch = "nvme"
cache = "none"

[operations.shared_credential_output_check]
description = "Package and test the standalone credential crate and disposable tag consumer"
exec = ["nix", "develop", "--command", "python3", "scripts/check-shared-file-layer.py", "--package", "credential-output"]
pool = "normal"
result = "exit"
timeout_seconds = 600
scratch = "nvme"
cache = "none"

[operations.morrow_demo]
description = "Exercise packaged Morrow CLI/export or official MCP fact clients with a pinned specification oracle and retained failed-run evidence"
exec = ["nix", "develop", "--command", "python3", "scripts/check-morrow.py"]
arguments = "required"
pool = "bulk"
result = "exit"
timeout_seconds = 1800

scratch = "nvme"
cache = "none"

[operations.bounded_read_demo]
