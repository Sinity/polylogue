schema = 1
[project]
id = "polylogue"
display_name = "Polylogue research report"
root_markers = ["Cargo.toml", "crates"]
[environment]
kind = "direct"
command = ["env"]
inherit = ["HOME", "USER", "PATH", "LANG", "XDG_RUNTIME_DIR"]
[operations.exec]
description = "Wait for owned research jobs and render their measurement report; no compiler"
exec = ["python3"]
arguments = "required"
pool = "background"
result = "exit"
timeout_seconds = 14400
scratch = "nvme"
cache = "none"
unit_properties = ["MemoryHigh=512M"]
