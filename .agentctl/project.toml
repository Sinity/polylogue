schema = 1

[project]
id = "polylogue"
display_name = "Polylogue"
root_markers = ["pyproject.toml", "polylogue"]

[environment]
kind = "nix-develop"
command = ["nix", "develop", "--accept-flake-config", "--command"]
inherit = ["HOME", "USER", "LANG", "TERM", "SSH_AUTH_SOCK", "XDG_RUNTIME_DIR", "DBUS_SESSION_BUS_ADDRESS", "WAYLAND_DISPLAY", "DISPLAY", "XDG_CONFIG_HOME", "XDG_DATA_HOME", "XDG_STATE_HOME", "POLYLOGUE_PYTEST_WORKERS"]
unset = ["PYTHONPATH", "PYTHONHOME", "VIRTUAL_ENV", "_PYTHON_SYSCONFIGDATA_NAME", "_PYTHON_HOST_PLATFORM", "PYTHONPYCACHEPREFIX"]
require = ["POLYLOGUE_ARCHIVE_ROOT"]

[environment.values]
POLYLOGUE_ARCHIVE_ROOT = "/realm/state/polylogue"

[workspace]
root = "/realm/worktrees"
default_base = "origin/master"
retain_artifacts = [
  ".cache/verify/*.json",
  ".cache/verify/*.jsonl",
  ".cache/verify/*.log",
  ".cache/verify/runs/**/*.json",
  ".cache/verify/runs/**/*.jsonl",
  ".cache/verify/runs/**/*.log",
]
# One agent's hard memory ceiling. Heavy work (a live-archive census, a
# corpus scan) runs through the `scratch` operation in the bulk pool, never
# inside the agent's own process.
agent_memory_max = "3000M"
# Wave policy: a candidate lands on its verification alone; the corpus run on
# master per wave is the correctness backstop.
review = "none"
# Workers and candidates pass on the static gates and merge when the hosted
# quick gate is green; pytest runs once on master per landing wave (verify_all)
# and at the nightly boundary. A worker may still run one focused test file
# through pytest_focused when its bead names one.
verify = { focused = "verify_quick", candidate = "verify_quick", corpus = "verify_all" }
publish = "pr"

# Bounded selections run in their own pool so they never queue behind an
# affected or corpus run; the pool's 3G slice sizes them to about two
# workers through devtools' cgroup sizing.
[operations.pytest_focused]
description = "Run one managed pytest launch file, or a devtools test selection, in the host's quick pytest pool"
exec = ["python", "-m", "devtools.pytest_slot"]
pool = "pytest-quick"
result = "pytest"
cache = "none"
timeout_seconds = 7200

# Manual: the pull request's hosted `verify` check runs this for a candidate.
[operations.verify_affected]
description = "Run Polylogue's affected-test verification plan"
exec = ["devtools", "verify"]
pool = "pytest"
result = "pytest"
cache = "tree+environment"
timeout_seconds = 7200

[operations.scratch]
description = "Run one bounded script from /realm/tmp/work in the bulk pool: workers' heavy censuses and probes"
exec = ["python"]
pool = "bulk"
result = "exit"
cache = "none"
timeout_seconds = 3600

[operations.verify_quick]
description = "Run Polylogue's static fast verification gates"
exec = ["devtools", "verify", "--quick"]
pool = "normal"
result = "json"
cache = "tree+environment"
timeout_seconds = 900

[operations.seeded_archive_cache_gc]
description = "Preview or apply bounded GC for the reusable seeded-archive fixture cache"
exec = ["devtools", "cache", "gc", "--json"]
pool = "normal"
result = "json"
cache = "none"
timeout_seconds = 900

[operations.verify_all]
description = "Run Polylogue's explicit complete-corpus verification plan"
exec = ["devtools", "verify", "--all"]
# The corpus graph is published from the main checkout; a lane worktree
# cannot start it.
checkout = "default"
# Nightly master-boundary corpus: failures reach the coordinator through the
# events spool; green nights stay silent. Off-peak, odd minute by convention.
schedule = "*-*-* 03:17:00"
pool = "pytest"
result = "pytest"
cache = "tree+environment"
timeout_seconds = 14400

[operations.dev_loop_proof]
description = "Run the bounded browser-capture dev-loop proof through AgentCTL"
exec = ["python", "-m", "devtools.dev_loop_service", "--json"]
pool = "interactive"
result = "json"
cache = "none"
timeout_seconds = 900

[operations.deployment_browser_smoke]
description = "Run the fixed deployed-web browser-render smoke through AgentCTL"
exec = ["python", "-m", "devtools.deployment_browser_smoke_service", "--json"]
pool = "interactive"
result = "json"
cache = "none"
timeout_seconds = 180

[operations.live_provider_proof]
description = "Run the shared-Chrome provider proof through AgentCTL"
exec = ["python", "-m", "devtools.live_provider_proof_service", "--json"]
pool = "interactive"
result = "json"
cache = "none"
timeout_seconds = 180

# Integration helpers for the wave; verification and publication policy remain
# controlled by the project settings above.
[packets.review]
backend = "codex"
model = "gpt-5.6-luna"
effort = "high"
