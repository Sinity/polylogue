schema = 1
[project]
id = "polylogue"
display_name = "Polylogue"
root_markers = ["Cargo.toml", "crates"]
[environment]
kind = "direct"
command = ["env"]
inherit = ["HOME", "USER", "PATH", "LANG", "XDG_RUNTIME_DIR", "CARGO_TARGET_DIR"]
unset = ["PYTHONPATH", "PYTHONHOME"]

[environment.values]
# Two compile jobs keep linked test builds below MemoryHigh=8G.
CARGO_BUILD_JOBS = "2"
# Incremental state is half of each target directory and the drive is write-bound;
# agent builds rarely reuse it across commits.
CARGO_INCREMENTAL = "0"

[operations.fast]
description = "Formatting, crate boundaries and strict Clippy in the development queue"
exec = ["nix", "develop", "--command", "cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "fast"]
pool = "normal"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "tree+environment"
cap = "cargo"
unit_properties = ["MemoryHigh=8G"]
priority = 10

[operations.check]
description = "Formatting, boundaries, both clippy configurations and every test from one workspace build"
exec = ["nix", "develop", "--command", "cargo", "run", "--locked", "-p", "xtask", "--", "check"]
pool = "bulk"
result = "exit"
timeout_seconds = 1200
scratch = "tmpfs"
cache = "tree+environment"
cap = "cargo"
unit_properties = ["MemoryHigh=8G"]

[operations.baseline]
description = "The full check on the master baseline; the host queues it on each new master head"
exec = ["nix", "develop", "--command", "cargo", "run", "--locked", "-p", "xtask", "--", "check"]
pool = "bulk"
result = "exit"
timeout_seconds = 1200
scratch = "tmpfs"
cache = "tree+environment"
cap = "cargo"
unit_properties = ["MemoryHigh=8G"]

[operations.scenarios]
description = "End-to-end runs of the real daemon, CLI and MCP server over synthetic archives"
exec = ["nix", "develop", "--command", "cargo", "run", "--locked", "-p", "xtask", "--", "scenarios"]
pool = "bulk"
result = "exit"
timeout_seconds = 1800
scratch = "tmpfs"
cache = "tree+environment"
cap = "cargo"
unit_properties = ["MemoryHigh=8G"]

[operations.compile]
description = "Compile selected packages without waiting behind the full suite"
exec = ["nix", "develop", "--command", "cargo", "check", "--locked"]
arguments = "required"
pool = "normal"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "tree+environment"
cap = "cargo"
unit_properties = ["MemoryHigh=8G"]
priority = 20

[operations.focused]
description = "Selected tests (-p, -E) from the same workspace build as check, in the normal development queue"
exec = ["nix", "develop", "--command", "cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "test"]
arguments = "required"
pool = "normal"
result = "exit"
timeout_seconds = 1800
scratch = "tmpfs"
cache = "tree+environment"
cap = "cargo"
unit_properties = ["MemoryHigh=8G"]

[operations.package]
description = "Clean Nix build of the polylogue package (nix flake check)"
exec = ["nix", "flake", "check", "--print-build-logs"]
pool = "bulk"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"
cap = "cargo"

[operations.exec]
description = "Run a command in the Nix development shell"
exec = ["nix", "develop", "--command"]
arguments = "required"
pool = "bulk"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"
cap = "cargo"
unit_properties = ["MemoryHigh=8G"]

[operations.bench]
description = "Run the corpus benchmark through the shared job queue"
exec = ["nix", "develop", "--command", "cargo", "run", "--locked", "-p", "xtask", "--", "bench"]
arguments = "required"
pool = "measure"
result = "exit"
timeout_seconds = 7200
scratch = "nvme"
cache = "none"
cap = "cargo"

[operations.measure]
description = "Run a performance driver in the measure queue"
exec = ["nix", "develop", "--command"]
arguments = "required"
pool = "measure"
result = "exit"
timeout_seconds = 7200
scratch = "nvme"
cache = "none"
cap = "cargo"

[operations.fmt]
description = "Format the workspace"
exec = ["nix", "develop", "--command", "cargo", "fmt", "--all"]
pool = "interactive"
result = "exit"
timeout_seconds = 300
scratch = "nvme"
cache = "none"

[operations.lock]
description = "Update selected Cargo.lock entries, e.g. -- -p serde"
exec = ["nix", "develop", "--command", "cargo", "update"]
arguments = "required"
pool = "interactive"
result = "exit"
timeout_seconds = 300
scratch = "nvme"
cache = "none"

[operations.extension]
description = "Run extension npm commands: ci, test -- <files>, run validate, run build"
exec = ["nix", "develop", "--command", "env", "npm_config_cache=extension/.npm-cache", "npm", "--prefix", "extension"]
arguments = "required"
pool = "normal"
result = "exit"
timeout_seconds = 900
cache = "none"

[operations.codex]
description = "Run one Codex worker in this checkout: codex-worker <effort> <prompt-file> <output-schema> <output-dir> [model]"
exec = ["codex-worker"]
arguments = "required"
pool = "codex"
result = "exit"
timeout_seconds = 28800
cache = "none"
