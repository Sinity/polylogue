schema = 1

[project]
id = "polylogue"
display_name = "Polylogue"
root_markers = ["pyproject.toml", "polylogue"]

[environment]
kind = "nix-develop"
command = ["nix", "develop", "--accept-flake-config", "--command"]
preflight = ["devtools", "status", "--stderr"]
preflight_timeout_seconds = 600
inherit = ["HOME", "USER", "LANG", "TERM", "SSH_AUTH_SOCK", "XDG_RUNTIME_DIR", "DBUS_SESSION_BUS_ADDRESS", "WAYLAND_DISPLAY", "DISPLAY", "XDG_CONFIG_HOME", "XDG_DATA_HOME", "XDG_STATE_HOME"]
unset = ["PYTHONPATH", "PYTHONHOME", "VIRTUAL_ENV", "_PYTHON_SYSCONFIGDATA_NAME", "_PYTHON_HOST_PLATFORM", "PYTHONPYCACHEPREFIX"]
require = ["POLYLOGUE_ARCHIVE_ROOT"]

[environment.values]
POLYLOGUE_ARCHIVE_ROOT = "/realm/state/polylogue"

[workspace]
provider = "git-worktree"
root = "/realm/worktrees"
default_base = "origin/master"
identity_check = ["git", "diff", "--quiet", "--", "pyproject.toml", "uv.lock"]
checkpoint_untracked = true
verification_operations = ["verify_affected", "verify_quick", "verify_all"]

[conflicts]
exact_files = ["pyproject.toml", "uv.lock"]
generated_surfaces = ["docs/reference/schema-support-matrix.md"]

[conflicts.semantic_slots]
archive-schema = ["polylogue/storage/schema.py", "polylogue/storage/sqlite/migrations/*.py"]
command-catalog = ["devtools/command_catalog.py", "docs/devtools.md"]
verification-graph = ["devtools/verify.py", "pyproject.toml"]

[operations.verify_affected]
description = "Run Polylogue's affected-test verification plan"
# Eight of these run beside agent lanes; four workers each keeps the host
# at its thread count instead of three times over it.
exec = ["env", "POLYLOGUE_PYTEST_WORKERS=4", "devtools", "verify"]
pool = "pytest"
result = "pytest"
cache = "tree+environment"
timeout_seconds = 3600
exclusive_keys = ["polylogue:testmon-graph", "polylogue:seeded-archive-cache-gc"]
scratch = "nvme"

[operations.verify_quick]
description = "Run Polylogue's static fast verification gates"
exec = ["devtools", "verify", "--quick"]
pool = "normal"
result = "pytest"
cache = "tree+environment"
timeout_seconds = 900

[operations.seeded_archive_cache_gc]
description = "Preview or apply bounded GC for the reusable seeded-archive fixture cache"
exec = ["devtools", "cache", "gc", "--json"]
pool = "normal"
result = "json"
cache = "none"
timeout_seconds = 900
exclusive_keys = ["polylogue:seeded-archive-cache-gc"]
scratch = "nvme"

[operations.seeded_archive_cache_gc.parameters.apply]
type = "bool"
flag = "--apply"

[operations.verify_all]
description = "Run Polylogue's explicit complete-corpus verification plan"
exec = ["env", "POLYLOGUE_PYTEST_WORKERS=8", "devtools", "verify", "--all"]
# Admission claim only; the bulk unit's own ceiling is 20 GiB. The 2026-09-02
# run peaked at 6 GB, and a 16 GB claim never fits beside six agent lanes.
estimate_memory_bytes = 8000000000
# The corpus graph is published from the main checkout; a lane worktree
# cannot start it.
checkout = "default"
# Nightly master-boundary corpus: failures reach the coordinator through the
# events spool; green nights stay silent. Off-peak, odd minute by convention.
schedule = "*-*-* 03:17:00"
pool = "pytest"
result = "pytest"
cache = "tree+environment"
timeout_seconds = 14400
exclusive_keys = ["polylogue:testmon-graph", "polylogue:seeded-archive-cache-gc"]
scratch = "nvme"

[operations.dev_loop_proof]
description = "Run the bounded browser-capture dev-loop proof through AgentCTL"
exec = ["python", "-m", "devtools.dev_loop_service", "--json"]
pool = "interactive"
result = "json"
cache = "none"
timeout_seconds = 900
exclusive_keys = ["polylogue:dev-loop-proof"]
scratch = "nvme"

[operations.dev_loop_proof.service]
readiness = "project-command"
lifetime = "job"

[operations.dev_loop_proof.service.ports.api]
environment = "POLYLOGUE_API_PORT"
range = [48800, 48863]

[operations.dev_loop_proof.service.ports.browser_capture]
environment = "POLYLOGUE_BROWSER_CAPTURE_PORT"
range = [48864, 48927]

[operations.deployment_browser_smoke]
description = "Run the fixed deployed-web browser-render smoke through AgentCTL"
exec = ["python", "-m", "devtools.deployment_browser_smoke_service", "--json"]
pool = "interactive"
result = "json"
cache = "none"
timeout_seconds = 180
exclusive_keys = ["polylogue:deployment-browser-smoke"]
scratch = "nvme"

[operations.live_provider_proof]
description = "Run the shared-Chrome provider proof through AgentCTL"
exec = ["python", "-m", "devtools.live_provider_proof_service", "--json"]
pool = "interactive"
result = "json"
cache = "none"
timeout_seconds = 180
exclusive_keys = ["polylogue:live-provider-proof"]
scratch = "nvme"

[operations.live_provider_proof.service]
readiness = "project-command"
lifetime = "job"

[operations.live_provider_proof.service.ports.browser_capture]
environment = "POLYLOGUE_LIVE_PROVIDER_RECEIVER_PORT"
range = [49120, 49183]

[operations.harvest]
description = "Review a finished lane, then publish it under an authorized receipt"
exec = ["sinnixd-harvest"]
pool = "normal"
result = "json"
cache = "none"
timeout_seconds = 7200
scratch = "nvme"

[operations.harvest.verdict]
# The domain verdict decides the terminal phase: a refused publication
# (red gate, rebase conflict) must not read as a succeeded job (sinnix-u9if).
success = ["HARVEST_OK", "HARVEST_EMPTY"]
refusal = ["GATE_RED", "REBASE_CONFLICT", "NO_TEST_EVIDENCE"]
failure = ["HARVEST_ERROR"]

[operations.harvest.parameters.authorize]
type = "bool"
flag = "--authorize"

[operations.harvest.parameters.publish]
type = "bool"
flag = "--publish"

[operations.harvest.parameters.close]
type = "bool"
flag = "--close"

[operations.harvest.parameters.no_watch]
type = "bool"
flag = "--no-watch"

[operations.harvest.parameters.receipt_ref]
type = "string"
flag = "--receipt-ref"
max_length = 128
grammar = "safe-token"

[operations.harvest.parameters.affected_job]
type = "string"
flag = "--affected-job"
max_length = 64

[operations.harvest.parameters.lane_job_id]
type = "string"
flag = "--lane-job-id"
max_length = 128
grammar = "safe-token"

[operations.harvest.parameters.bead_id]
type = "string"
flag = "--bead-id"
max_length = 128
grammar = "safe-token"

[operations.harvest.parameters.title_file]
type = "string"
flag = "--title-file"
max_length = 128
grammar = "path"

[operations.harvest.parameters.body_file]
type = "string"
flag = "--body-file"
max_length = 128
grammar = "path"

[operations.harvest.parameters.close_reason_file]
type = "string"
flag = "--close-reason-file"
max_length = 128
grammar = "path"

[owner_adapters.polylogue_archive]
namespace = "polylogue.archive"
owner = "polylogue-archive"
authority = "owner"
lifecycle = "read_only"
protocol_versions = [1]
source_scoped = true
source_ref = "sinnix://polylogue/archive"
exec = ["polylogue-agentctl-adapter"]
timeout_seconds = 300
documentation = "Argument-free, generation-pinned, bounded Polylogue archive status."

[operations.publication_sweep]
description = "Converge open publication PRs: merge on clean hosted review, spool findings and conflicts"
exec = ["sinnixd-publication-sweep", "--repo", "Sinity/polylogue", "--project", "polylogue", "--project-root", "/realm/project/polylogue"]
schedule = "*:0/10"
pool = "normal"
result = "json"
cache = "none"
timeout_seconds = 300
