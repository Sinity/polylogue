schema = 1
[project]
id = "polylogue"
display_name = "Polylogue"
root_markers = ["Cargo.toml", "crates"]
[environment]
kind = "direct"
command = ["env"]
inherit = ["HOME", "USER", "PATH", "LANG", "XDG_RUNTIME_DIR", "SINEXD", "SCCACHE_DIR"]
unset = ["CARGO_TARGET_DIR", "PYTHONPATH", "PYTHONHOME"]

[environment.values]
# Share CPU and memory with other builds.
CARGO_BUILD_JOBS = "2"
# Avoid extra incremental-cache reads and writes on the shared drive.
CARGO_INCREMENTAL = "0"

[operations.fast]
description = "Formatting and strict Clippy"
exec = ["nix", "develop", "--command", "cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "fast"]
pool = "compile"
environment = { CARGO_BUILD_JOBS = "4" }
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
unit_properties = ["MemoryHigh=8G"]

[operations.compile]
description = "Type-check selected packages and targets; pass further Cargo check arguments"
exec = ["nix", "develop", "--command", "cargo", "check", "--locked"]
arguments = "required"
pool = "compile"
environment = { CARGO_BUILD_JOBS = "4" }
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
unit_properties = ["MemoryHigh=8G"]

[operations.check]
description = "Formatting, both clippy configurations and all tests"
exec = ["nix", "develop", "--command", "cargo", "run", "--locked", "-p", "xtask", "--", "check"]
pool = "bulk"
result = "exit"
timeout_seconds = 7200
scratch = "tmpfs"
cache = "none"
unit_properties = ["MemoryHigh=8G"]

[operations.scenarios]
description = "End-to-end runs of the real daemon, CLI and MCP server over synthetic archives"
exec = ["nix", "develop", "--command", "cargo", "run", "--locked", "-p", "xtask", "--", "scenarios"]
pool = "bulk"
result = "exit"
timeout_seconds = 1800
scratch = "tmpfs"
cache = "none"
unit_properties = ["MemoryHigh=8G"]

[operations.focused]
description = "Run selected tests, building only the selected packages' test targets; Cargo target flags bound it further"
exec = ["nix", "develop", "--command", "cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "test"]
arguments = "required"
# Test builds run beside type checks (compile pool); admission holds
# either while the job plane lacks memory for it.
pool = "normal"
result = "exit"
timeout_seconds = 3600
scratch = "tmpfs"
unit_properties = ["MemoryHigh=8G"]

[operations.package]
description = "Full locked Nix checks: package, source, modules and services"
exec = ["nix", "flake", "check", "--print-build-logs"]
pool = "bulk"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"

[operations.exec]
description = "Run a command in the Nix development shell"
exec = ["nix", "develop", "--command"]
arguments = "required"
pool = "bulk"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"
unit_properties = ["MemoryHigh=8G"]

[operations.measure]
description = "A measurement in the one-at-a-time measure queue: a benchmark (cargo run --locked --release -p xtask -- bench ...), an archive rebuild with a prebuilt binary, or a measurement driver"
# Paid embedding calls stay off; measurements yield to interactive work.
exec = ["nix", "develop", "--command", "env", "-u", "VOYAGE_API_KEY", "ionice", "-c", "2", "-n", "7", "nice", "-n", "10"]
arguments = "required"
pool = "measure"
result = "exit"
timeout_seconds = 10800
scratch = "nvme"
cache = "none"
# A full-archive rebuild peaks near 10 GiB; admission waits for that much
# rather than starting a run its memory limit would kill.
admission = { memory_mib = 10240 }
unit_properties = ["CPUWeight=20", "IOWeight=20", "MemoryHigh=10G", "MemoryMax=14G", "MemorySwapMax=2G"]

[operations.fmt]
description = "Format the workspace"
exec = ["env", "CARGO_TARGET_DIR=target", "nix", "develop", ".#format", "--command", "cargo", "fmt", "--all"]
pool = "interactive"
result = "exit"
timeout_seconds = 300
scratch = "nvme"
cache = "none"

[operations.lock]
description = "Update selected Cargo.lock entries, e.g. -- -p serde"
exec = ["env", "CARGO_TARGET_DIR=target", "nix", "develop", "--command", "cargo", "update"]
arguments = "required"
pool = "interactive"
result = "exit"
timeout_seconds = 300
scratch = "nvme"
cache = "none"

[operations.extension]
environment = { CARGO_TARGET_DIR = "target" }
description = "Run extension npm commands: ci, test -- <files>, run validate, run build"
exec = ["nix", "develop", "--command", "npm", "--prefix", "extension", "--cache", "extension/.npm-cache"]
arguments = "required"
pool = "normal"
result = "exit"
timeout_seconds = 900
cache = "none"

[operations.extension_package]
description = "Build extension artifacts and check Nix formatting"
exec = ["nix", "build", "--no-link", "--print-build-logs", "--print-out-paths", ".#polylogue-extension", ".#checks.x86_64-linux.nix-fmt"]
environment = { CARGO_TARGET_DIR = "target" }
pool = "normal"
result = "exit"
timeout_seconds = 900
scratch = "nvme"
cache = "none"

[operations.codex]
description = "Run one Codex worker in this checkout: codex-worker <effort> <prompt-file> <output-schema> <output-dir> [model]"
exec = ["codex-worker"]
arguments = "required"
pool = "codex"
result = "exit"
timeout_seconds = 28800
cache = "none"
