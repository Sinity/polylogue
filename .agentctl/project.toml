schema = 1

[project]
id = "polylogue"
display_name = "Polylogue"
root_markers = ["pyproject.toml", "polylogue"]

[environment]
kind = "nix-develop"
command = ["nix", "develop", "--accept-flake-config", "--command"]
inherit = ["HOME", "USER", "LANG", "TERM", "SSH_AUTH_SOCK", "XDG_RUNTIME_DIR", "DBUS_SESSION_BUS_ADDRESS", "WAYLAND_DISPLAY", "DISPLAY", "XDG_CONFIG_HOME", "XDG_DATA_HOME", "XDG_STATE_HOME"]
unset = ["PYTHONPATH", "PYTHONHOME", "VIRTUAL_ENV", "_PYTHON_SYSCONFIGDATA_NAME", "_PYTHON_HOST_PLATFORM", "PYTHONPYCACHEPREFIX"]
require = ["POLYLOGUE_ARCHIVE_ROOT"]

[environment.values]
POLYLOGUE_ARCHIVE_ROOT = "/realm/state/polylogue"

[workspace]
root = "/realm/worktrees"
default_base = "origin/master"

[operations.verify_affected]
description = "Run Polylogue's affected-test verification plan"
exec = ["env", "POLYLOGUE_PYTEST_WORKERS=2", "devtools", "verify"]
pool = "pytest"
result = "pytest"
cache = "tree+environment"
timeout_seconds = 3600

[operations.verify_quick]
description = "Run Polylogue's static fast verification gates"
exec = ["devtools", "verify", "--quick"]
pool = "normal"
result = "json"
cache = "tree+environment"
timeout_seconds = 900

[operations.seeded_archive_cache_gc]
description = "Preview or apply bounded GC for the reusable seeded-archive fixture cache"
exec = ["devtools", "cache", "gc", "--json"]
pool = "normal"
result = "json"
cache = "none"
timeout_seconds = 900

[operations.verify_all]
description = "Run Polylogue's explicit complete-corpus verification plan"
exec = ["env", "POLYLOGUE_PYTEST_WORKERS=2", "devtools", "verify", "--all"]
# The corpus graph is published from the main checkout; a lane worktree
# cannot start it.
checkout = "default"
# Nightly master-boundary corpus: failures reach the coordinator through the
# events spool; green nights stay silent. Off-peak, odd minute by convention.
schedule = "*-*-* 03:17:00"
pool = "pytest"
result = "pytest"
cache = "tree+environment"
timeout_seconds = 14400

[operations.dev_loop_proof]
description = "Run the bounded browser-capture dev-loop proof through AgentCTL"
exec = ["python", "-m", "devtools.dev_loop_service", "--json"]
pool = "interactive"
result = "json"
cache = "none"
timeout_seconds = 900

[operations.deployment_browser_smoke]
description = "Run the fixed deployed-web browser-render smoke through AgentCTL"
exec = ["python", "-m", "devtools.deployment_browser_smoke_service", "--json"]
pool = "interactive"
result = "json"
cache = "none"
timeout_seconds = 180

[operations.live_provider_proof]
description = "Run the shared-Chrome provider proof through AgentCTL"
exec = ["python", "-m", "devtools.live_provider_proof_service", "--json"]
pool = "interactive"
result = "json"
cache = "none"
timeout_seconds = 180
