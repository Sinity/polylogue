schema = 1
[project]
id = "polylogue"
display_name = "Polylogue"
root_markers = ["Cargo.toml", "crates"]
[environment]
kind = "direct"
command = ["env", "-u", "CARGO_TARGET_DIR"]
inherit = ["HOME", "USER", "PATH", "LANG", "XDG_RUNTIME_DIR"]
unset = ["CARGO_TARGET_DIR", "PYTHONPATH", "PYTHONHOME"]

[environment.values]
# Share CPU and memory with other builds.
CARGO_BUILD_JOBS = "2"
# Avoid extra incremental-cache reads and writes on the shared drive.
CARGO_INCREMENTAL = "0"

[operations.fast]
description = "Formatting, crate boundaries and strict Clippy"
exec = ["nix", "develop", "--command", "cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "fast"]
pool = "compile"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"
unit_properties = ["MemoryHigh=8G"]

[operations.check]
description = "Formatting, boundaries, both clippy configurations and all tests"
exec = ["nix", "develop", "--command", "cargo", "run", "--locked", "-p", "xtask", "--", "check"]
pool = "bulk"
result = "exit"
timeout_seconds = 7200
scratch = "tmpfs"
cache = "none"
unit_properties = ["MemoryHigh=8G"]

[operations.scenarios]
description = "End-to-end runs of the real daemon, CLI and MCP server over synthetic archives"
exec = ["nix", "develop", "--command", "cargo", "run", "--locked", "-p", "xtask", "--", "scenarios"]
pool = "bulk"
result = "exit"
timeout_seconds = 1800
scratch = "tmpfs"
cache = "none"
unit_properties = ["MemoryHigh=8G"]

[operations.focused]
description = "Build selected packages with all their features and run selected tests; native target flags are supported"
exec = ["nix", "develop", "--command", "cargo", "run", "--locked", "--quiet", "-p", "xtask", "--", "test"]
arguments = "required"
pool = "compile"
result = "exit"
timeout_seconds = 3600
scratch = "tmpfs"
cache = "none"
unit_properties = ["MemoryHigh=8G"]

[operations.package]
description = "Full locked Nix checks: package, source, modules and services"
exec = ["nix", "flake", "check", "--print-build-logs"]
pool = "bulk"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"

[operations.exec]
description = "Run a command in the Nix development shell"
exec = ["nix", "develop", "--command"]
arguments = "required"
pool = "bulk"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"
unit_properties = ["MemoryHigh=8G"]

[operations.bench]
description = "Run the corpus benchmark through the shared job queue"
exec = ["nix", "develop", "--command", "cargo", "run", "--locked", "-p", "xtask", "--", "bench"]
arguments = "required"
pool = "measure"
result = "exit"
timeout_seconds = 7200
scratch = "nvme"
cache = "none"

[operations.measure]
description = "Build and run a performance driver in the measure queue; for a run that compiles nothing, use measure_run"
exec = ["nix", "develop", "--command"]
arguments = "required"
pool = "measure"
result = "exit"
timeout_seconds = 7200
scratch = "nvme"
cache = "none"

[operations.measure_run]
description = "Run a measurement that compiles nothing (a database restore, a benchmark of prebuilt binaries) in the measure queue"
exec = ["nix", "develop", "--command"]
arguments = "required"
pool = "measure"
result = "exit"
timeout_seconds = 7200
scratch = "nvme"
cache = "none"

[operations.fmt]
description = "Format the workspace"
exec = ["env", "CARGO_TARGET_DIR=target", "nix", "develop", "--command", "cargo", "fmt", "--all"]
pool = "interactive"
result = "exit"
timeout_seconds = 300
scratch = "nvme"
cache = "none"

[operations.lock]
description = "Update selected Cargo.lock entries, e.g. -- -p serde"
exec = ["nix", "develop", "--command", "cargo", "update"]
arguments = "required"
pool = "interactive"
result = "exit"
timeout_seconds = 300
scratch = "nvme"
cache = "none"

[operations.extension]
description = "Run extension npm commands: ci, test -- <files>, run validate, run build"
exec = ["nix", "develop", "--command", "env", "npm_config_cache=extension/.npm-cache", "npm", "--prefix", "extension"]
arguments = "required"
pool = "normal"
result = "exit"
timeout_seconds = 900
cache = "none"

[operations.codex]
description = "Run one Codex worker in this checkout: codex-worker <effort> <prompt-file> <output-schema> <output-dir> [model]"
exec = ["codex-worker"]
arguments = "required"
pool = "codex"
result = "exit"
timeout_seconds = 28800
cache = "none"

[operations.rebuild_archive]
description = "Rebuild an archive using explicit prebuilt binary and deployment arguments"
exec = ["env", "-u", "VOYAGE_API_KEY", "ionice", "-c", "2", "-n", "7", "nice", "-n", "10"]
arguments = "required"
pool = "measure"
result = "exit"
timeout_seconds = 0
scratch = "none"
cache = "none"
admission = { memory_mib = 10240 }
unit_properties = ["CPUWeight=20", "IOWeight=20", "MemoryHigh=10G", "MemoryMax=14G", "MemorySwapMax=2G"]

[operations.import_preserved]
description = "Import preserved sources with an explicit prebuilt command and retained reports"
exec = ["env", "-u", "VOYAGE_API_KEY", "ionice", "-c", "3", "nice", "-n", "19"]
arguments = "required"
pool = "measure"
result = "exit"
timeout_seconds = 0
scratch = "none"
cache = "none"
admission = { memory_mib = 512 }
unit_properties = ["CPUWeight=20", "IOWeight=20", "MemoryHigh=1G"]
