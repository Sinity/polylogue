# Project-scoped Codex agent registry for polylogue.
#
# Parent model and permission defaults belong to the selected home profile.
# This file declares bounded roles; explicit dispatch chooses the intended
# role/model rather than relying on the fallback below.

[agents]
enabled = true
max_concurrent_threads_per_session = 24
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"

[agents.architect]
description = "Bounded architectural decisions, migration design, and conflicting invariants. Astra, high reasoning, read-only."
config_file = "agents/architect.toml"

[agents.worker]
description = "Bounded correctness/architecture-reduction implementer, one lane, one worktree. Terra, high reasoning, full write."
config_file = "agents/worker.toml"

[agents.reviewer]
description = "Independent adversarial reviewer of a worker's diff. Terra, high reasoning, read-only."
config_file = "agents/reviewer.toml"

[agents.triage]
description = "Evidence-first bead/audit triage at volume: already-satisfied detection, footprint clustering, census work. Luna, medium reasoning, read-only."
config_file = "agents/triage.toml"

[agents.narrow_worker]
description = "Executes a fully-specified lane -- a red test/fixture, or a whole already-decided architectural refactor -- without re-deriving the design. Luna, high reasoning, full write."
config_file = "agents/narrow-worker.toml"
