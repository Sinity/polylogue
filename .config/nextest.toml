# Run through `cargo run -p xtask -- check`, which also puts temporary files
# on tmpfs. Each test runs in its own process.

[profile.default]
# A test still running after two minutes is hung: report it at 30 s and
# terminate it after four periods.
slow-timeout = { period = "30s", terminate-after = 4 }
fail-fast = false

# The engine's property laws run many generated archives each; on a loaded
# host they legitimately take minutes.
[[profile.default.overrides]]
filter = "package(polylogue-engine) and test(/^laws::/)"
slow-timeout = { period = "60s", terminate-after = 6 }
