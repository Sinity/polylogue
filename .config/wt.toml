# worktrunk project hooks: a new worktree is ready for `devtools` when
# `wt switch --create` returns. Worktree paths come from the user config.

# Blocking, in order. The venv uses the primary checkout's interpreter: the
# lockfile pins the package set, and the interpreter must match it exactly or
# testmon records a different environment and re-executes everything.
[[pre-start]]
venv = "_PYTHON_SYSCONFIGDATA_NAME=_sysconfigdata_t_linux_x86_64-linux-gnu uv sync --extra dev --group audit --frozen --python \"$(readlink -f \"{{ primary_worktree_path }}/.venv/bin/python\")\""

# The testmon graph is keyed by content and repo-relative path, so the
# primary checkout's datafile is valid here as soon as it is snapshotted. The
# snapshot goes through SQLite's backup API because a concurrent run may be
# writing the source; the provision check then discards a datafile the
# installed testmon would not read.
[[pre-start]]
seed = "_PYTHON_SYSCONFIGDATA_NAME=_sysconfigdata_t_linux_x86_64-linux-gnu .venv/bin/python -m devtools.testmon_provision --seed \"{{ primary_worktree_path }}/.cache/testmon/testmondata\""
