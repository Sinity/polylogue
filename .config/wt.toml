# worktrunk project hooks: a new worktree is ready for `devtools` when
# `wt switch --create` returns. Worktree paths come from the user config.

# Blocking, in order. The venv uses the primary checkout's interpreter: the
# lockfile pins the package set, and the interpreter must match it exactly or
# testmon records a different environment and re-executes everything.
[[pre-start]]
venv = "uv sync --extra dev --frozen --python \"$(readlink -f {{ primary_worktree_path }}/.venv/bin/python)\""

# The testmon graph is keyed by content and repo-relative path, so the
# primary checkout's datafile is valid here as soon as it is copied; the
# provision check discards a copy the installed testmon would not read.
[[pre-start]]
seed = "mkdir -p .cache/testmon && cp -f {{ primary_worktree_path }}/.cache/testmon/testmondata .cache/testmon/testmondata 2>/dev/null; .venv/bin/python -m devtools.testmon_provision"
