id: replace-without-parent-fsync
language: Python
severity: warning
message: "os.replace path lacks a recognized parent-directory fsync; owner fhikb"
rule:
  all:
    - pattern: os.replace($$$)
    - inside:
        kind: function_definition
        not:
          has:
            any:
              - pattern: _fsync_directory($PATH.parent)
              - pattern: _fsync_dir($PATH.parent)
              - inside:
                  kind: function_definition
                  all:
                    - has:
                        pattern: os.open($PATH.parent, $$$)
                        stopBy: end
                    - has:
                        pattern: os.fsync($$$)
                        stopBy: end
                  stopBy: end
            stopBy: end
        stopBy: end
