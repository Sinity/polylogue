id: sqlite-error-default
language: Python
severity: warning
message: "bare sqlite3.Error handler returns a measurement/read default; owner fesmz"
rule:
  all:
    - any:
        - pattern: return True
        - pattern: return 0
        - pattern: return ""
        - pattern: return {}
        - pattern: return []
    - inside:
        kind: except_clause
        regex: '^except sqlite3\.Error:'
        stopBy: end
